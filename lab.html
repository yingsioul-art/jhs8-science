<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動手做實驗室｜八年級自然</title>
<!--
  八上自然 動手做實驗室（lab.html）
  原始檔：D:\Zettelkasten\20_教學\國中自然科學\八上動手做\lab_src.html＋labs_*.js
  產生：python _build_lab.py（內嵌 _共用\handlab.js，輸出到 C:\dev\jhs8-science\lab.html）
  localStorage key：jhs8-lab-v1（只記哪些實驗做完）
  實驗步驟照康軒第三冊課本轉錄（_課本實驗轉錄_四個樣品.md）
-->
<style>
:root{
  --bg:#f4f1ff; --card:#ffffff; --ink:#22203a; --sub:#5d5a78; --line:#e3def7;
  --pri:#5b4bdb; --ok:#1f9d55; --okbg:#e3f7ea; --bad:#d64545; --badbg:#fde8e8; --gold:#f5a524;
  --shadow:0 4px 0 rgba(40,30,110,.10), 0 8px 24px rgba(40,30,110,.07); --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16142a; --card:#221f3d; --ink:#f1efff; --sub:#b4b0d6; --line:#37335e;
    --pri:#8f82ff; --okbg:#173b27; --badbg:#47202a; --shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 96px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:820px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
.top a,.top button{border:2px solid var(--line);background:var(--card);border-radius:14px;font-weight:800;padding:6px 14px;min-height:44px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.top b{flex:1;text-align:right;font-size:.9em;color:var(--sub)}
header{padding:28px 0 8px}
.kicker{font-size:13px;letter-spacing:.2em;color:var(--pri);font-weight:800}
h1{font-size:1.8em;margin:6px 0;line-height:1.3}
h2{font-size:1.25em;margin:8px 0;line-height:1.35}
h3{font-size:1.05em;margin:18px 0 6px}
.muted{color:var(--sub);font-size:.9em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.xp{border:0;text-align:left;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-height:96px;border-left:7px solid var(--c,var(--pri))}
.xp .ic{font-size:34px;flex:none}
.xp b{display:block}
.xp small{color:var(--sub);display:block;line-height:1.45}
.xp .done{color:var(--ok);font-weight:800}
.soon{opacity:.55}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--pri);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 60%,#000);min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pri) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.gold{background:var(--gold);color:#3b2300;box-shadow:0 4px 0 #b97300}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;min-height:44px}
.chip.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 16%,var(--card))}
.ex{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:14px;padding:12px 14px;margin-top:8px}
.warn{background:var(--badbg);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.92em}
.readout{font-size:1.05em;font-weight:800;margin-top:8px}
.sim{position:relative}
.sim label{font-weight:700;display:block;margin-top:10px}
.sim input[type=range]{width:100%;height:36px;accent-color:var(--pri)}
.simview{background:color-mix(in srgb,var(--pri) 6%,var(--card));border-radius:16px;padding:10px;margin-top:10px;text-align:center}
.simview svg{width:100%;height:auto}
table.rec{border-collapse:collapse;width:100%;font-size:.9em;margin-top:8px}
table.rec th,table.rec td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.rec th{background:color-mix(in srgb,var(--pri) 10%,var(--card))}
/* 動手做：拖曳器材、出事＋急救（與七上生物站同一套） */
.hand svg{touch-action:none;user-select:none;-webkit-user-select:none;max-height:440px}
.hand [data-it]{cursor:grab}
.hand [data-it].sel{filter:drop-shadow(0 0 5px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.htask{background:color-mix(in srgb,var(--pri) 10%,var(--card));border-left:5px solid var(--pri);border-radius:12px;padding:8px 12px;margin-top:10px;font-weight:700}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .22s ease-in-out infinite alternate}
.flame.out{animation:none;transform:scale(0);transition:transform 1.2s}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.9,1.12)}}
.bub{animation:bub 1s linear infinite}
@keyframes bub{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.acc{position:absolute;inset:0;z-index:6;border-radius:var(--r);background:rgba(42,10,5,.93);color:#fff;padding:72px 16px 16px;overflow:auto}
.acc h2{color:#ffd23f;margin:4px 0}
.accpic svg{width:100%;max-height:150px}
.acc .ao{display:block;width:100%;text-align:left;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;min-height:48px;font-weight:700}
.acc .ao.bad{border-color:#ff8a8a;background:rgba(255,77,77,.25)}
.qo{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin:6px 0;min-height:48px;font-weight:700}
.qo.bad{border-color:#e03131;opacity:.55;text-decoration:line-through}
.acc .ao.ok{border-color:#7be3a1;background:rgba(31,157,85,.35)}
.accnote{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;margin-top:8px}
.accnote.ok{background:rgba(31,157,85,.35)}
.hctl{position:sticky;top:64px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding:6px;border-radius:14px;background:color-mix(in srgb,var(--card) 92%,transparent)}
.hctl .btn{flex:1;min-width:0;padding:8px 6px;font-size:.88em;min-height:44px}
.hpause{position:absolute;inset:0;z-index:8;border-radius:var(--r);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(3px);text-align:center;font-size:1.4em;font-weight:900;color:var(--ink);padding-top:230px}
.hpause>div{position:sticky;top:260px;background:var(--card);border-radius:16px;padding:12px;margin:0 16px;box-shadow:var(--shadow)}
.hpause small{font-size:.6em;font-weight:700;color:var(--sub)}
.paused .flame,.paused .bub{animation-play-state:paused}
.shake{animation:shake .45s 2}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.flame,.bub,.shake{animation:none}}
/* 強光閃白（鎂帶在氧氣中燃燒）：整個畫面瞬間變白、停一下、再慢慢恢復 */
.whiteout{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(circle,#ffffff 0%,#ffffff 55%,#fff8d6 100%);animation:whiteout 2.6s ease-out forwards}
@keyframes whiteout{0%{opacity:0}6%{opacity:1}40%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.whiteout{animation-duration:1.2s}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;transition:transform .25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:60;animation:cf 1.6s linear forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="top"><div class="in"><a href="index.html">← 首頁</a><button id="backlab" hidden>← 實驗清單</button><b id="pnum"></b></div></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
let AC; function beep(ok){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = ok ? 880 : 220; g.gain.value = .06; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (ok ? .12 : .25)); }catch(e){} }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function confetti(){ const C = ["#5b4bdb", "#f5a524", "#1f9d55", "#e84393", "#2f80ed"]; for(let i = 0; i < 40; i++){ const d = document.createElement("i"); d.className = "cf"; d.style.left = Math.random() * 100 + "vw"; d.style.background = C[i % 5]; d.style.animationDelay = Math.random() * .5 + "s"; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); } }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const say = (t, ok) => `<div class="${ok ? "ex" : "warn"}">${t}</div>`;
const KEY = "jhs8-lab-v1";
let DONE = {}; try{ DONE = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ DONE = {}; }
function labDone(id){ if(!DONE[id]){ DONE[id] = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(DONE)); }catch(e){} toast("🔬 完成這個實驗！"); } }
/* 每個實驗：LABS.push({id, ch, icon, title, page, desc, run(pane)}) */
const LABS = [];
const CHAPTERS = [["intro1", "緒論＋第 1 章 基本測量"], ["ch2", "第 2 章 物質的世界"], ["ch34", "第 3、4 章 波動、聲音與光"], ["ch5", "第 5 章 溫度與熱"], ["ch6", "第 6 章 探索物質組成"]];
/* 燙傷畫面（5-1、5-2 共用） */
const BURN_SVG = `<svg viewBox="0 0 240 110"><rect x="0" y="92" width="240" height="18" rx="4" fill="#6b4a2f"/><text x="120" y="80" font-size="60" text-anchor="middle">✋</text><g stroke="#ff6b6b" stroke-width="4" fill="none" opacity=".85"><path d="M80 40 q8 -12 0 -24"/><path d="M160 40 q8 -12 0 -24"/><path d="M120 22 q8 -10 0 -20"/></g></svg>`;
/* ═══ 動手做實驗引擎（七上生物站 sims3.js、八上自然 lab.html 共用；build 時內嵌） ═══
   提供：handDnd 拖曳／點選放置、handAccident 出事＋急救關卡、handCtl 暫停／上一步／全部重來、flameP 火焰
   頁面需先提供：toast(msg)、beep(ok)、shuffle(arr)、confetti() */
/* 共用：拖曳或「先點器材、再點目的地」；cb.drop(id, x, y) 用 SVG 座標；cb.tap(id) 回傳 true 表示已當成動作處理 */
function handDnd(svg, cb){
  let sel = null;
  const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const mark = () => svg.querySelectorAll("[data-it]").forEach(x => x.classList.toggle("sel", x.dataset.it === sel));
  svg.addEventListener("pointerdown", e => {
    const g = e.target.closest("[data-it]");
    if(!g){ if(sel){ const id = sel, p = pt(e); sel = null; cb.drop(id, p.x, p.y); } return; }
    e.preventDefault();
    const p0 = pt(e), base = g.getAttribute("transform") || ""; let moved = false;
    svg.setPointerCapture(e.pointerId);
    g.parentNode.appendChild(g);
    const mv = ev => { const p = pt(ev), dx = p.x - p0.x, dy = p.y - p0.y; if(Math.hypot(dx, dy) > 5) moved = true; if(moved) g.setAttribute("transform", `translate(${dx} ${dy}) ${base}`); };
    const up = ev => {
      svg.removeEventListener("pointermove", mv); svg.removeEventListener("pointerup", up); svg.removeEventListener("pointercancel", up);
      const id = g.dataset.it;
      if(moved){ sel = null; g.setAttribute("transform", base); const p = pt(ev); cb.drop(id, p.x, p.y); return; }
      if(sel && sel !== id){ const s0 = sel, p = pt(ev); sel = null; cb.drop(s0, p.x, p.y); return; }
      if(cb.tap && cb.tap(id) === true){ sel = null; return; }
      sel = sel === id ? null : id; mark();
      if(sel && cb.name) toast(`已拿起「${cb.name(sel)}」，再點要放的位置`);
    };
    svg.addEventListener("pointermove", mv); svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  });
}
/* 按鈕列：內容變了才重建，點擊用事件委派。
   畫面每秒重畫好幾次（倒液體、冒氣泡）時，按到一半的按鈕才不會被換掉而點不到 */
function handBtns(box, html, act){
  if(box._h !== html){ box._h = html; box.innerHTML = html; }
  box.onclick = e => { const b = e.target.closest("[data-b]"); if(b && !b.disabled) act(b.dataset.b); };
}
const inR = (x, y, r) => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3];

/* 火焰：(x, y) 是火焰底部中心 */
function flameP(x, y, h, w, c1, c2, d){
  const P = (H, W) => `M${x} ${y} C${x - W} ${y - H * .4} ${x - W * .25} ${y - H * .75} ${x} ${y - H} C${x + W * .25} ${y - H * .75} ${x + W} ${y - H * .4} ${x} ${y} Z`;
  return `<g class="flame" style="animation-delay:${d || 0}s"><path d="${P(h, w)}" fill="${c1}"/><path d="${P(h * .55, w * .5)}" fill="${c2}"/></g>`;
}
const FIRE_SVG = `<svg viewBox="0 0 240 110"><rect x="0" y="92" width="240" height="18" rx="4" fill="#6b4a2f"/>
  ${flameP(40, 94, 48, 20, "#ff6a1f", "#ffd23f", .1)}${flameP(80, 94, 78, 28, "#ff4d1f", "#ffcf3a", 0)}${flameP(122, 94, 96, 32, "#ff5a1f", "#ffe066", .15)}
  ${flameP(165, 94, 70, 26, "#ff4d1f", "#ffcf3a", .05)}${flameP(205, 94, 44, 18, "#ff6a1f", "#ffd23f", .2)}</svg>`;
const BREAK_SVG = `<svg viewBox="0 0 240 110"><rect x="0" y="92" width="240" height="18" rx="4" fill="#6b4a2f"/>
  <ellipse cx="120" cy="92" rx="95" ry="7" fill="#8ecdf0" opacity=".8"/>
  <path d="M85 92 l10 -40 l14 8 l-6 32 z M125 92 l4 -34 l16 6 l-4 28z M150 90 l18 -18 l8 10 l-12 10z M70 90 l-14 -10 l6 -6 l14 12z" fill="#dfe8ef" stroke="#fff" stroke-width="2" opacity=".9"/>
  <g stroke="#fff" stroke-width="2" opacity=".7"><path d="M60 40 q6 -10 0 -20"/><path d="M120 34 q6 -10 0 -20"/><path d="M180 40 q6 -10 0 -20"/></g></svg>`;

/* 出事畫面＋急救關卡：答對急救題才能回去重做 */
function handAccident(card, cfg, onBack){
  const el = document.createElement("div"); el.className = "acc";
  const opts = shuffle(cfg.opts);
  el.innerHTML = `<div class="accpic">${cfg.pic || FIRE_SVG}</div>
    <h2>${cfg.title}</h2><p style="margin:0">${cfg.cause}</p>
    <p style="margin:8px 0 0;font-weight:800">🚨 ${cfg.q}</p>
    <div>${opts.map((o, i) => `<button class="ao" data-i="${i}">${o.t}</button>`).join("")}</div><div class="accfb"></div>`;
  card.appendChild(el); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); beep(false);
  el.scrollIntoView({block: "nearest", behavior: "smooth"});
  el.querySelectorAll(".ao").forEach(b => b.onclick = () => {
    const o = opts[+b.dataset.i], fb = el.querySelector(".accfb");
    if(!o.ok){ b.classList.add("bad"); b.disabled = true; beep(false); fb.innerHTML = `<div class="accnote">❌ ${o.why}</div>`; return; }
    b.classList.add("ok"); beep(true);
    el.querySelectorAll(".ao").forEach(x => x.disabled = true);
    el.querySelectorAll(".flame").forEach(f => f.classList.add("out"));
    fb.innerHTML = `<div class="accnote ok">✅ ${o.why}</div><div class="accnote">🔴 出事原因：${cfg.lesson}</div>
      <button class="btn gold" style="margin-top:8px" data-back>🔁 回到出事前，再做一次</button>`;
    fb.querySelector("[data-back]").onclick = () => { el.remove(); onBack(); };
  });
}
const FIRE_Q = {q: "桌上起火了！你第一步要怎麼做？", opts: [
  {t: "用濕抹布蓋住火焰，並大聲報告老師", ok: true, why: "蓋住火焰隔絕氧氣，火就會熄滅；同時報告老師處理。"},
  {t: "趕快拿水潑上去", why: "酒精起火時潑水，燒著的酒精可能隨水流到處擴散，火反而變大。"},
  {t: "用嘴用力把火吹熄", why: "吹氣會送進更多氧氣，還可能把火吹向自己。"},
  {t: "把酒精燈拿起來丟進水槽", why: "拿起燃燒中的燈會燙傷，酒精灑出來火勢更大。"}]};

/* 共用控制列：暫停／上一步／全部重來；o = {canUndo, undo, reset}
   ctl.wait(ms, fn)：暫停時不倒數；按上一步或重來後，還沒到時間的動作一律作廢 */
function handCtl(card, o){
  const ctl = {paused: false, gen: 0};
  const bar = document.createElement("div"); bar.className = "hctl";
  bar.innerHTML = `<button class="btn ghost" data-c="pause">⏸ 暫停</button><button class="btn ghost" data-c="undo">↩ 上一步</button><button class="btn ghost" data-c="reset">🔁 全部重來</button>`;
  card.insertBefore(bar, card.querySelector(".htask"));
  const pz = document.createElement("div"); pz.className = "hpause";
  pz.innerHTML = `<div>⏸ 已暫停<br><small>按上方「▶ 繼續」回到實驗</small></div>`;
  const pb = bar.querySelector("[data-c=pause]");
  const setPause = v => { ctl.paused = v; card.classList.toggle("paused", v); pb.textContent = v ? "▶ 繼續" : "⏸ 暫停"; if(v) card.appendChild(pz); else pz.remove(); };
  bar.onclick = e => {
    const b = e.target.closest("[data-c]"); if(!b) return;
    if(b.dataset.c === "pause") return setPause(!ctl.paused);
    setPause(false); ctl.gen++;
    const acc = card.querySelector(".acc"); if(acc) acc.remove();
    b.dataset.c === "undo" ? o.undo() : o.reset();
  };
  ctl.wait = (ms, fn) => { const g = ctl.gen; let left = ms; const t = setInterval(() => { if(g !== ctl.gen){ clearInterval(t); return; } if(ctl.paused) return; left -= 100; if(left <= 0){ clearInterval(t); fn(); } }, 100); };
  ctl.upd = () => { bar.querySelector("[data-c=undo]").disabled = !o.canUndo(); };
  return ctl;
}


/* ═════ 緒論 實驗器材、熱源、容器、藥品的使用（課本 p.5–8） ═════
   一關一關把器材拖到正確的地方；每關的規則照課本原文（_課本實驗轉錄_其餘實驗.md）。
   康軒酒精燈的酒精量是 1/2～2/3（七上南一是 1/3～2/3），這裡照康軒。

  function trayPos(n, text){
    const per = 4, w = 360 / Math.min(per, Math.max(n, 1));

  }

      const r = s.rule(k, z, S.st);

  function graph(){
    const box = pane.querySelector("#mgraph");
    if(!["graph", "metal", "disp0", "slide", "disp1", "ratio", "done"].includes(S.phase)){ box.style.display = "none"; return; }
    box.style.display = "";
    const ymax = S.sub ? 60 : 120, X = v => 40 + v * 5.6, Y = m => 200 - m * 180 / ymax;
    let g = `<line x1="40" y1="200" x2="324" y2="200" stroke="var(--ink)"/><line x1="40" y1="200" x2="40" y2="14" stroke="var(--ink)"/>
      <text x="324" y="232" font-size="11" text-anchor="end" fill="var(--ink)">體積（cm³）</text><text x="44" y="14" font-size="11" fill="var(--ink)">質量（g）</text>`;
    for(let v = 10; v <= 50; v += 10) g += `<text x="${X(v)}" y="214" font-size="10" text-anchor="middle" fill="var(--sub)">${v}</text>`;
    for(let m = ymax / 4; m <= ymax; m += ymax / 4) g += `<text x="34" y="${Y(m) + 4}" font-size="10" text-anchor="end" fill="var(--sub)">${m}</text><line x1="40" x2="324" y1="${Y(m)}" y2="${Y(m)}" stroke="var(--line)"/>`;
    for(const [k, c, n] of [["water", "#2f80ed", "水"], ["alc", "#d64545", "酒精"]]){
      const P = S.rows[k].map(r => [r.v, S.sub ? r.M - S.mCyl : r.M]);
      if(!P.length) continue;
      const rho = RHO[k], y0 = S.sub ? 0 : CYL + off();
      g += `<line x1="${X(0)}" y1="${Y(y0)}" x2="${X(52)}" y2="${Y(y0 + rho * 52)}" stroke="${c}" stroke-width="2" opacity=".55"/>`;
      g += P.map(([v, m]) => `<circle cx="${X(v)}" cy="${Y(m)}" r="4.5" fill="${c}"/>`).join("") + `<text x="${X(52)}" y="${Y(y0 + rho * 52) - 6}" font-size="11" text-anchor="end" fill="${c}" font-weight="700">${n}</text>`;
    }
    if(!S.sub) g += `<text x="182" y="30" font-size="11" text-anchor="middle" fill="var(--bad)">體積 0 時質量不是 0？直線沒有通過原點</text>`;
    pane.querySelector("#mgv").innerHTML = g;
  }
  function draw(msg){
    svg.innerHTML = scene() + trayKeys().map(trayIcon).join("");
    pane.querySelector("#mtask").innerHTML = TASK[S.phase];
    pane.querySelector("#mread").textContent = S.pend ? "量筒倒好了，選視線位置讀刻度 👇" : S.phase === "disp0" || S.phase === "disp1" ? "選視線位置讀刻度 👇" : "";
    const B = [];
    if(["tare", "water", "alc", "metal"].includes(S.phase) && !S.tared && !S.onBal) B.push(`<button class="btn ghost" data-b="tare">⚖️ 按歸零</button>`);
    if(S.pend || S.phase === "disp0" || S.phase === "disp1") Object.keys(EYE).forEach(k => B.push(`<button class="btn ghost" data-b="eye-${k}">👁 ${EYE[k][1]}</button>`));
    if(S.phase === "graph" && !S.sub) B.push(`<button class="btn" data-b="sub">➖ 扣除空量筒質量</button>`);
    if(S.phase === "graph" && S.sub && S.qSub && !S.qProp) ["正比", "反比", "沒有關係"].forEach(t => B.push(`<button class="btn ghost" data-b="prop-${t}">${t}</button>`));
    if(S.phase === "graph" && S.sub && !S.qSub) ["量筒也有質量，要扣掉才是液體的質量", "讓數字比較小、比較好畫", "因為量筒會吸水"].forEach((t, i) => B.push(`<button class="btn ghost" data-b="qs-${i}">${t}</button>`));
    if(S.phase === "slide") B.push(`<button class="btn ghost" data-b="drop">直接把金屬塊丟進直立的量筒</button><button class="btn ghost" data-b="tilt">把量筒傾斜，讓金屬塊緩緩滑入</button>`);
    if(S.phase === "ratio") METAL.forEach(([n]) => B.push(`<button class="btn ghost" data-b="metal-${n}">${n}</button>`));
    if(S.phase === "done") B.push(`<button class="btn ghost" data-b="again">🔁 再做一次</button>`);
    const box = pane.querySelector("#mbtn"); box.innerHTML = B.join("");
    box.querySelectorAll("[data-b]").forEach(b => b.onclick = () => actT(b.dataset.b));
    pane.querySelector("#mrec").innerHTML = recTable();
    graph();
    if(msg !== undefined) pane.querySelector("#mfb").innerHTML = msg;
    ctl.upd();
  }
  function act(b){
    if(b === "again"){ hist.length = 0; init(); accN = 0; return draw(""); }
    if(b === "tare"){ S.tared = true; beep(true); return draw(say("✅ 天平歸零了，顯示 0.0 g。", true)); }
    if(b.startsWith("eye-")){
      const k = b.slice(4), [d, n] = EYE[k], bad = k !== "mid";
      const why = bad ? `${n}讀到的刻度${d > 0 ? "偏高" : "偏低"}。讀量筒刻度時，<b>視線要和液面中央處等高</b>。` : "";
      if(S.pend){
        const v = VOLS[S.i], M = CYL + RHO[S.liq] * v + off();
        S.rows[S.liq].push({v: v + d, M, bad}); S.i++; S.pend = false;
        if(S.i === 5){ if(S.liq === "water"){ S.phase = "alc"; S.liq = null; S.i = 0; } else { S.phase = "graph"; S.onBal = null; } }
        return draw(bad ? say("⚠️ " + why + "這一筆記錄的體積不準，圖上的點會偏離直線。") : say(`✅ 讀到 ${f1(v)} mL，總質量 ${f1(M)} g，記下來了。`, true));
      }
      if(S.phase === "disp0"){ S.v0 = 50 + d; S.phase = "slide"; return draw(bad ? say("⚠️ " + why) : say("✅ 水面在 50.0 mL。", true)); }
      if(S.phase === "disp1"){ S.v1 = 55 + d; S.phase = "ratio"; return draw(bad ? say("⚠️ " + why) : say(`✅ 水面升到 55.0 mL，金屬塊體積＝55.0－${f1(S.v0)}＝${f1(S.v1 - S.v0)} cm³。<br>質量÷體積＝${f1(S.mBlock)}÷${f1(S.v1 - S.v0)}＝<b>${(S.mBlock / (S.v1 - S.v0)).toFixed(2)}</b>。對照附表，最接近哪一種？`, true)); }
    }
    if(b === "sub"){ S.sub = true; return draw(say("扣除空量筒質量以後，兩條線都通過原點了！想一想：為什麼要先扣除空量筒的質量？（步驟Q）")); }
    if(b.startsWith("qs-")){
      if(b !== "qs-0") return draw(say("再想想：沒扣除時，體積 0 的地方質量卻不是 0——多出來的是什麼？"));
      S.qSub = true; return draw(say("✅ 量筒本身有質量，扣掉才是液體的質量。<br>再看圖：水和酒精都是<b>通過原點的直線</b>，體積變 3 倍、質量也變 3 倍。同一物質的質量和體積呈現什麼關係？", true));
    }
    if(b.startsWith("prop-")){
      if(b !== "prop-正比") return draw(say("看圖：體積從 10 變 30（3 倍），質量也變 3 倍，而且直線通過原點。"));
      S.qProp = true; S.phase = "metal"; beep(true);
      return draw(say("✅ 物質的質量與體積<b>成正比</b>。同體積時水比酒精重，所以水的直線比較陡——用傾斜度可以分辨不同物質。", true));
    }
    if(b === "drop"){
      accN++;
      return setTimeout(() => handAccident(card, {pic: BREAK_SVG, title: "💥 量筒底部被砸破了！",
        cause: "金屬塊直接丟進直立的量筒，重重撞到筒底，「啪」一聲，玻璃破了、水灑滿桌！",
        q: "量筒破了，碎玻璃和水在桌上！你第一步要怎麼做？", opts: [
          {t: "不要用手碰碎玻璃，立刻報告老師處理", ok: true, why: "碎玻璃很鋒利，用手撿會割傷；要報告老師，用掃把、畚箕清理。"},
          {t: "趕快用手把碎玻璃撿起來", why: "碎玻璃很鋒利，徒手撿容易割傷。"},
          {t: "用抹布直接把碎玻璃和水一起擦掉", why: "抹布會把碎片推來推去，手隔著布也可能被割傷。"},
          {t: "換一支量筒，繼續把金屬塊丟進去", why: "沒改正做法就繼續，會再破一次。"}],
        lesson: "放入金屬塊時，應<b>將量筒傾斜，緩緩滑入</b>金屬塊，以免損壞量筒。"},
        () => draw(say("回到出事前。金屬塊要怎麼放進量筒才安全？"))), 400);
    }
    if(b === "tilt"){ S.slid = true; S.phase = "disp1"; beep(true); return draw(say("✅ 量筒傾斜、金屬塊沿著筒壁緩緩滑到底，水面上升了。", true)); }
    if(b.startsWith("metal-")){
      const n = b.slice(6), r = S.mBlock / (S.v1 - S.v0), near = METAL.reduce((a, c) => Math.abs(c[1] - r) < Math.abs(a[1] - r) ? c : a)[0];
      if(n !== near) return draw(say(`你算出的比值是 ${r.toFixed(2)}，附表裡最接近的不是${n}喔，再比一比。`));
      if(near !== "鐵"){
        const cause = [!S.tared ? "一開始<b>天平沒歸零</b>，金屬塊的質量多了 4.0 g" : "", S.v0 !== 50 || S.v1 !== 55 ? "讀量筒刻度時<b>視線沒有和液面中央等高</b>" : ""].filter(Boolean).join("；");
        return draw(say(`依你的數據會推測是${near}，但這塊其實是<b>鐵</b>（7.87）！原因：${cause || "數據有誤差"}。按「↩ 上一步」或「🔁 全部重來」，修正後再做一次。`));
      }
      S.phase = "done"; confetti(); beep(true); labDone(L.id);
      return draw(say(`🎉 比值 ${r.toFixed(2)} 最接近<b>鐵</b>（7.87）！每種物質的質量與體積比值是固定的，可以用來分辨物質種類。${accN ? `（途中出事 ${accN} 次，都靠急救化解了）` : ""}`, true));
    }
    draw();
  }
  const setTimeout = (fn, ms) => ctl.wait(ms, fn);
  const actT = track(act);
  handDnd(svg, {
    name: k => NAME[k],
    drop: track(function(k, x, y){
      const BAL = [30, 80, 200, 286];
      if(k === "cyl"){
        if(!inR(x, y, BAL)){ toast("放到天平的秤盤上"); return draw(); }
        S.onBal = "cyl"; S.mCyl = CYL + off(); S.phase = "water";
        return draw(S.tared ? say(`✅ 空量筒質量 ${f1(S.mCyl)} g，記下來了。量筒要放穩再離手，以免摔落。`, true)
          : say(`⚠️ 天平沒有歸零就放量筒，顯示 ${f1(S.mCyl)} g——比真正的質量多了 ${f1(OFF)} g。這個錯誤會跟著後面每一次秤重……`));
      }
      if(k === "water" || k === "alc"){
        if(!inR(x, y, [70, 60, 160, 230])){ toast("倒進天平上的量筒"); return draw(); }
        if(S.phase === "alc" && !S.liq) S.liq = "alc";
        if(S.phase === "water" && !S.liq) S.liq = "water";
        if(S.liq !== k){ toast(`這一步要倒${NAME[S.liq]}`); return draw(); }
        S.pend = true; return draw("");
      }
      if(k === "block"){
        if(!inR(x, y, BAL)){ toast("放到天平的秤盤上"); return draw(); }
        S.onBal = "block"; S.mBlock = BLOCK.m + off(); S.phase = "disp0";
        return draw(say(`金屬塊質量 ${f1(S.mBlock)} g，記下來了。`, S.tared));
      }
      draw();
    })});
  draw("");
}});

/* ═════ 實驗 2-1 混合物的分離（康軒第三冊 p.39–41） ═════
   1 製作混合物（食鹽、沙子各約 2 g）→ 2 直接以濾紙過濾 → 3 溶解過濾（20 mL 蒸餾水、玻璃棒攪拌；
   濾紙摺成 1/4→外層撕去一小角→展開成錐狀→放入漏斗以蒸餾水潤溼；漏斗頸下端緊貼燒杯內壁；沿玻璃棒倒；液面不超過濾紙 2/3）
   → 4 蒸發結晶（約 5 mL 濾液、蓋漏斗或錶玻璃、完全蒸乾即熄火、降溫後才取下）→ 5 紗布過濾比較 */
LABS.push({id: "separate", ch: "ch2", icon: "🧂", title: "實驗 2-1 混合物的分離", page: "p.39–41",
  desc: "食鹽和沙子混在一起，怎麼分開？摺濾紙、架過濾裝置、蒸發結晶，做錯會濺出、乾燒或燙傷。",
  run(pane, L){
  const NAME = {salt: "食鹽 2 g", sand: "沙子 2 g", mix: "混合物（秤量紙）", rod: "玻璃棒", funnel: "漏斗（已放濾紙）", beaker: "空燒杯", filt: "濾液約 5 mL", cover: "漏斗（倒蓋）", watch: "錶玻璃"};
  const FOLD = ["濾紙對摺再對摺，摺成 1/4", "外層撕去一小角", "展開成錐狀", "放入漏斗，用蒸餾水潤溼"];
  let S, accN = 0, holdT = null;
  function init(){ S = {phase: "mix", salt: false, sand: false, direct: false, inWater: false, stirred: false, fold: [], foldOrder: shuffle([0, 1, 2, 3]),
    funnel: false, beaker: null, rod: false, lvl: 0, poured: 0, filt: 0, cloudy: false,
    dish: false, cover: null, heat: false, w: 1, dry: 0, temp: 25, salted: false, gauze: false}; }
  init();
  pane.innerHTML = `<div class="card sim hand">
    <p class="muted" style="margin:0">把上排器材<b>拖到實驗桌</b>上的正確位置（或先點器材、再點位置）。做錯會出事喔！（課本 p.39–41）</p>
    <div class="htask" id="stask"></div>
    <div class="simview"><svg viewBox="0 0 360 310" id="ssv"></svg><div class="readout" id="sread"></div></div>
    <div class="row" id="sbtn" style="margin-top:8px"></div>
    <div id="sfb"></div></div>`;
  const card = pane.querySelector(".hand"), svg = pane.querySelector("#ssv");
  const hist = [], cur = () => JSON.stringify(S);
  const stopHold = () => { clearInterval(holdT); holdT = null; };
  const track = fn => (...a) => { const pre = cur(); const r = fn(...a); if(pre !== cur() && !["heating", "cooling"].includes(JSON.parse(pre).phase)) hist.push(pre); ctl.upd(); return r; };
  const ctl = handCtl(card, {
    canUndo: () => hist.length > 0,
    undo(){ stopHold(); let o; do { o = hist.pop(); } while(o && o === cur() && hist.length); if(o){ S = JSON.parse(o); S.heat = false; if(S.phase === "heating") S.phase = "evap"; if(S.phase === "cooling") S.phase = "evap"; draw(say("↩ 回到上一步。", true)); } },
    reset(){ stopHold(); hist.length = 0; init(); accN = 0; draw(say("🔁 全部重來。", true)); }});
  const setTimeout = (fn, ms) => ctl.wait(ms, fn);
  const TASK = {
    mix: "① 製作混合物：把<b>食鹽</b>和<b>沙子</b>倒在中間的秤量紙上。",
    direct: "② 把混合物直接倒進濾紙裡，觀察食鹽與沙子能否通過濾紙。",
    dissolve: "③ 把混合物倒進裝有 20 mL 蒸餾水的燒杯，再用<b>玻璃棒</b>攪拌。",
    fold: "③ 準備濾紙：依正確順序點下每一個步驟。",
    stand: "③ 架設過濾裝置：把<b>漏斗</b>放到鐵架的鐵環上，再把<b>空燒杯</b>放到漏斗下面。漏斗頸下端要放在哪裡？（燒杯放好後還可以拖曳或按「↔ 移動燒杯」調整）",
    pour: "③ 過濾：先擺好<b>玻璃棒</b>，再<b>按住「倒入」</b>把混合液倒進濾紙，注意液面高度。",
    evap: "④ 蒸發結晶：把<b>濾液</b>倒進蒸發皿，決定要不要蓋東西，再點火加熱。",
    heating: "④ 加熱中……水分完全蒸乾就要熄火！",
    cooling: "④ 熄火了。蒸發皿什麼時候可以拿下來？",
    gauze: "⑤ 把濾紙換成紗布，過濾成分相同的混合物，比一比濾液。",
    done: "🎉 實驗完成！"};
  /* ── 畫面 ── */
  const bench = `<rect x="0" y="292" width="360" height="18" fill="#b98a5a" opacity=".45"/>`;
  const pile = (x, y, c, n) => Array.from({length: n}, (_, i) => `<circle cx="${x + (i % 5) * 5 - 10 + (i % 2)}" cy="${y - Math.floor(i / 5) * 3}" r="2.6" fill="${c}"/>`).join("");
  function beakerG(x, w, h, liq, extra){
    const bot = 290, top = bot - h;
    return `${liq ? `<rect x="${x + 3}" y="${bot - h * liq.lv}" width="${w - 6}" height="${h * liq.lv - 3}" fill="${liq.c}" opacity=".85"/>` : ""}${extra || ""}
      <path d="M${x - 4} ${top} h4 V${bot - 5} q0 5 5 5 H${x + w - 5} q5 0 5 -5 V${top} h4" fill="#ffffff18" stroke="var(--sub)" stroke-width="2.5"/>`;
  }
  // 燒杯放好、還沒開始倒（沒有倒過、手也沒按著）時可以移動
  const canMove = () => (S.phase === "stand" || S.phase === "pour") && S.beaker && !S.poured && !holdT;
  function standG(){
    return `<rect x="262" y="284" width="70" height="8" rx="2" fill="#5b5f66"/><rect x="292" y="60" width="6" height="226" fill="#5b5f66"/>
      <rect x="214" y="146" width="80" height="5" fill="#5b5f66"/><ellipse cx="180" cy="148" rx="36" ry="5" fill="none" stroke="#5b5f66" stroke-width="4"/>`;
  }
  function funnelG(){
    // 漏斗：上緣 y=118（x146–214），尖端 (180,170)，漏斗頸到 y=212
    const L = S.lvl, yl = 170 - L * 50, hw = (170 - yl) / 52 * 34;
    let g = `<path d="M150 122 L180 166 L210 122 Z" fill="#fbfaf6" stroke="#cfc8b8"/>`;
    if(S.phase === "direct" && S.direct) g += pile(180, 160, "#d8b37a", 8) + pile(176, 156, "#fff", 6);
    if(S.poured > .05) g += pile(180, 163, "#c9a46a", Math.min(14, Math.round(S.poured * 14)));
    if(L > .01) g += `<path d="M${180 - hw} ${yl} L180 170 L${180 + hw} ${yl} Z" fill="${S.cloudy ? "#c8b48a" : "#a7d3ee"}" opacity=".85"/>`;
    g += `<line x1="160" x2="200" y1="${170 - .67 * 50}" y2="${170 - .67 * 50}" stroke="#d64545" stroke-dasharray="3 3"/><text x="214" y="${170 - .67 * 50 + 4}" font-size="9" fill="#d64545">2/3</text>`;
    g += `<path d="M146 118 L177 170 V212 H183 V170 L214 118" fill="#ffffff20" stroke="var(--sub)" stroke-width="2.5"/>`;
    if(S.rod) g += `<line x1="120" y1="70" x2="168" y2="152" stroke="#9fd6ff" stroke-width="5" stroke-linecap="round"/>`;
    return g;
  }
  function scene(){
    let g = bench;
    const P = S.phase;
    if(P === "mix"){
      g += `<path d="M120 268 L180 250 L240 268 L180 286 Z" fill="#fff" stroke="#cfc8b8"/>`;
      if(S.sand) g += pile(170, 270, "#d8b37a", 12);
      if(S.salt) g += pile(192, 268, "#ffffff", 12).replace(/fill="#ffffff"/g, 'fill="#fff" stroke="#bbb" stroke-width=".6"');
      g += `<text x="180" y="304" font-size="11" text-anchor="middle" fill="var(--ink)">秤量紙</text>`;
    }
    if(P === "direct"){ g += standG() + funnelG() + beakerG(145, 70, 70, null); }
    if(P === "dissolve" || P === "fold"){
      const liq = {c: S.inWater && !S.stirred ? "#cbbd96" : "#cfe8f7", lv: .5};
      g += beakerG(140, 80, 90, liq, (S.inWater ? pile(180, 284, "#c9a46a", 14) : "") + (S.stirred ? `<line x1="168" y1="190" x2="186" y2="282" stroke="#9fd6ff" stroke-width="5" stroke-linecap="round"/>` : ""));
      g += `<text x="180" y="306" font-size="11" text-anchor="middle" fill="var(--ink)">${S.inWater ? (S.stirred ? "食鹽溶解，沙子沉在杯底" : "還沒攪拌") : "20 mL 蒸餾水"}</text>`;
    }
    if(P === "stand" || P === "pour" || P === "gauze"){

    if(phase === "collect") B.push(S.sealed ? `<button class="btn" data-b="lift">⬆ 移出水面、瓶口朝上</button>` : `<button class="btn" data-b="seal">🪟 在水中蓋上玻璃片</button>`, ...(S.sealed ? [] : [`<button class="btn ghost" data-b="lift">⬆ 直接移出水面</button>`]));

  }
  /* ── 動作 ── */
  let lastAdd = [];
  function addH2O2(){
    if(!S.pure){ toast("先由薊頭漏斗緩慢加約 2 mL 純水"); return draw(); }

      title: "💥 雙氧水從漏斗上方溢出！", cause: "雙氧水加太快、氣泡太急，瓶內壓力把液體從薊頭漏斗上方推出來，噴到手上了！",

          return draw(say(bad ? `😕 線香在氧氣瓶裡只亮了一點點，和空氣瓶差不多——<b>收集到的氧氣不純</b>。原因：${why.join("；")}。<br>按「🔁 全部重來」再做一次，看看純氧會怎樣！`
            : `🎉 線香放進<b>氧氣瓶</b>立刻冒出明亮火焰，在<b>空氣瓶</b>只有小紅點：氧氣具有<b>助燃性</b>。<br>氧氣不易溶於水，所以能用<b>排水集氣法</b>收集。${accN ? `（途中出事 ${accN} 次）` : ""}`, !bad));
        }

        if(k === "mghand"){

          return handAccident(card, {title: "💥 手被燙傷了！", cause: "直接用手拿著鎂帶靠近火焰，鎂帶一點著就發出高溫強光，手指被燙傷了！",
            q: "手被燙到了，第一步要怎麼做？", opts: [
              {t: "立刻用流動的冷水沖洗患部，並報告老師", ok: true, why: "冷水可以帶走熱、減輕燙傷；同時請老師處理。"},

          if(z === "o2"){                              // 整個畫面閃白：強光刺眼的感覺
            const w = document.createElement("div"); w.className = "whiteout"; document.body.appendChild(w);
            window.setTimeout(() => w.remove(), 2700);
          }
          setTimeout(() => {
            S.mg.out = true;
            if(z === "air"){
              S.mg.air = true;
              draw(say("鎂帶在空氣中也能燃燒（空氣裡約有 21% 的氧氣），但亮度比不上純氧。燒完熄滅，留下白色粉末。<br>換一條新的鎂帶，放進<b>氧氣瓶</b>比比看。"));
              return setTimeout(() => { S.mg = {heat: false, lit: false, where: null, out: false, air: true}; draw(); }, 1800);
            }
            phase = "done"; confetti(); beep(true); labDone(L.id);
            draw(say(`🎉 鎂帶在氧氣中燒得比在空氣中<b>更劇烈、更亮</b>，燒完就熄滅，留下<b>白色粉末</b>（氧化鎂）。再次證明氧氣具有<b>助燃性</b>。<br>瓶底留少許水，可以防止高溫的燃燒物掉落，讓瓶底受熱破裂。${accN ? `（途中出事 ${accN} 次）` : ""}`, true));
          }, 2500);
          return;
        }
      }
      draw();
    })});
  draw("");
}});

/* ═════ 實驗 4-3 透鏡的成像觀察（課本 p.112–115，圖 4-36、4-37） ═════
   拖曳蠟燭（物距）與紙屏（像距）找最清楚的像，再把成像性質填進記錄表。
   焦距固定 10 cm；像的位置用透鏡公式算（課本不教公式，畫面只呈現結果）。
   出錯：像還模糊就記錄、蠟燭不在該列的位置、紙屏接不到就以為沒有像、性質勾錯 */
LABS.push({id: "lens", ch: "ch34", icon: "🔍", title: "實驗 4-3 透鏡的成像觀察", page: "p.112–115",
  desc: "移動蠟燭和紙屏找出最清楚的像，比較凸透鏡、凹透鏡的成像。", run(pane, L){
  const F = 10, PX = 5.6, LX = 180, AX = 150;            // 焦距 cm、每 cm 幾 px、透鏡 x、主軸 y
  const ROWS = [
    {k: "A", lens: "convex", n: "2 倍焦距外", ok: p => p > 2 * F + .5, ans: {kind: "實像", dir: "倒立", size: "縮小", pos: "鏡後的焦距與 2 倍焦距間"}},
    {k: "B", lens: "convex", n: "2 倍焦距上", ok: p => Math.abs(p - 2 * F) <= .5, ans: {kind: "實像", dir: "倒立", size: "等大", pos: "鏡後的 2 倍焦距上"}},
    {k: "C", lens: "convex", n: "焦距～2 倍焦距間", ok: p => p > F + .5 && p < 2 * F - .5, ans: {kind: "實像", dir: "倒立", size: "放大", pos: "鏡後的 2 倍焦距外"}},
    {k: "D", lens: "convex", n: "焦距上", ok: p => Math.abs(p - F) <= .5, ans: {kind: "無法成像"}},
    {k: "E", lens: "convex", n: "焦距內", ok: p => p < F - .5, ans: {kind: "虛像", dir: "正立", size: "放大", pos: "鏡前（和物體同側）"}},
    {k: "凹A", lens: "concave", n: "焦距外", ok: p => p > F + .5, ans: {kind: "虛像", dir: "正立", size: "縮小", pos: "鏡前（和物體同側）"}},
    {k: "凹B", lens: "concave", n: "焦距內", ok: p => p < F - .5, ans: {kind: "虛像", dir: "正立", size: "縮小", pos: "鏡前（和物體同側）"}}];
  const OPT = {kind: ["實像", "虛像", "無法成像"], dir: ["正立", "倒立"], size: ["放大", "縮小", "等大"],
               pos: ["鏡後的焦距與 2 倍焦距間", "鏡後的 2 倍焦距上", "鏡後的 2 倍焦距外", "鏡前（和物體同側）"]};
  let S;
  function init(){ S = {lens: "convex", p: 30, s: 15, rec: {}, look: false, row: 0}; }
  init();
  pane.innerHTML = `<div class="card sim hand">
    <p class="muted" style="margin:0">左右拖曳<b>🕯️ 蠟燭</b>改變物距、拖曳<b>紙屏</b>改變像距（也可以用下面的滑桿）。凸透鏡焦距 10 cm，F＝焦點、2F＝2 倍焦距。</p>
    <div class="htask" id="ltask"></div>
    <div class="chips" id="lens"></div>
    <div class="simview"><svg viewBox="0 0 360 230" id="lsv"></svg><div class="readout" id="lread"></div></div>
    <label>物距（蠟燭到透鏡）：<span id="pv"></span></label><input type="range" id="pr" min="3" max="30" step="0.5">
    <label>像距（紙屏到透鏡）：<span id="sv"></span></label><input type="range" id="sr" min="3" max="30" step="0.5">
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="look">👁 從紙屏那一端透過透鏡看</button></div>
    <div id="lform"></div><div id="lfb"></div>
    <h3>📋 記錄表</h3><div id="ltab"></div></div>`;
  const card = pane.querySelector(".hand"), svg = pane.querySelector("#lsv");
  const hist = [], cur = () => JSON.stringify(S);
  const ctl = handCtl(card, {
    canUndo: () => hist.length > 0,
    undo(){ let o; do { o = hist.pop(); } while(o && o === cur() && hist.length); if(o){ S = JSON.parse(o); draw(say("↩ 回到上一步。", true)); } },
    reset(){ hist.length = 0; init(); draw(say("🔁 全部重來。", true)); }});
  const push = () => { if(hist[hist.length - 1] !== cur()) hist.push(cur()); };
  /* 成像計算：回傳 {real, q（cm，鏡後為正）, m（放大率）}；蠟燭在焦點上回傳 {none} */
  function image(){
    const p = S.p;
    if(S.lens === "concave"){ const q = -1 / (1 / F + 1 / p); return {real: false, q, m: -q / p}; }
    if(Math.abs(p - F) < .01) return {none: true};
    const q = 1 / (1 / F - 1 / p);
    return {real: q > 0, q, m: -q / p};
  }
  const X = cm => LX + cm * PX;
  function candle(x, h, inv, dash, blur){
    const s = h / 40, g = inv ? -1 : 1;
    return `<g transform="translate(${x} ${AX}) scale(${s} ${s * g})" ${inv || dash ? 'pointer-events="none"' : ""} ${dash ? 'opacity=".55"' : ""} ${blur ? `filter="url(#bl${Math.min(6, Math.max(1, Math.round(blur)))})"` : ""}>
      <rect x="-5" y="-30" width="10" height="30" fill="#f4e7c3" stroke="${dash ? "#888" : "#b89b5e"}" ${dash ? 'stroke-dasharray="3 2"' : ""}/>
      <path d="M0 -44 C-6 -36 -5 -31 0 -30 C5 -31 6 -36 0 -44Z" fill="#ff9f1c"/><path d="M0 -40 C-3 -35 -2 -32 0 -31 C2 -32 3 -35 0 -40Z" fill="#fff3a0"/></g>`;
  }
  const fmt = a => a.kind === "無法成像" ? "無法成像" : `${a.kind}、${a.dir}、${a.size}；${a.pos}`;
  function draw(msg){
    const im = image(), pX = X(-S.p), sX = X(S.s);
    let g = `<defs>${[1, 2, 3, 4, 5, 6].map(i => `<filter id="bl${i}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${i * .9}"/></filter>`).join("")}</defs>`
      + `<line x1="8" x2="352" y1="${AX}" y2="${AX}" stroke="var(--sub)" stroke-dasharray="4 4"/><rect x="8" y="${AX + 34}" width="344" height="8" rx="3" fill="#8a8f96"/>`;
    [-2, -1, 1, 2].forEach(k => { const x = X(k * F); g += `<line x1="${x}" x2="${x}" y1="${AX - 4}" y2="${AX + 4}" stroke="#d64545" stroke-width="2"/><text x="${x}" y="${AX + 30}" text-anchor="middle" font-size="12" fill="#d64545" font-weight="700">${Math.abs(k) === 2 ? "2F" : "F"}</text>`; });
    g += S.lens === "convex" ? `<path d="M${LX} ${AX - 60} Q${LX + 14} ${AX} ${LX} ${AX + 60} Q${LX - 14} ${AX} ${LX} ${AX - 60}Z" fill="#bfe3ff" stroke="#2f80ed" stroke-width="2" opacity=".85"/>`
      : `<path d="M${LX - 9} ${AX - 60} H${LX + 9} Q${LX + 2} ${AX} ${LX + 9} ${AX + 60} H${LX - 9} Q${LX - 2} ${AX} ${LX - 9} ${AX - 60}Z" fill="#bfe3ff" stroke="#2f80ed" stroke-width="2" opacity=".85"/>`;
    g += `<g data-it="candle">${candle(pX, 40)}<rect x="${pX - 14}" y="${AX - 50}" width="28" height="84" fill="transparent"/></g>`;
    g += `<g data-it="screen"><rect x="${sX - 3}" y="${AX - 62}" width="6" height="124" fill="#ffffff" stroke="var(--sub)" stroke-width="1.5"/><rect x="${sX - 14}" y="${AX - 62}" width="28" height="124" fill="transparent"/></g>`;
    let read;
    if(im.none) read = "蠟燭在焦點上：光線經透鏡後平行射出，紙屏上只有一片模糊的光。";
    else if(im.real){
      const blur = Math.abs(S.s - im.q) * 1.2, h = Math.min(110, 40 * Math.abs(im.m));
      if(im.q > 30) read = "像在很遠的地方，紙屏移到最遠也接不到清楚的像。";
      else read = blur < .7 ? "✨ 紙屏上的像很清楚！" : blur < 4 ? "紙屏上看得到像，但有點模糊……前後移動紙屏" : "紙屏上一片模糊的光";
      if(im.q <= 30 && blur < 8) g += `<g opacity="${Math.max(.25, 1 - blur / 9)}">${candle(sX - 5, h, true, false, blur > .7 ? blur : 0)}</g>`;
    } else read = S.look ? "👁 透過透鏡看：看到一個正立的像（虛像，紙屏接不到）。" : "紙屏上接不到像。試試「從紙屏那一端透過透鏡看」。";
    if(S.look && im.real === false){ const h = Math.min(120, 40 * Math.abs(im.m)); g += candle(X(im.q), h, false, true) + `<text x="${X(im.q)}" y="${AX - h * 1.1 - 6}" text-anchor="middle" font-size="11" fill="var(--sub)">虛像</text><text x="350" y="${AX - 40}" font-size="20" text-anchor="end">👁</text>`; }
    svg.innerHTML = g;
    pane.querySelector("#lread").textContent = read;
    pane.querySelector("#pr").value = S.p; pane.querySelector("#sr").value = S.s;
    pane.querySelector("#pv").textContent = `${S.p} cm`; pane.querySelector("#sv").textContent = `${S.s} cm`;
    pane.querySelector("#lens").innerHTML = [["convex", "凸透鏡（圖 4-36）"], ["concave", "凹透鏡（圖 4-37）"]].map(([k, n]) => `<button class="chip ${S.lens === k ? "on" : ""}" data-l="${k}">${n}</button>`).join("");
    pane.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { push(); S.lens = b.dataset.l; S.look = false; const i = ROWS.findIndex(r => r.lens === S.lens && !S.rec[r.k]); if(i >= 0) S.row = i; draw(""); });
    const row = ROWS[S.row];
    pane.querySelector("#ltask").innerHTML = row ? `把蠟燭放在<b>${row.lens === "convex" ? "凸" : "凹"}透鏡的${row.n}</b>（記錄表第 ${row.k} 列），找到像以後按「記錄」。` : "🎉 記錄表全部完成！";
    pane.querySelector("#lform").innerHTML = row ? `<div class="row" style="margin-top:8px"><button class="btn" id="lrec">📝 記錄第 ${row.k} 列</button></div>` : "";
    const rb = pane.querySelector("#lrec"); if(rb) rb.onclick = record;
    pane.querySelector("#ltab").innerHTML = `<table class="rec"><tr><th>列</th><th>透鏡</th><th>物體位置</th><th>成像</th></tr>${ROWS.map((r, i) => `<tr style="${i === S.row ? "background:color-mix(in srgb,var(--gold) 18%,transparent)" : ""}"><td>${r.k}</td><td>${r.lens === "convex" ? "凸" : "凹"}</td><td>${r.n}</td><td>${S.rec[r.k] ? fmt(r.ans) : "＿＿＿"}</td></tr>`).join("")}</table>`;
    pane.querySelector("#look").textContent = S.look ? "🙈 不看了" : "👁 從紙屏那一端透過透鏡看";
    if(msg !== undefined) pane.querySelector("#lfb").innerHTML = msg;
    ctl.upd();
  }
  function record(){
    const row = ROWS[S.row], im = image();
    if(S.lens !== row.lens){ toast(`這一列要用${row.lens === "convex" ? "凸" : "凹"}透鏡`); return; }
    if(!row.ok(S.p)){ draw(say(`蠟燭現在離透鏡 ${S.p} cm，不在「${row.n}」。焦距是 10 cm，看清楚 F 和 2F 的位置再移動蠟燭。`)); return; }
    if(im.real && Math.abs(S.s - im.q) * 1.2 >= .7){ draw(say("紙屏上的像還是模糊的，這時候記下的大小和位置都不準。<b>前後移動紙屏</b>，直到像最清楚再記錄。")); return; }
    if(im.real === false && !S.look){ draw(say("紙屏上接不到像，不代表什麼都沒有。課本提醒：若無法在紙屏上成像，可以<b>從紙屏所在的一端透過透鏡觀察</b>。")); return; }
    const pick = {}, keys = row.ans.kind === "無法成像" ? ["kind"] : ["kind", "dir", "size", "pos"];
    const form = pane.querySelector("#lform");
    form.innerHTML = `<div class="card" style="margin:10px 0;padding:12px"><b>第 ${row.k} 列的成像性質：</b>${["kind", "dir", "size", "pos"].map(k => `<div class="chips" data-k="${k}">${OPT[k].map(o => `<button class="chip" data-o="${o}">${o}</button>`).join("")}</div>`).join("")}
      <div class="row" style="margin-top:8px"><button class="btn" id="lchk">檢查</button></div></div>`;
    form.querySelectorAll("[data-k]").forEach(box => box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      pick[box.dataset.k] = b.dataset.o; box.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
      if(box.dataset.k === "kind") form.querySelectorAll("[data-k]:not([data-k=kind])").forEach(x => x.style.opacity = b.dataset.o === "無法成像" ? .35 : 1);
    }));
    form.querySelector("#lchk").onclick = () => {
      const need = pick.kind === "無法成像" ? ["kind"] : ["kind", "dir", "size", "pos"];
      if(need.some(k => !pick[k])){ toast("每一行都要選"); return; }
      const wrong = new Set(keys.filter(k => pick[k] !== row.ans[k]));
      if(pick.kind === "無法成像" && keys.length > 1) wrong.add("kind");
      if(wrong.size){
        beep(false);
        const hint = {kind: "能在紙屏上接到的是實像；只能透過透鏡看到的是虛像；光線平行射出就無法成像。", dir: "看清楚像的燭焰朝上還是朝下。", size: "和左邊的蠟燭比大小。", pos: "像在透鏡的哪一側、離透鏡多遠？對照 F 和 2F。"};
        pane.querySelector("#lfb").innerHTML = say("還有地方不對：" + [...wrong].map(k => hint[k]).join(" "));
        return;
      }
      push(); S.rec[row.k] = true; beep(true);
      const next = ROWS.findIndex(r => !S.rec[r.k]);
      if(next < 0){
        S.row = ROWS.length; confetti(); labDone(L.id);
        return draw(say("🎉 記錄表完成！<b>成像和物距有關</b>：凸透鏡焦距外→紙屏上的倒立實像；焦點上→無法成像；焦距內和凹透鏡→只能透過透鏡看到正立虛像。", true));
      }
      S.row = next; if(ROWS[next].lens !== S.lens){ S.lens = ROWS[next].lens; S.look = false; }
      draw(say(`✅ 第 ${row.k} 列：${fmt(row.ans)}。`, true));

  }
  pane.querySelector("#pr").oninput = e => { S.p = +e.target.value; draw(); };
  pane.querySelector("#sr").oninput = e => { S.s = +e.target.value; draw(); };
  pane.querySelector("#pr").onpointerdown = pane.querySelector("#sr").onpointerdown = () => push();
  pane.querySelector("#look").onclick = () => { push(); S.look = !S.look; draw(); };
  // 蠟燭、紙屏跟著手指沿光具座左右移動（不用 handDnd，因為要即時看到像的變化）
  svg.addEventListener("pointerdown", e => {
    const it = e.target.closest("[data-it]"); if(!it || ctl.paused) return;
    e.preventDefault(); svg.setPointerCapture(e.pointerId); push();
    const k = it.dataset.it;
    const toCm = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return (p.matrixTransform(svg.getScreenCTM().inverse()).x - LX) / PX; };
    const mv = ev => {
      const c = Math.round(toCm(ev) * 2) / 2;
      if(k === "candle") S.p = Math.min(30, Math.max(3, -c)); else S.s = Math.min(30, Math.max(3, c));
      draw();
    };
    const up = () => { svg.removeEventListener("pointermove", mv); svg.removeEventListener("pointerup", up); svg.removeEventListener("pointercancel", up); };
    svg.addEventListener("pointermove", mv); svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  });
  draw("");
}});

  function question(){

      if(lt === "dark") return draw(say("😮 兩張不同顏色的玻璃紙疊在一起，箱子裡<b>幾乎一片黑</b>！紅玻璃紙只讓紅光通過、綠玻璃紙只讓綠光通過……疊起來就幾乎沒有光能穿過（課本「動腦時間」）。拿掉多的玻璃紙再看。"));

            title: "💥 玻璃紙烤焦冒煙！", cause: "玻璃紙直接包住發燙的燈泡，被烤得捲曲、發出焦味冒煙！",
            q: "玻璃紙開始冒煙了，第一步要怎麼做？", opts: [

              {t: "直接用手把玻璃紙扯下來", why: "燈泡和玻璃紙都很燙，徒手去拿會燙傷。"},
              {t: "拿水潑在燈泡上", why: "燈泡是通電的電器，潑水可能觸電、燈泡也可能破裂。"},
              {t: "繼續做實驗，等一下再說", why: "繼續加熱可能起火，要立刻處理。"}],
            lesson: "玻璃紙要<b>蓋在燈罩口</b>，不要直接貼著或包住發燙的燈泡。（這是一般安全常識，課本沒有寫）"},
            () => { S.film = []; S.wrap = false; S.lampOn = false; draw(say("回到出事前。玻璃紙蓋在燈罩口就好。")); });
        }
        S.film.push(k); S.wrap = false;
        return draw(S.film.length >= 2 ? say("又疊上一張玻璃紙……兩張疊在一起，會怎樣呢？") : say(`${LIGHT[k][0].replace("光", "")}玻璃紙蓋在燈罩口。`, true));
      }
      draw();
    })});
  draw("");
}});

/* ═════ 實驗 5-1 溫度計的原理（課本 p.135–137，圖 5-2） ═════

LABS.push({id: "thermo", ch: "ch5", icon: "🌡️", title: "實驗 5-1 溫度計的原理", page: "p.135–137",

    const [fx, fy] = POS[S.loc];

    if(S.phase === "fill" && S.ink && !S.shaken) B.push(`<button class="btn" data-b="shake">🔄 搖晃錐形瓶</button>`);
    if(S.phase === "card" && S.card) B.push(`<button class="btn gold" data-b="markorig">✏️ 在卡紙上標記原水位</button>`);

    if(st === "bits") return [[-14, 4], [-4, -2], [8, 5], [16, -1], [0, 8], [-10, -6]].map(([dx, dy], i) => `<path d="M${cx + dx * z} ${cy + dy * z} l${5 * z} ${-3 * z} l${3 * z} ${4 * z} l${-6 * z} ${2 * z}z" fill="${col}" transform="rotate(${i * 37} ${cx + dx * z} ${cy + dy * z})"/>`).join("");
    const w = (s.rod ? 40 : 34) * z * (st === "flat" ? 1.25 : 1), h = (s.rod ? 9 : 22) * z * (st === "flat" ? .7 : 1);
    let g = `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${s.rod ? h / 2 : 2}" fill="${col}" stroke="#555" stroke-width=".8"/>`;
    if(sanded && s.shine !== "沒有") g += `<rect x="${cx - w / 2 + 3}" y="${cy - h / 2 + 2}" width="${w - 6}" height="${Math.max(2, h * .25)}" rx="2" fill="#fff" opacity="${s.shine === "有" ? .6 : .25}"/>`;
    return g;
  }
  function draw(msg){
    let g = "";
    const P = S.phase;
    if(P === "look"){
      g += `<rect x="100" y="120" width="160" height="120" rx="10" fill="#e9f5e9" stroke="#8ab88a"/><text x="180" y="258" text-anchor="middle" font-size="11" fill="var(--sub)">觀察墊</text>`;
      if(S.on) g += piece(S.on, 180, 180, 1, S.sanded) + (S.sanded ? `<text x="180" y="140" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="700">${SM[S.on].n}：摩擦過了</text>` : "");
    }
    if(P === "cond"){
      const lit = S.on && S.pred !== null && SM[S.on].cond;
      g += `<rect x="30" y="140" width="70" height="28" rx="4" fill="#495057"/><rect x="100" y="148" width="6" height="12" fill="#495057"/><text x="65" y="159" text-anchor="middle" font-size="11" fill="#fff">1.5 V</text>
        <path d="M106 154 H290 V200 M30 154 H16 V230 H140 M290 200 V230 H220" stroke="#e03131" stroke-width="2.5" fill="none"/>
        <circle cx="290" cy="128" r="18" fill="${lit ? "#ffe066" : "#f1f3f5"}" stroke="#868e96" stroke-width="2"/>${lit ? `<circle cx="290" cy="128" r="30" fill="#ffe066" opacity=".35"/>` : ""}<rect x="282" y="146" width="16" height="10" fill="#adb5bd"/>
        <path d="M140 222 l14 8 l-14 8 z M220 222 l-14 8 l14 8 z" fill="#c92a2a"/><text x="180" y="270" text-anchor="middle" font-size="11" fill="var(--sub)">放在兩個鱷魚夾中間</text>`;
      if(S.on) g += piece(S.on, 180, 230, 1, true);
    }
    if(P === "hit" || P === "method"){
      g += `<rect x="100" y="200" width="160" height="50" rx="6" fill="#f8f9fa" stroke="#adb5bd"/><text x="180" y="266" text-anchor="middle" font-size="11" fill="var(--sub)">敲打墊（墊一張紙）</text>`;
      if(S.on) g += piece(S.on, 180, 225, 1, true, S.obs[S.on].hit ? (SM[S.on].metal ? "flat" : "bits") : null);
      g += `<g transform="translate(250 110) rotate(-30)"><rect x="-6" y="0" width="12" height="70" rx="3" fill="#a0522d"/><rect x="-22" y="-14" width="44" height="18" rx="3" fill="#555"/></g>`;
      if(S.safe) g += `<text x="40" y="140" font-size="26">🥽</text>`;
    }
    if(P === "sort"){
      g += `<rect x="16" y="100" width="156" height="180" rx="12" fill="color-mix(in srgb,#5c7cfa 10%,transparent)" stroke="#5c7cfa" stroke-dasharray="6 4"/><text x="94" y="122" text-anchor="middle" font-weight="700" fill="#3b5bdb">金屬</text>
        <rect x="188" y="100" width="156" height="180" rx="12" fill="color-mix(in srgb,#f08c00 10%,transparent)" stroke="#f08c00" stroke-dasharray="6 4"/><text x="266" y="122" text-anchor="middle" font-weight="700" fill="#d9480f">非金屬</text>`;
      const cnt = {m: 0, n: 0};
      KS.filter(k => S.bin[k]).forEach(k => { const b = S.bin[k], i = cnt[b]++; g += piece(k, b === "m" ? 94 : 266, 150 + i * 34, 0, true) + `<text x="${b === "m" ? 140 : 312}" y="${154 + i * 34}" font-size="10" text-anchor="middle" fill="var(--ink)">${SM[k].n}</text>`; });
    }
    svg.innerHTML = g + trayKeys().map(trayIcon).join("");
    pane.querySelector("#etask").innerHTML = TASK[P];
    const B = [];
    if(P === "hit" && S.on && !S.obs[S.on].hit) B.push(`<button class="btn gold" data-b="hit">🔨 敲打</button>`);
    if(P === "done") B.push(`<button class="btn ghost" data-b="again">🔁 再做一次</button>`);
    handBtns(pane.querySelector("#ebtn"), B.join(""), actT);
    if(msg !== undefined) pane.querySelector("#efb").innerHTML = msg;
    question(); table(); ctl.upd();
  }
  function trayIcon(k, i){
    const sand = k === "sand", x = sand ? TX[5] : TX[KS.indexOf(k)];
    const ic = sand ? `<rect x="-14" y="8" width="28" height="32" rx="2" fill="#d8b77a" stroke="#a07c3a"/><g fill="#a07c3a">${[0, 1, 2, 3, 4, 5].map(j => `<circle cx="${-9 + (j % 3) * 9}" cy="${15 + Math.floor(j / 3) * 14}" r="1.4"/>`).join("")}</g>` : piece(k, 0, 24, 0, S.obs[k].look !== undefined || S.phase !== "look");
    return `<g data-it="${k}" transform="translate(${x} 8)"><rect x="-26" y="-4" width="52" height="70" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${ic}<text x="0" y="60" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">${sand ? "砂紙" : SM[k].n}</text></g>`;
  }
  function trayKeys(){
    if(S.ask) return [];
    const P = S.phase, f = key => KS.filter(k => S.obs[k][key] === undefined && k !== S.on);
    if(P === "look") return (S.on && !S.sanded ? [] : f("look")).concat(S.on && !S.sanded ? ["sand"] : []);
    if(P === "cond") return S.on && S.pred === null ? [] : f("cond");
    if(P === "hit") return S.safe ? f("hit") : [];
    if(P === "sort") return KS.filter(k => !S.bin[k]);
    return [];
  }
  const QS = {
    shine: {q: () => `摩擦後的${SM[S.on].n}，表面有金屬光澤嗎？`, o: () => [["有，亮亮的", "有"], ["沒有，霧霧的", "沒有"], ["有一點", "有一點"]]},
    pred: {q: () => `預測：把${SM[S.on].n}接進電路，燈泡會亮嗎？`, o: () => [["會亮（會導電）", "1"], ["不會亮（不導電）", "0"]]},
    method: {q: () => "小組討論一種測試方式：將待測物＿＿＿＿。（想測的是「延展性」：能不能打成薄片、拉成細絲）", o: () => [["放在墊紙上用鐵鎚敲打，看會變扁還是碎掉", "hammer"], ["用酒精燈燒燒看", "fire"], ["放進水裡，看會浮還是沉", "water"], ["用舌頭舔舔看", "lick"]]},
    safe: {q: () => "用鐵鎚敲之前，要先做什麼？", o: () => [["戴上護目鏡，待測物用紙包住或蓋住再敲", "ok"], ["不用準備，直接用力敲下去", "no"]]},
    r1: {q: () => "結果與討論 1：這五種待測物可以分成哪幾類？分類依據是什麼？", o: () => [["依光澤、導電性、延展性分成兩類：鐵、鋅、銅一類；硫、石墨一類", "1"], ["依顏色分成五類，每種顏色一類", "0"], ["依形狀分成兩類：片狀一類、棒狀一類", "0"]],
      ok: "✅ 片狀、棒狀只是做成的形狀，不是物質本身的性質；要用光澤、導電性、延展性這些性質來分。"},
    r2: {q: () => "結果與討論 2：金屬元素可能有哪些相似的性質？", o: () => [["有金屬光澤、會導電、有延展性（敲了變扁不會碎）", "1"], ["都是銀灰色", "0"], ["都很軟、一敲就碎", "0"]],
      ok: "✅ 金屬：具金屬光澤、電熱良導體、具延性與展性（p.167）。銅是紅褐色，所以「都是銀灰色」不對。"},
    r3: {q: () => "結果與討論 3：哪一種待測物最不容易分類？", o: () => [["石墨：會導電、有一點光澤像金屬，但一敲就碎", "1"], ["鐵片：它會生鏽", "0"], ["硫棒：它是黃色的", "0"]],
      ok: "✅ 石墨會導電，但由非金屬元素「碳」構成、敲了會碎——課本說的「少數例外」（p.168）。"}};
  function question(){
    const box = pane.querySelector("#eq"), k = S.ask;
    if(!k){ box.innerHTML = ""; box._k = null; return; }
    const key = k + S.q + S.on;
    if(box._k === key) return;
    box._k = key;
    const o = QS[k].o();
    box.innerHTML = `<div class="card" style="margin:10px 0;padding:12px"><b>${QS[k].q()}</b><div>${(k === "pred" || k === "shine" ? o : shuffle(o)).map(([t, v]) => `<button class="qo" data-v="${v}">${t}</button>`).join("")}</div></div>`;
    box.querySelectorAll(".qo").forEach(b => b.onclick = () => answer(k, b.dataset.v, b));
  }
  const next = (key, ph) => KS.every(k => S.obs[k][key] !== undefined) ? ph : null;
  const answer = track(function(k, v, b){
    const s = S.on && SM[S.on];
    if(k === "shine"){
      if(v !== s.shine){ b.classList.add("bad"); b.disabled = true; beep(false); pane.querySelector("#efb").innerHTML = say("再看清楚一點：摩擦後的表面亮不亮？"); return; }
      beep(true); S.obs[S.on].look = s.look; S.on = null; S.sanded = false; S.ask = null; S.q++;
      const nx = next("look", "cond"); if(nx) S.phase = nx;
      return draw(say(`✅ 記錄：${s.look}。${nx ? "五種都觀察完了！接下來測導電性。" : ""}`, true));
    }
    if(k === "pred"){
      S.pred = v; S.obs[S.on].cond = s.cond; S.ask = null; S.q++; beep(+v === s.cond);
      const nm = s.n, msg = s.cond ? `💡 燈泡亮了！${nm}<b>會導電</b>。` : `燈泡不亮，${nm}<b>不導電</b>。`;
      const fin = next("cond", "method");
      if(fin){ S.phase = fin; S.ask = "method"; S.on = null; }
      return draw(say(msg + (+v === s.cond ? "（預測正確）" : "（和預測不一樣）") + (nm === "石墨棒" ? " 石墨看起來不像金屬，卻會導電！" : "") + (fin ? "<br>五種都測完了。接下來測試其他性質。" : ""), +v === s.cond));
    }
    if(k === "method"){
      if(v === "hammer"){ beep(true); S.ask = "safe"; S.q++; return draw(say("✅ 金屬有展性，敲了會變扁、不會碎；固態非金屬容易被敲碎。", true)); }
      if(v === "fire"){
        accN++; S.ask = null; draw("");
        return handAccident(card, {pic: `<svg viewBox="0 0 240 110"><rect x="0" y="92" width="240" height="18" rx="4" fill="#6b4a2f"/>${flameP(120, 92, 40, 12, "#4c6ef5", "#91a7ff")}<g fill="#ced4da" opacity=".8"><circle cx="100" cy="40" r="14"/><circle cx="130" cy="28" r="18"/><circle cx="160" cy="44" r="12"/></g></svg>`,
          title: "😷 硫燒起來，冒出刺鼻的煙！", cause: "硫棒被酒精燈點燃，冒出藍色火焰和刺鼻的氣體（二氧化硫），大家咳個不停、眼睛刺痛。",
          q: "聞到刺鼻的氣體、喉嚨很不舒服，要怎麼做？", opts: [
            {t: "立刻熄火，離開到空氣流通的地方，打開門窗並報告老師", ok: true, why: "先遠離氣體、讓空氣流通，再由老師處理；不舒服要就醫。"},
            {t: "湊近一點聞清楚是什麼味道", why: "有毒氣體不能直接聞，吸進更多會更嚴重。"},
            {t: "用嘴把火吹熄", why: "吹氣會把煙吹向大家，也可能讓火燒得更旺。"},
            {t: "忍一下，把實驗做完", why: "吸入有毒氣體要立刻離開現場。"}],
          lesson: "這個實驗想測的是延展性，<b>不需要燒</b>。不知道會產生什麼物質時不可以隨便加熱，硫燃燒會產生有毒的二氧化硫。（一般安全常識，課本沒有寫）"},
          () => { S.ask = "method"; S.q++; draw(say("回到出事前。想測延展性，該用什麼方法？")); });
      }
      b.classList.add("bad"); b.disabled = true; beep(false);
      pane.querySelector("#efb").innerHTML = say(v === "water" ? "浮或沉看的是密度，和延展性無關。" : "🚫 實驗室裡任何藥品、材料都<b>不可以嚐</b>！而且舔也測不出延展性。");
      return;
    }
    if(k === "safe"){
      S.ask = null; S.q++;
      if(v === "no"){
        accN++; S.phase = "hit"; draw("");
        return handAccident(card, {pic: BREAK_SVG, title: "😣 碎片噴進眼睛了！", cause: "沒戴護目鏡就直接用力敲，石墨、硫這類會碎的材料碎片四處飛濺，有一片噴進眼睛。",
          q: "碎片噴進眼睛，要怎麼做？", opts: [
            {t: "不要揉眼睛，用大量清水沖洗，並馬上報告老師", ok: true, why: "揉眼睛會讓碎片刮傷眼球；用清水沖出來，再請老師、護理師檢查。"},
            {t: "用力揉眼睛，把碎片揉出來", why: "揉眼睛會讓碎片刮傷眼角膜。"},
            {t: "用手指把碎片挖出來", why: "手指有細菌，也可能把碎片推得更深。"},
            {t: "閉上眼睛休息一下就好", why: "碎片還在眼睛裡，要盡快沖洗、檢查。"}],
          lesson: "敲打會碎的材料時，要<b>戴護目鏡</b>，並用紙包住或蓋住待測物，碎片才不會亂飛。（一般安全常識，課本沒有寫）"},
          () => { S.phase = "method"; S.ask = "safe"; S.q++; draw(say("回到出事前。敲之前要先準備什麼？")); });
      }
      S.safe = true; S.phase = "hit"; beep(true);
      return draw(say("✅ 戴好護目鏡，墊好紙。開始敲吧！", true));
    }
    if(!+v){ b.classList.add("bad"); b.disabled = true; beep(false); return; }
    beep(true); S.q++;
    const nx = {r1: "r2", r2: "r3", r3: null}[k];
    S.ask = nx;
    if(!nx){ S.phase = "done"; confetti(); labDone(L.id); return draw(say(`🎉 ${QS.r3.ok}<br>科學家就是用這樣的探究，把性質相似的元素分成同一類（p.167）。${accN ? `（途中出事 ${accN} 次）` : ""}`, true)); }
    draw(say(QS[k].ok, true));
  });
  function table(){
    const v = x => x === undefined ? "" : x;
    pane.querySelector("#etab").innerHTML = `<table class="rec"><tr><th>待測物</th><th>摩擦後的表面</th><th>導電性</th><th>敲打結果</th></tr>`
      + KS.map(k => { const o = S.obs[k]; return `<tr><td>${SM[k].n}</td><td>${v(o.look)}</td><td>${o.cond === undefined ? "" : o.cond ? "💡 會導電" : "不導電"}</td><td>${v(o.hit)}</td></tr>`; }).join("") + "</table>";
  }
  function act(b){
    if(b === "again"){ hist.length = 0; init(); accN = 0; return draw(""); }
    if(b === "hit"){
      const s = SM[S.on]; S.obs[S.on].hit = s.hit;
      const k = S.on; S.on = null;
      const nx = next("hit", "sort"); if(nx) S.phase = nx;
      draw(say(`🔨 ${s.n}${s.hit}。${s.metal ? "金屬有<b>展性</b>。" : "固態非金屬<b>不具延展性</b>，容易被敲碎。"}${k === "c" ? " 石墨會導電，卻一敲就碎……" : ""}${nx ? "<br>五種都測完了，來分類吧！" : ""}`, true));
    }
  }
  const actT = track(act);
  handDnd(svg, {
    name: k => k === "sand" ? "砂紙" : SM[k].n,
    drop: track(function(k, x, y){
      const P = S.phase;
      if(P === "look"){
        if(k === "sand"){ if(!S.on || !inR(x, y, [90, 100, 270, 260])){ toast("拿砂紙去摩擦觀察墊上的待測物"); return draw(); } S.sanded = true; S.ask = "shine"; return draw(say("沙沙沙……表面的灰暗氧化層被磨掉了。")); }
        if(!inR(x, y, [90, 100, 270, 260])){ toast("放到觀察墊上"); return draw(); }
        S.on = k; S.sanded = false; return draw(say(`${SM[k].n}放上觀察墊。表面有點灰暗——用砂紙摩擦看看。`));
      }
      if(P === "cond"){
        if(!inR(x, y, [120, 190, 240, 275])){ toast("放到兩個鱷魚夾中間"); return draw(); }
        S.on = k; S.pred = null; S.ask = "pred"; return draw("");
      }
      if(P === "hit"){
        if(!inR(x, y, [90, 180, 270, 270])){ toast("放到敲打墊上"); return draw(); }
        S.on = k; return draw("");
      }
      if(P === "sort"){
        const bin = inR(x, y, [10, 90, 178, 290]) ? "m" : inR(x, y, [182, 90, 350, 290]) ? "n" : null;
        if(!bin){ toast("拖進「金屬」或「非金屬」區"); return draw(); }
        const right = (bin === "m") === !!SM[k].metal;
        if(!right){
          beep(false);
          return draw(say(k === "c" ? "石墨會導電、有一點光澤，很像金屬……可是敲一下就碎、沒有延展性，而且它是由<b>非金屬元素碳</b>構成。課本說這是非金屬中的<b>少數例外</b>。" : `看看記錄表裡${SM[k].n}的光澤、導電性和敲打結果，再想想。`));
        }
        S.bin[k] = bin;
        if(KS.every(x2 => S.bin[x2])){ S.phase = "q"; S.ask = "r1"; return draw(say("✅ 分類完成！金屬：鐵、鋅、銅；非金屬：硫、石墨。", true)); }
        return draw(say(`✅ ${SM[k].n}放進${bin === "m" ? "金屬" : "非金屬"}。`, true));
      }
      draw();
    })});
  draw("");
}});

/* ═════ 活動站框架：正式實驗以外的課本動手活動（每章一站、一關一個活動） ═════
   handStation(pane, L, ACTS)：上方關卡列（做完打 ✅），下方放目前這一關；全部關卡做完才算完成這一站
     ACTS = [{key, title, page, run(box, done)}]；關卡做完呼叫 done()
   handKit(box, html, init)：一關的小實驗骨架，內含暫停／上一步／全部重來
     html 必須含 <div class="htask"></div>；回傳 K：K.S 狀態、K.track(fn) 包住會改狀態的動作、
     K.draw 由關卡自己指定、K.ctl.wait(ms, fn) 可暫停的計時、K.alive() 這關還在畫面上、K.dragging 正在拖曳（計時重畫要跳過）
   handTone(f, ms, g)：發出頻率 f 的聲音（音叉、直尺、聲納用） */
function handKit(box, html, init){
  box.innerHTML = `<div class="card sim hand">${html}</div>`;
  const card = box.querySelector(".hand");
  const K = {S: init(), hist: [], card, draw: () => {}};
  const cur = () => JSON.stringify(K.S);
  K.track = fn => (...a) => { const pre = cur(); const r = fn(...a); if(pre !== cur()) K.hist.push(pre); K.ctl.upd(); return r; };
  K.ctl = handCtl(card, {
    canUndo: () => K.hist.length > 0,
    undo(){ let o; do { o = K.hist.pop(); } while(o && o === cur() && K.hist.length); if(o){ K.S = JSON.parse(o); K.draw(say("↩ 回到上一步。", true)); } },
    reset(){ K.hist.length = 0; K.S = init(); K.draw(say("🔁 全部重來。", true)); }});
  K.alive = () => document.body.contains(card);
  K.dragging = false;                                // 拖曳中不重畫，免得手上的器材被換掉
  card.addEventListener("pointerdown", () => { K.dragging = true; });
  window.addEventListener("pointerup", () => { K.dragging = false; });

}
/* 選擇題卡片：opts = [[文字, 是否正確, 答錯說明], ...]；答對呼叫 ok() */
function handMC(box, q, opts, ok){
  box.innerHTML = `<div class="card" style="margin:10px 0;padding:12px"><b>${q}</b><div>${shuffle(opts).map(([t, r, why], i) => `<button class="qo" data-r="${r ? 1 : 0}" data-w="${esc(why || "")}">${t}</button>`).join("")}</div><div class="mcfb"></div></div>`;
  box.querySelectorAll(".qo").forEach(b => b.onclick = () => {
    if(b.dataset.r === "1"){ beep(true); box.querySelectorAll(".qo").forEach(x => x.disabled = true); b.style.borderColor = "#2f9e44"; ok(); return; }
    b.classList.add("bad"); b.disabled = true; beep(false);
    if(b.dataset.w) box.querySelector(".mcfb").innerHTML = say(b.dataset.w);
  });
}
function handTone(f, ms, g){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), v = AC.createGain(), t = AC.currentTime;
    o.frequency.value = f; v.gain.setValueAtTime(g || .08, t); v.gain.exponentialRampToValueAtTime(.0001, t + ms / 1000);
    o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t + ms / 1000);
  }catch(e){}
}
function handStation(pane, L, ACTS){
  const key = a => L.id + "/" + a.key;
  let cur = ACTS.findIndex(a => !DONE[key(a)]); if(cur < 0) cur = 0;
  pane.innerHTML = `<p class="muted" style="margin:0 0 6px">課本裡不是正式實驗、但可以動手試的活動。一關一個，點上面的按鈕可以換關；全部做完才算完成這一站。</p>
    <div class="chips" id="stc"></div><div id="stb"></div><div id="stn"></div>`;
  function chips(){
    pane.querySelector("#stc").innerHTML = ACTS.map((a, i) => `<button class="chip${i === cur ? " on" : ""}" data-i="${i}">${DONE[key(a)] ? "✅ " : ""}${i + 1}. ${esc(a.title)}</button>`).join("");
    pane.querySelectorAll("#stc .chip").forEach(b => b.onclick = () => show(+b.dataset.i));
  }
  function show(i){
    cur = i; chips();
    const a = ACTS[i], box = pane.querySelector("#stb");
    box.innerHTML = `<p class="kicker" style="margin:12px 0 0">第 ${i + 1} 關 · 課本 ${a.page}</p><h2 style="margin:2px 0 8px">${esc(a.title)}</h2><div></div>`;
    pane.querySelector("#stn").innerHTML = "";
    a.run(box.lastElementChild, () => finish(i));
  }
  function finish(i){
    const a = ACTS[i];
    if(!DONE[key(a)]){ DONE[key(a)] = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(DONE)); }catch(e){} }
    chips();
    const all = ACTS.every(x => DONE[key(x)]);
    if(all){ confetti(); labDone(L.id); }
    const nx = ACTS.findIndex((x, j) => j > i && !DONE[key(x)]), nx2 = nx >= 0 ? nx : ACTS.findIndex(x => !DONE[key(x)]);
    pane.querySelector("#stn").innerHTML = all ? say("🎉 這一站全部完成！", true)
      : `<div class="row" style="margin-top:10px"><button class="btn gold" id="stgo">下一關：${esc(ACTS[nx2].title)} ▶</button></div>`;
    const g = pane.querySelector("#stgo"); if(g) g.onclick = () => { show(nx2); pane.scrollIntoView({block: "start"}); };
  }
  show(cur);
}

  function actDisp(box, done){

    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 250"></svg></div>

    function draw(msg){
      const S = K.S, lv = level();
      let g = `<rect x="150" y="${CY(100) - 8}" width="50" height="${CY(0) - CY(100) + 8}" fill="none" stroke="#5c7cfa" stroke-width="2"/>`;
      if(lv) g += `<rect x="151" y="${CY(lv)}" width="48" height="${CY(0) - CY(lv)}" fill="#a5d8ff" opacity=".7"/>`;
      for(let v = 0; v <= 100; v += 5) g += `<line x1="150" x2="${v % 10 ? 158 : 164}" y1="${CY(v)}" y2="${CY(v)}" stroke="#333"/>${v % 10 ? "" : `<text x="146" y="${CY(v) + 3}" font-size="8" text-anchor="end">${v}</text>`}`;
      g += `<text x="175" y="246" font-size="9" text-anchor="middle" fill="var(--sub)">量筒（mL）</text>`;
      if(S.lv === 0 && S.bean) for(let i = 0; i < 40; i++) g += `<circle cx="${156 + (i * 7) % 40}" cy="${CY(0) - 4 - Math.floor(i / 6) * 4.4}" r="2.6" fill="#5c940d"/>`;
      if(S.lv === 1 && S.ball){ const by = S.ball === 2 ? CY(70) : CY(lv) - 4; g += `<circle cx="175" cy="${by}" r="14" fill="#fff" stroke="#f08c00" stroke-width="2"/>`; if(S.ball === 2) g += `<line x1="175" y1="${CY(100) - 20}" x2="175" y2="${by - 14}" stroke="#868e96" stroke-width="2"/>`; }
      if(S.lv === 2 && S.sugar) g += `<rect x="168" y="${CY(0) - 12}" width="14" height="${S.sugar === 1 ? 12 : 3}" fill="#fff" stroke="#adb5bd" opacity="${S.sugar === 1 ? 1 : .5}"/>`;
      // 放大鏡：液面附近
      g += `<g transform="translate(290 120)"><circle r="44" fill="#fff" stroke="#555" stroke-width="2"/><clipPath id="dz"><circle r="43"/></clipPath><g clip-path="url(#dz)"><g transform="scale(3.5) translate(-175 ${-CY(lv || 50)})">
        <rect x="150" y="${CY(100)}" width="50" height="${CY(0) - CY(100)}" fill="#fff"/>${lv ? `<path d="M151 ${CY(lv) - 1.2} Q175 ${CY(lv) + 1.5} 199 ${CY(lv) - 1.2} V${CY(0)} H151Z" fill="#a5d8ff"/>` : ""}${Array.from({length: 101}, (_, v) => `<line x1="150" x2="${v % 10 ? (v % 5 ? 155 : 158) : 164}" y1="${CY(v)}" y2="${CY(v)}" stroke="#333" stroke-width=".25"/>${v % 5 ? "" : `<text x="166" y="${CY(v) + 1}" font-size="2.6">${v}</text>`}`).join("")}</g></g><text y="58" font-size="9" text-anchor="middle" fill="var(--sub)">🔍 平視液面</text></g>`;
      const T = {bean: ["綠豆", `<g fill="#5c940d">${[0, 1, 2, 3, 4, 5].map(i => `<circle cx="${-8 + (i % 3) * 8}" cy="${18 + Math.floor(i / 3) * 8}" r="3"/>`).join("")}</g>`], w30: ["量好的水 30.0 mL", `<rect x="-11" y="8" width="22" height="30" fill="#e7f5ff" stroke="#5c7cfa"/><rect x="-10" y="20" width="20" height="17" fill="#a5d8ff"/>`],
        ball: ["桌球", `<circle cx="0" cy="22" r="13" fill="#fff" stroke="#f08c00" stroke-width="2"/>`], wire: ["細鐵絲", `<line x1="0" y1="2" x2="0" y2="42" stroke="#868e96" stroke-width="2"/>`], sugar: ["方糖", `<rect x="-9" y="13" width="18" height="18" fill="#fff" stroke="#adb5bd"/>`]};
      const used = {bean: S.bean, w30: S.water, ball: S.ball, wire: S.ball === 2, sugar: S.sugar};
      g += LV[S.lv].items.filter(k => !used[k] || (k === "wire" && S.ball === 1 && false)).map((k, i) => tile(k, 36 + i * 64, 10, T[k][0], T[k][1])).join("");
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = [`第 1 關 綠豆（例題 1-2）：把<b>綠豆</b>倒進空量筒，再倒入<b>量好的 30.0 mL 水</b>，讀水面刻度。`, `第 2 關 桌球（動腦時間）：量筒裡有 50.0 mL 水，用排水法量<b>桌球</b>的體積。`, `第 3 關 砂糖（動腦時間）：量筒裡有 50.0 mL 水，砂糖適合用排水法量體積嗎？把<b>方糖</b>放進去看看。`][S.lv];
      handBtns(box.querySelector("[data-btn]"), (S.lv === 1 && S.ball) || (S.lv === 0 && S.water && S.bean) ? `<button class="btn gold" data-b="read">📝 記錄水位</button>` : "", act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(b === "read"){
        if(S.lv === 1 && S.ball === 1) return draw(say("😕 桌球<b>浮在水面</b>，只有一小部分泡進水裡，水位只上升到 52.7 mL——這不是整顆球的體積。想辦法讓球<b>完全沒入水中</b>。"));
        S.read = level(); return quiz();
      }
    });
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]");
      if(S.lv === 0) handMC(q, "水面在 40.0 mL。綠豆的總體積是多少？", [["10.0 mL（40.0 − 30.0）", 1], ["40.0 mL", 0, "40.0 mL 是綠豆＋水的體積，要減掉倒進去的 30.0 mL 水。"], ["30.0 mL", 0, "30.0 mL 是水的體積。"]],
        K.track(() => { S.lv = 1; S.read = null; q.innerHTML = ""; draw(say("✅ 綠豆之間有空隙，倒水進去把空隙填滿，水面刻度減掉水的體積，就是綠豆本身的體積。", true)); }));
      if(S.lv === 1) handMC(q, "桌球壓入水中後水面在 83.5 mL。桌球的體積是多少？", [["33.5 mL（83.5 − 50.0）", 1], ["2.7 mL", 0, "那是桌球浮著時的水位變化，球沒有完全沒入。"], ["83.5 mL", 0, "要減掉原來的 50.0 mL 水。"]],
        K.track(() => { S.lv = 2; S.read = null; q.innerHTML = ""; draw(say("✅ 會浮的物體要讓它<b>完全沒入</b>才能用排水法；細鐵絲很細，它占的體積可以忽略。（課本動腦時間沒有給答案，這是一種做法）", true)); }));
    }
    handDnd(svg, {name: k => ({bean: "綠豆", w30: "量好的水", ball: "桌球", wire: "細鐵絲", sugar: "方糖"})[k], drop: K.track((k, x, y) => {
      const S = K.S, inCyl = inR(x, y, [130, 40, 220, 240]);
      if(!inCyl){ toast("放進量筒"); return draw(); }
      if(k === "bean"){ S.bean = true; return draw(S.water ? say("綠豆沉到水底。") : ""); }
      if(k === "w30"){ S.water = 1; return draw(""); }
      if(k === "ball"){ S.ball = 1; return draw(say("桌球浮在水面上……")); }
      if(k === "wire"){ if(S.ball !== 1){ toast("先把桌球放進去"); return draw(); } S.ball = 2; return draw(say("用細鐵絲把桌球輕輕壓到完全沒入水中，水位上升了。", true)); }
      if(k === "sugar"){
        S.sugar = 1; draw(say("方糖沉下去……"));
        K.ctl.wait(1800, () => { S.sugar = 2; draw(say("方糖慢慢<b>溶解</b>不見了，水位也幾乎沒有變。")); handMC(box.querySelector("[data-q]"), "砂糖適合用排水法量體積嗎？", [["不適合：砂糖會溶在水裡，量不到它的體積", 1], ["適合：水位上升多少就是砂糖的體積", 0, "看看量筒：砂糖溶解後幾乎看不出水位變化。"], ["適合，只要動作快一點", 0, "砂糖一碰到水就開始溶解。"]],
          () => { draw(say("✅ 會溶於水的物質不能用水做排水法。（課本動腦時間沒有給答案，這是依實驗結果推論）", true)); done(); }); });
        return;
      }
      draw();
    })});
    K.draw = draw; draw("");
  }

  /* ④ 天平：上皿天平（歸零 → 左物右碼 → 砝碼夾由大到小）＋電子天平（放水平 → 秤量紙 → 歸零 → 秤藥品） */
  function actBal(box, done){
    const M = 23.7, W = [50, 20, 10, 5, 2, 1, .5, .2, .1];
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 260"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({part: "up", off: 3, obj: false, tw: false, pan: [], level: 2, paper: false, tare: false, salt: false}));
    const svg = box.querySelector("svg"), sum = () => Math.round(K.S.pan.reduce((a, b) => a + b, 0) * 10) / 10;
    const lab = w => w >= 1 ? w + " g" : w * 1000 + " mg";
    function draw(msg){
      const S = K.S; let g = "";
      if(S.part === "up"){
        const d = (S.obj ? M : 0) - sum(), ang = Math.max(-20, Math.min(20, S.off * 4 + (d > .05 ? 20 : d < -.05 ? -20 : 0)));
        g += `<rect x="130" y="210" width="100" height="16" fill="#868e96"/><rect x="176" y="120" width="8" height="92" fill="#868e96"/>
          <g transform="rotate(${-ang / 4} 180 120)"><rect x="80" y="116" width="200" height="6" fill="#495057"/><circle cx="84" cy="128" r="5" fill="#fab005"/><circle cx="276" cy="128" r="5" fill="#fab005"/></g>
          <line x1="180" y1="122" x2="${180 + ang * 2}" y2="200" stroke="#e03131" stroke-width="2.5"/><path d="M168 204 h24" stroke="#333"/><line x1="180" y1="200" x2="180" y2="208" stroke="#333"/>
          <ellipse cx="100" cy="${150 + ang / 2}" rx="36" ry="6" fill="#ced4da" stroke="#868e96"/><ellipse cx="260" cy="${150 - ang / 2}" rx="36" ry="6" fill="#ced4da" stroke="#868e96"/>
          <text x="100" y="${172 + ang / 2}" font-size="10" text-anchor="middle" fill="var(--sub)">左盤</text><text x="260" y="${172 - ang / 2}" font-size="10" text-anchor="middle" fill="var(--sub)">右盤</text>`;
        if(S.obj) g += `<rect x="86" y="${130 + ang / 2}" width="28" height="18" rx="3" fill="#8d6e63"/><text x="100" y="${126 + ang / 2}" font-size="9" text-anchor="middle">待測物</text>`;
        S.pan.forEach((w, i) => { const px = 230 + (i % 4) * 16, py = 136 - ang / 2 - Math.floor(i / 4) * 16; g += `<g data-pw="${i}" style="cursor:pointer"><rect x="${px}" y="${py}" width="14" height="11" rx="2" fill="#adb5bd" stroke="#495057"/><text x="${px + 7}" y="${py + 8}" font-size="5.5" text-anchor="middle">${lab(w)}</text></g>`; });
        g += `<text x="260" y="${192 - ang / 2}" font-size="10" text-anchor="middle" fill="var(--ink)">${S.pan.length ? "砝碼 " + sum() + " g" : ""}</text>`;
        if(S.tw) g += `<text x="300" y="250" font-size="11" fill="#2f9e44">🥢 拿著砝碼夾</text>`;
        g += (S.obj ? [] : ["obj"]).concat(W.filter(w => !S.pan.includes(w)).map(w => "w" + w)).map((k, i) => k === "obj"
          ? tile("obj", 22, 10, "待測物", `<rect x="-14" y="14" width="28" height="18" rx="3" fill="#8d6e63"/>`)
          : tile(k, 22 + i * 35, 10, lab(+k.slice(1)), `<rect x="-9" y="12" width="18" height="${10 + Math.min(14, +k.slice(1) / 4)}" rx="2" fill="#adb5bd" stroke="#495057"/>`).replace('x="-28"', 'x="-17"').replace('width="56"', 'width="34"')).join("");
      } else {
        const rd = (S.paper ? .4 : 0) + (S.salt ? 5 : 0) - (S.tare ? (S.tare === "empty" ? 0 : .4) : 0);
        g += `<rect x="100" y="170" width="160" height="50" rx="6" fill="#dee2e6" stroke="#868e96"/><rect x="130" y="180" width="80" height="22" rx="3" fill="#1b2a1b"/><text x="204" y="196" text-anchor="end" font-size="14" fill="#69db7c" font-family="monospace">${rd.toFixed(1)} g</text>
          <ellipse cx="180" cy="166" rx="56" ry="7" fill="#ced4da" stroke="#868e96"/><circle cx="240" cy="200" r="9" fill="#fff" stroke="#868e96"/><circle cx="${240 + S.level * 3}" cy="200" r="3" fill="#74c0fc"/><text x="240" y="232" font-size="9" text-anchor="middle" fill="var(--sub)">水平儀</text>`;
        if(S.paper) g += `<path d="M150 160 h60 l-6 5 h-48z" fill="#fff" stroke="#adb5bd"/>`;
        if(S.salt) g += `<ellipse cx="180" cy="158" rx="16" ry="5" fill="#f8f9fa" stroke="#ced4da"/>`;
        g += [S.paper ? null : "paper", S.salt ? null : "salt"].filter(Boolean).map((k, i) => tile(k, 40 + i * 64, 10, k === "paper" ? "秤量紙" : "食鹽（藥品）", k === "paper" ? `<rect x="-14" y="14" width="28" height="20" fill="#fff" stroke="#adb5bd"/>` : `<ellipse cx="0" cy="26" rx="13" ry="6" fill="#f8f9fa" stroke="#ced4da"/>`)).join("");
      }
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.part === "up" ? "上皿天平：① 轉<b>校準螺絲</b>讓指針指在正中央（歸零）→ ② <b>待測物放左盤</b> → ③ 拿起<b>砝碼夾</b>，砝碼<b>由大到小</b>放右盤（太重就點右盤的砝碼拿回來），直到指針回到正中央。"
        : "電子天平：① 調整腳座讓<b>水平儀的氣泡在中心</b> → ② 秤藥品要先放<b>秤量紙</b>再按<b>歸零</b> → ③ 倒入藥品讀數。";
      const B = S.part === "up" ? `<button class="btn ghost" data-b="l">↺ 校準螺絲往左</button><button class="btn ghost" data-b="r">↻ 校準螺絲往右</button><button class="btn${S.tw ? " gold" : ""}" data-b="tw">${S.tw ? "🥢 放下砝碼夾" : "🥢 拿起砝碼夾"}</button>` + (S.obj && sum() === M ? `<button class="btn gold" data-b="ok">📝 讀出質量</button>` : "")
        : `<button class="btn ghost" data-b="foot">🦶 調整腳座</button><button class="btn" data-b="tare">⓪ 歸零</button>` + (S.salt ? `<button class="btn gold" data-b="eok">📝 讀出藥品質量</button>` : "");
      handBtns(box.querySelector("[data-btn]"), B, act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(b === "l" || b === "r"){ if(S.obj || S.pan.length) return draw(say("歸零要在<b>秤盤上沒有東西</b>時做。先按「↩ 上一步」把東西拿下來。")); S.off += b === "l" ? -1 : 1; return draw(S.off === 0 ? say("✅ 指針指在正中央，歸零完成。", true) : ""); }
      if(b === "tw"){ S.tw = !S.tw; return draw(""); }
      if(b === "ok") return handMC(box.querySelector("[data-q]"), "指針停在正中央。待測物的質量是多少？", [[`${M} 公克（右盤砝碼的總質量）`, 1], ["要再加上左盤的盤子質量", 0, "兩個秤盤一樣重，歸零時已經抵消了。"], ["看指針偏多少再估", 0, "指針在正中央＝平衡，質量就等於砝碼總和。"]],
        K.track(() => { S.part = "el"; box.querySelector("[data-q]").innerHTML = ""; draw(say(`✅ 待測物＝砝碼總質量＝${M} g（20 g＋2 g＋1 g＋500 mg＋200 mg）。接下來換電子天平。`, true)); }));
      if(b === "foot"){ S.level = S.level > 0 ? S.level - 1 : 2; return draw(S.level === 0 ? say("✅ 氣泡在中心，天平放水平了。", true) : ""); }
      if(b === "tare"){
        if(S.level) return draw(say("天平還沒放水平（氣泡不在中心），先調整腳座。"));
        if(S.salt && !S.tare) return draw(say("😕 藥品已經倒上去才歸零，螢幕會變成 0.0——藥品的質量就被扣掉了！要<b>先放秤量紙再歸零</b>，再倒藥品。按「↩ 上一步」回去。"));
        S.tare = S.paper ? "paper" : "empty"; return draw(S.paper ? say("✅ 放著秤量紙按歸零，螢幕回到 0.0，扣掉了秤量紙的質量。", true) : say("還沒放秤量紙就歸零……等一下放上秤量紙，數字就會多出秤量紙的質量。"));
      }
      if(b === "eok"){
        if(S.tare !== "paper") return draw(say(`😕 螢幕顯示的 ${((S.paper ? .4 : 0) + 5).toFixed(1)} g 包含了<b>秤量紙</b>的質量（課本：秤藥品先放秤量紙於秤盤中心，再按歸零鈕扣除其質量）。按「↩ 上一步」照順序重來。`));
        return handMC(box.querySelector("[data-q]"), "電子天平秤藥品，正確順序是？", [["放水平 → 放秤量紙 → 歸零 → 倒藥品讀數", 1], ["倒藥品 → 歸零 → 讀數", 0, "藥品倒上去才歸零，就把藥品的質量扣掉了。"], ["放秤量紙 → 倒藥品 → 讀數（不用歸零）", 0, "這樣讀到的是藥品＋秤量紙。"]],
          () => { draw(say("✅ 食鹽 5.0 g。上皿天平和電子天平都會操作了！", true)); done(); });
      }
    });
    svg.addEventListener("click", K.track(e => {                                  // 點右盤的砝碼＝用砝碼夾拿回來
      const g = e.target.closest("[data-pw]"), S = K.S; if(!g || S.part !== "up") return;
      if(!S.tw) return draw(say("要用<b>砝碼夾</b>夾砝碼。"));
      S.pan.splice(+g.dataset.pw, 1); draw("");
    }));
    handDnd(svg, {name: k => k === "obj" ? "待測物" : k === "paper" ? "秤量紙" : k === "salt" ? "食鹽" : lab(+k.slice(1)), drop: K.track((k, x, y) => {
      const S = K.S, left = inR(x, y, [50, 100, 150, 190]), right = inR(x, y, [210, 100, 310, 200]);
      if(S.part === "el"){
        if(!inR(x, y, [100, 130, 260, 220])){ toast("放到秤盤中心"); return draw(); }
        if(k === "paper"){ S.paper = true; return draw(""); }
        if(k === "salt"){ if(!S.paper) return draw(say("😕 藥品直接倒在秤盤上，會弄髒、腐蝕秤盤，也拿不下來。課本：秤藥品要<b>先放秤量紙</b>。")); S.salt = true; return draw(""); }
        return draw();
      }
      if(k === "obj"){
        if(S.off) return draw(say("還沒歸零！課本的第 1 步是<b>歸零</b>：先轉校準螺絲讓指針指在正中央。"));
        if(right) return draw(say("待測物要放<b>左盤</b>，砝碼放右盤（左物右碼）。"));
        if(!left){ toast("放到左盤"); return draw(); }
        S.obj = true; return draw("");
      }
      const w = +k.slice(1);
      if(!S.obj){ toast("先把待測物放上左盤"); return draw(); }
      if(!S.tw) return draw(say("😕 不可以用手直接拿砝碼！課本圖 1-5：用<b>砝碼夾</b>夾砝碼。（手上的汗和油會讓砝碼生鏽、質量改變——一般常識）"));
      if(left) return draw(say("砝碼要放<b>右盤</b>。"));
      if(!right){ toast("放到右盤"); return draw(); }
      const big = W.find(v => v > w && !S.pan.includes(v) && sum() + v <= M + 1e-9 && !S.tried?.includes(v));
      if(big) return draw(say(`砝碼要<b>由大到小</b>試：${lab(big)} 還沒試過，先放大的。`));
      S.pan.push(w); S.pan.sort((a, b) => b - a);
      const s = sum();
      if(s > M + 1e-9){ S.tried = (S.tried || []).concat([w]); return draw(say(`指針偏向左邊——右盤太重了（${s} g）。點右盤上剛放的砝碼把它拿回來，換小一點的。`)); }
      draw(s === M ? say("✅ 指針回到正中央了！", true) : "");
    })});
    K.draw = draw; draw("");
  }
}});

/* ═════ 第 2 章 活動站：物質的世界（正式實驗以外的課本活動） ═════
   ① 注射筒壓縮（p.35 圖 2-3：紅墨水 15 mL 推不動、空氣 15 mL 壓到 10 mL）② 濾紙色層分析（p.42 探索活動、圖 2-11）
   ③ 飽和與濃度（p.45 食鹽 25 ℃ 36 g／100 ℃ 約 39 g；p.46 例題 2-4 配 20% 糖水）
   ④ 二氧化碳的製備與檢驗（p.53 圖 2-26、2-27：大理岩＋稀鹽酸、排水集氣、線香熄滅、石灰水變混濁）⑤ 自製簡易濾水器（p.57 探索活動） */
LABS.push({id: "st-ch2", ch: "ch2", icon: "🧪", title: "第 2 章 活動站：物質的世界", page: "p.35–57",
  desc: "壓注射筒、濾紙色層分析、加鹽到飽和、配糖水、製造二氧化碳、做濾水器。", run(pane, L){
  const tile = (k, x, y, n, ic) => `<g data-it="${k}" transform="translate(${x} ${y})"><rect x="-28" y="-4" width="56" height="66" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${ic}<text x="0" y="56" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">${n}</text></g>`;

  handStation(pane, L, [
    {key: "syringe", title: "注射筒壓縮", page: "p.35", run: actSyringe},

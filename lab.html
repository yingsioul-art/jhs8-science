    {key: "filter", title: "自製簡易濾水器", page: "p.57", run: actFilter}]);
  /* ① 注射筒：手指按住出口再推活塞；沒按住，紅墨水會噴出來 */
  function actSyringe(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 230"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({cover: {ink: false, air: false}, vol: {ink: 15, air: 15}, spill: false, pushed: {}}));
    const svg = box.querySelector("svg");
    function syr(k, y){
      const S = K.S, v = S.vol[k], len = v * 9, col = k === "ink" ? "#e03131" : "#e7f5ff";
      let g = `<text x="20" y="${y - 22}" font-size="12" fill="var(--ink)" font-weight="700">${k === "ink" ? "A 紅墨水" : "B 空氣"}</text>
        <rect x="70" y="${y - 14}" width="150" height="28" rx="4" fill="#fff" stroke="#868e96"/><rect x="${220 - len}" y="${y - 12}" width="${len}" height="24" fill="${col}" opacity=".85"/>
        <rect x="${220 - len - 8}" y="${y - 14}" width="8" height="28" fill="#495057"/><rect x="${220 - len - 70}" y="${y - 3}" width="62" height="6" fill="#495057"/><rect x="${220 - len - 78}" y="${y - 12}" width="8" height="24" fill="#495057"/>
        <path d="M220 ${y - 4} h18 v8 h-18z" fill="#868e96"/><text x="150" y="${y + 30}" font-size="10" text-anchor="middle" fill="var(--sub)">${v} mL</text>`;
      if(S.cover[k]) g += `<text x="234" y="${y + 8}" font-size="22">👆</text>`;
      if(k === "ink" && S.spill) g += `<g fill="#e03131">${[0, 1, 2, 3, 4].map(i => `<circle cx="${250 + i * 18}" cy="${y - 6 + (i % 2) * 10}" r="${3 + i % 3}"/>`).join("")}</g>`;
      g += `<rect x="64" y="${y - 30}" width="200" height="60" fill="transparent" data-zone="${k}"/>`;
      return g;
    }
    function draw(msg){
      const S = K.S;
      svg.innerHTML = syr("ink", 100) + syr("air", 180) + (S.cover.ink && S.cover.air ? "" : tile("finger", 320, 10, "手指", `<text x="0" y="36" font-size="26" text-anchor="middle">👆</text>`));
      box.querySelector(".htask").innerHTML = "圖 2-3：把<b>手指</b>拖到注射筒的出口按住，再推活塞。A 裝 15 mL 紅墨水、B 裝 15 mL 空氣，兩支都試。";
      handBtns(box.querySelector("[data-btn]"), `<button class="btn" data-b="ink">推 A 的活塞</button><button class="btn" data-b="air">推 B 的活塞</button>`, act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(!S.cover[b]){
        if(b === "ink"){ S.spill = true; S.vol.ink = 9; return draw(say("😕 出口沒按住，紅墨水從出口<b>噴出來</b>灑了一桌！這樣看不出液體能不能被壓縮。按「↩ 上一步」，先用手指按住出口。")); }
        S.vol.air = 3; return draw(say("出口沒按住，空氣直接從出口跑掉了，這樣看不出能不能壓縮。按「↩ 上一步」，先按住出口。"));
      }
      S.pushed[b] = 1;
      if(b === "ink") draw(say("用力推……活塞<b>推不動</b>，紅墨水還是 15 mL。"));
      else { S.vol.air = 10; draw(say("活塞推進去了！空氣從 15 mL 被壓到 10 mL。放手後活塞又被推回來一些。", true)); }
      if(S.pushed.ink && S.pushed.air) handMC(box.querySelector("[data-q]"), "從兩支注射筒可以知道什麼？", [["液體不容易被壓縮，氣體可以被壓縮", 1], ["液體和氣體都可以被壓縮", 0, "A 的活塞推不動。"], ["液體可以被壓縮，氣體不行", 0, "反過來了：B 的空氣從 15 mL 變 10 mL。"]],
        () => { draw(say("✅ 氣體具有可壓縮性，液體則不易被壓縮（p.35）。", true)); done(); });
    });
    handDnd(svg, {name: () => "手指", drop: K.track((k, x, y) => {
      const S = K.S, z = inR(x, y, [64, 70, 300, 130]) ? "ink" : inR(x, y, [64, 150, 300, 210]) ? "air" : null;
      if(!z){ toast("拖到注射筒出口"); return draw(); }
      if(S.cover[z]){ toast("已經按住了"); return draw(); }
      S.cover[z] = true; draw("");
    })});
    K.draw = draw; draw("");
  }

  /* ② 濾紙色層分析：畫線 → 剪開 → 往背面摺 90 度 → 摺端放進約 0.5 cm 高的水；線畫太低會泡進水裡 */
  function actChroma(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 240"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({line: null, cut: false, fold: false, dip: false, t: 0}));
    const svg = box.querySelector("svg");
    const tk = setInterval(() => { if(!K.alive()) return clearInterval(tk); if(K.ctl.paused || !K.S.dip || K.S.t >= 1) return; K.S.t = Math.min(1, K.S.t + .02); if(!K.dragging) draw(); if(K.S.t >= 1) quiz(); }, 100);
    function draw(msg){
      const S = K.S; let g = `<text x="180" y="94" text-anchor="middle" font-size="10" fill="var(--sub)">圓形濾紙</text>`;
      const cy = 160;
      g += `<circle cx="180" cy="${cy}" r="58" fill="#fff" stroke="#adb5bd"/>`;
      if(S.cut) g += `<path d="M160 ${cy + 20} v38 M200 ${cy + 20} v38" stroke="#555" stroke-dasharray="3 2"/>`;
      if(S.fold) g += `<rect x="160" y="${cy + 20}" width="40" height="38" fill="#f1f3f5" stroke="#adb5bd"/><text x="180" y="${cy + 44}" font-size="9" text-anchor="middle" fill="var(--sub)">摺下去</text>`;
      if(S.line !== null){
        const ly = cy + S.line;
        if(S.dip && S.line > 40){ g += `<rect x="150" y="${ly - 4}" width="60" height="8" fill="#8d6e63" opacity="${1 - S.t}"/>`; }
        else if(S.dip){ const h = S.t * 70; [["#fab005", 1], ["#e64980", .7], ["#1c7ed6", .45]].forEach(([c, f], i) => { g += `<path d="M162 ${ly - h * f} q18 -6 36 0" stroke="${c}" stroke-width="5" fill="none" opacity=".85"/>`; }); g += `<path d="M162 ${ly} q18 -6 36 0" stroke="#8d6e63" stroke-width="2" fill="none" opacity="${1 - S.t * .8}"/>`; }
        else g += `<path d="M162 ${ly} q18 -6 36 0" stroke="#8d6e63" stroke-width="4" fill="none"/>`;
      }
      if(S.dip) g += `<rect x="120" y="${cy + 46}" width="120" height="22" rx="4" fill="#a5d8ff" opacity="${S.line > 40 ? .55 + .3 * (1 - S.t) : .45}"/><text x="250" y="${cy + 62}" font-size="9" fill="var(--sub)">水約 0.5 cm 高</text>`;
      g += `<rect x="110" y="96" width="140" height="130" fill="transparent"/>`;
      const T = [S.line === null ? ["pen", "棕色水性筆", `<rect x="-4" y="4" width="8" height="34" rx="2" fill="#8d6e63"/>`] : null, S.line !== null && !S.cut ? ["sc", "剪刀", `<text x="0" y="34" font-size="24" text-anchor="middle">✂️</text>`] : null, S.fold && !S.dip ? ["dish", "放進培養皿", `<ellipse cx="0" cy="30" rx="20" ry="7" fill="#a5d8ff" stroke="#74c0fc"/>`] : null].filter(Boolean);
      g += T.map((t, i) => tile(t[0], 40 + i * 64, 10, t[1], t[2])).join("");

      box.querySelector(".htask").innerHTML = "探索活動：❶ 用<b>棕色水性筆</b>在濾紙下緣畫一條弧線，再從弧線兩端下方剪開 → ❷ 剪開的部分往背面摺 90 度 → ❸ 培養皿加約 0.5 公分高的水，摺端浸入水中觀察。";
      handBtns(box.querySelector("[data-btn]"), S.cut && !S.fold ? `<button class="btn" data-b="fold">↩ 剪開的部分往背面摺 90 度</button>` : "", act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      K.ctl.upd();
    }
    const act = K.track(b => { if(b === "fold"){ K.S.fold = true; draw(""); } });
    let asked = false;
    function quiz(){
      const S = K.S;
      if(S.line > 40) return draw(say("😕 線畫得<b>太低</b>，泡到水裡了——顏料直接溶進水中，濾紙上什麼也分不出來。（p.61 也提醒：標色的位置不可沒入水面）按「↩ 上一步」重畫高一點。"));

        () => { draw(say("✅ 圖 2-11：棕色水性筆的顏料含有不同色素。濾紙色層分析可以把混合物裡的成分分開。", true)); done(); });

      const S = K.S, on = inR(x, y, [110, 96, 250, 226]);

      if(k === "sc"){ S.cut = true; return draw(""); }

  /* ③ 飽和：25 ℃ 100 g 水最多溶 36 g 食鹽（一匙 6 g）；加熱到 100 ℃ 約可溶 39 g。濃度：配 20% 糖水（例題 2-4） */
  function actSat(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 230"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({part: "salt", salt: 0, stirred: true, hot: false, satQ: false, sugar: 0, water: 0}));
    const svg = box.querySelector("svg");
    const cap = () => K.S.hot ? 39 : 36, dis = () => Math.min(K.S.salt, cap());
    function draw(msg){
      const S = K.S; let g = "";
      if(S.part === "salt"){
        const left = S.salt - dis();
        g += `<rect x="130" y="110" width="100" height="100" fill="${S.hot ? "#ffe3e3" : "#e7f5ff"}" opacity=".7" stroke="#5c7cfa" stroke-width="2"/><text x="180" y="226" text-anchor="middle" font-size="10" fill="var(--sub)">100 g 水（${S.hot ? "100" : "25"} ℃）</text>`;
        if(left > 0) g += `<path d="M135 208 q45 -${4 + left} 90 0z" fill="#f8f9fa" stroke="#adb5bd"/>`;
        if(!S.stirred) g += `<path d="M150 205 q30 -8 60 0z" fill="#f8f9fa" stroke="#adb5bd"/>`;
        g += `<rect x="250" y="120" width="96" height="44" rx="6" fill="var(--card)" stroke="var(--line)"/><text x="298" y="138" text-anchor="middle" font-size="11" fill="var(--ink)">已加入 ${S.salt} g</text><text x="298" y="156" text-anchor="middle" font-size="11" fill="var(--ink)">溶解 ${S.stirred ? dis() : dis() - 6 < 0 ? 0 : dis() - 6} g</text>`;
        g += `<rect x="120" y="90" width="120" height="125" fill="transparent"/>` + tile("salt", 40, 10, "食鹽一匙（6 g）", `<path d="M-14 30 q14 -14 28 0z" fill="#f8f9fa" stroke="#adb5bd"/><rect x="10" y="22" width="16" height="4" fill="#868e96"/>`);
      } else {
        const tot = S.sugar + S.water, c = tot ? S.sugar / tot * 100 : 0;
        g += `<rect x="100" y="170" width="160" height="40" rx="6" fill="#dee2e6" stroke="#868e96"/><rect x="130" y="178" width="100" height="22" rx="3" fill="#1b2a1b"/><text x="222" y="194" text-anchor="end" font-size="14" fill="#69db7c" font-family="monospace">${tot.toFixed(0)} g</text>
          <rect x="150" y="110" width="60" height="56" fill="#e7f5ff" opacity=".6" stroke="#5c7cfa" stroke-width="2"/>${S.water ? `<rect x="151" y="${166 - Math.min(54, S.water * .5)}" width="58" height="${Math.min(54, S.water * .5)}" fill="#ffe8a3" opacity=".8"/>` : ""}
          <rect x="262" y="100" width="92" height="64" rx="6" fill="var(--card)" stroke="var(--line)"/><text x="308" y="118" text-anchor="middle" font-size="10">糖（溶質）${S.sugar} g</text><text x="308" y="134" text-anchor="middle" font-size="10">水（溶劑）${S.water} g</text><text x="308" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="${Math.abs(c - 20) < .01 ? "#2f9e44" : "var(--ink)"}">濃度 ${c.toFixed(1)}%</text>
          <rect x="140" y="90" width="80" height="90" fill="transparent"/>` + tile("sugar", 40, 10, "糖 20 g", `<rect x="-12" y="14" width="24" height="18" fill="#fff" stroke="#adb5bd"/>`) + tile("water", 104, 10, "水 +20 g", `<rect x="-10" y="6" width="20" height="32" rx="4" fill="#d0ebff" stroke="#4dabf7"/>`);
      }
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.part === "salt" ? "飽和：把<b>食鹽</b>一匙一匙加進 25 ℃、100 g 的水裡，每加一匙就<b>攪拌</b>，直到再也溶不下。" : "濃度（例題 2-4）：用<b>糖 20 g</b> 和<b>水</b>配出重量百分率濃度 <b>20%</b> 的糖水。濃度＝溶質質量 ÷（溶質＋溶劑質量）× 100%。";
      handBtns(box.querySelector("[data-btn]"), S.part === "salt" ? (S.stirred ? "" : `<button class="btn gold" data-b="stir">🥄 攪拌</button>`) + (S.satQ && !S.hot ? `<button class="btn" data-b="heat">🔥 加熱到 100 ℃</button>` : "")
        : `<button class="btn ghost" data-b="less">倒掉 20 g 水</button>` + (S.sugar && S.water ? `<button class="btn gold" data-b="ok">✅ 配好了</button>` : ""), act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(b === "stir"){
        S.stirred = true;
        if(S.salt > cap() && !S.satQ){ S.satQ = true; draw(say(`攪了又攪，杯底還是剩 ${S.salt - cap()} g 食鹽溶不掉。`));
          return handMC(box.querySelector("[data-q]"), "杯底有食鹽怎麼攪都溶不掉，這杯食鹽水是？", [["飽和溶液：在這個溫度下已經不能再溶解食鹽", 1], ["未飽和溶液，再多攪一下就會溶", 0, "已經攪很久了，杯底的鹽還在。"], ["純物質", 0, "食鹽水是食鹽和水的混合物。"]],
            () => draw(say("✅ 25 ℃ 時，100 g 水最多溶解約 36 g 食鹽（p.45）。試試把它加熱到 100 ℃。", true))); }
        return draw(S.salt <= cap() ? say(`溶解了！目前溶了 ${S.salt} g。`, true) : "");
      }
      if(b === "heat"){ S.hot = true; draw(say(`加熱到 100 ℃，杯底的鹽又溶掉一些，剩 ${Math.max(0, S.salt - 39)} g。`));
        return handMC(box.querySelector("[data-q]"), "加熱後杯底的鹽變少了，代表什麼？", [["溫度升高，100 g 水可以溶解的食鹽變多了（100 ℃ 約 39 g）", 1], ["加熱讓食鹽消失了", 0, "食鹽是溶進水裡，不是消失。"], ["加熱讓水變多了", 0, "加熱只會讓水蒸發變少。"]],
          K.track(() => { S.part = "sugar"; box.querySelector("[data-q]").innerHTML = ""; draw(say("✅ 知識快遞：100 ℃ 時，100 g 水約可溶解 39 g 食鹽。接下來配糖水。", true)); })); }
      if(b === "less"){ S.water = Math.max(0, S.water - 20); return draw(""); }
      if(b === "ok"){
        const c = S.sugar / (S.sugar + S.water) * 100;
        if(Math.abs(c - 20) > .01) return draw(say(`現在是 ${c.toFixed(1)}%。${S.water === 100 ? "20 g 糖加 100 g 水，溶液是 120 g，20 ÷ 120 ≈ 16.7%——<b>分母是整杯溶液</b>，不是只有水。" : "調整水的量，讓糖占整杯糖水的 20%。"}`));
        return handMC(box.querySelector("[data-q]"), "例題 2-4：甲用 100 g 水＋20 g 糖、乙用 80 g 水＋20 g 糖，誰配出 20% 糖水？", [["乙：20 ÷（20＋80）× 100%＝20%", 1], ["甲：糖 20 g 除以水 100 g 就是 20%", 0, "分母要用溶液質量（糖＋水），甲是 20 ÷ 120。"], ["兩個都是 20%", 0, "溶液質量不一樣，濃度就不一樣。"]],
          () => { draw(say("✅ 重量百分率濃度的分母是<b>溶液</b>（溶質＋溶劑）的質量。", true)); done(); });
      }
    });
    handDnd(svg, {name: k => ({salt: "食鹽一匙", sugar: "糖 20 g", water: "水 20 g"})[k], drop: K.track((k, x, y) => {
      const S = K.S;
      if(!inR(x, y, [110, 80, 250, 220])){ toast("倒進燒杯"); return draw(); }
      if(k === "salt"){ if(!S.stirred) return draw(say("上一匙還沒攪拌，先攪一攪，看它溶不溶得掉。")); if(S.satQ) return draw(say("已經飽和了，再加也溶不掉。")); S.salt += 6; S.stirred = false; return draw(""); }
      if(k === "sugar"){ if(S.sugar){ toast("糖已經放了 20 g"); return draw(); } S.sugar = 20; return draw(""); }
      if(k === "water"){ S.water += 20; return draw(""); }
      draw();
    })});
    K.draw = draw; draw("");
  }

  /* ④ 二氧化碳：大理岩＋水 → 稀鹽酸由薊頭漏斗加入 → 排水集氣 → 線香熄滅、石灰水變混濁
     稀鹽酸直接打開瓶塞倒 → 濺到手（急救照課本 p.8 第 7 條） */
  function actCO2(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 250"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({rock: false, water: false, acid: false, gas: 0, out: false, stick: null, lime: 0}));
    const svg = box.querySelector("svg"); let accN = 0;
    const tk = setInterval(() => { if(!K.alive()) return clearInterval(tk); if(K.ctl.paused || !K.S.acid || K.S.gas >= 1 || K.S.out) return; K.S.gas = Math.min(1, K.S.gas + .02); if(!K.dragging) draw(K.S.gas >= 1 ? say("集氣瓶裡的水都被排出來了，裝滿二氧化碳。", true) : undefined); }, 100);
    function draw(msg){
      const S = K.S; let g = "";
      if(!S.out){
        g += `<path d="M60 230 V160 Q60 140 80 140 H120 Q140 140 140 160 V230 Z" fill="#fff" stroke="#5c7cfa" stroke-width="2"/>`;
        if(S.water) g += `<path d="M61 229 V190 H139 V229 Z" fill="#a5d8ff" opacity=".7"/>`;
        if(S.rock) g += `<g fill="#ced4da" stroke="#868e96">${[0, 1, 2, 3].map(i => `<rect x="${70 + i * 15}" y="${214 - (i % 2) * 6}" width="12" height="10" rx="2"/>`).join("")}</g>`;
        if(S.acid && S.gas < 1) for(let i = 0; i < 6; i++) g += `<circle cx="${72 + Math.random() * 56}" cy="${196 + Math.random() * 28}" r="2.5" fill="#fff" stroke="#74c0fc"/>`;
        g += `<path d="M90 140 V70 M84 70 h12 l-6 -18 z" stroke="#868e96" stroke-width="3" fill="#e9ecef"/><text x="70" y="44" font-size="9" fill="var(--sub)">薊頭漏斗</text>
          <path d="M115 140 V110 H240 V200" stroke="#868e96" stroke-width="3" fill="none"/>
          <rect x="200" y="190" width="140" height="48" fill="#a5d8ff" opacity=".6" stroke="#74c0fc"/><rect x="220" y="${120}" width="44" height="100" fill="#fff" opacity=".7" stroke="#5c7cfa" stroke-width="2"/>
          <rect x="221" y="${121 + 98 * S.gas}" width="42" height="${98 * (1 - S.gas)}" fill="#a5d8ff" opacity=".8"/><text x="290" y="140" font-size="9" fill="var(--sub)">集氣瓶</text>
          <rect x="40" y="50" width="120" height="190" fill="transparent"/>`;
        const T = [!S.rock ? ["rock", "大理岩", `<rect x="-12" y="16" width="24" height="16" rx="3" fill="#ced4da" stroke="#868e96"/>`] : null, !S.water ? ["water", "水", `<rect x="-10" y="6" width="20" height="32" rx="4" fill="#d0ebff" stroke="#4dabf7"/>`] : null,
          S.rock && S.water && !S.acid ? ["acid", "稀鹽酸", `<rect x="-10" y="6" width="20" height="32" rx="3" fill="#fff9db" stroke="#f08c00"/><text x="0" y="28" font-size="8" text-anchor="middle">HCl</text>`] : null].filter(Boolean);
        g += T.map((t, i) => tile(t[0], 200 + i * 64, 10, t[1], t[2])).join("");
      } else {
        const lc = S.lime === 2 ? "#e9ecef" : "#f1f3f5";
        g += `<rect x="60" y="100" width="70" height="120" rx="6" fill="#fff" stroke="#5c7cfa" stroke-width="2"/><text x="95" y="236" text-anchor="middle" font-size="10" fill="var(--sub)">二氧化碳瓶</text>`;
        if(S.lime) g += `<rect x="61" y="190" width="68" height="29" fill="${lc}" stroke="none"/>${S.lime === 2 ? `<g fill="#fff">${[0, 1, 2, 3, 4, 5].map(i => `<circle cx="${70 + i * 10}" cy="${200 + (i % 2) * 8}" r="3"/>`).join("")}</g>` : ""}`;
        if(S.stick) g += `<line x1="95" y1="70" x2="95" y2="150" stroke="#a0522d" stroke-width="3"/>${S.stick === "lit" ? flameP(95, 152, 14, 4, "#ff6a1f", "#ffd23f") : `<circle cx="95" cy="152" r="2" fill="#555"/>`}`;
        g += `<rect x="40" y="60" width="110" height="170" fill="transparent"/>`;
        const T = [!S.stick ? ["stick", "點燃的線香", `<line x1="0" y1="8" x2="0" y2="40" stroke="#a0522d" stroke-width="3"/>${flameP(0, 8, 10, 3, "#ff6a1f", "#ffd23f")}`] : null, S.stick && !S.lime ? ["lime", "澄清石灰水", `<rect x="-10" y="6" width="20" height="32" rx="3" fill="#f8f9fa" stroke="#adb5bd"/>`] : null].filter(Boolean);
        g += T.map((t, i) => tile(t[0], 220 + i * 64, 10, t[1], t[2])).join("");
      }
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = !S.out ? "圖 2-26：錐形瓶裝<b>大理岩＋水</b>，<b>稀鹽酸由薊頭漏斗加入</b>，用排水集氣法收集二氧化碳。" : "檢驗：把<b>點燃的線香</b>放進瓶裡（圖 2-27），再倒入<b>澄清石灰水</b>搖一搖。";
      handBtns(box.querySelector("[data-btn]"), !S.out && S.gas >= 1 ? `<button class="btn gold" data-b="take">在水中蓋上玻璃片，取出集氣瓶</button>` : S.lime === 1 ? `<button class="btn gold" data-b="shake">🔄 搖一搖</button>` : "", act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(b === "take"){ S.out = true; return draw(""); }
      if(b === "shake"){ S.lime = 2; draw(say("澄清石灰水變<b>混濁</b>了，出現白色沉澱。", true));
        return handMC(box.querySelector("[data-q]"), "要檢驗一瓶氣體是不是二氧化碳，課本用的是哪一個方法？", [["倒入澄清石灰水，看會不會變混濁（產生白色沉澱）", 1], ["放入線香，看會不會燒得更旺", 0, "燒得更旺是氧氣（實驗 2-3）。二氧化碳會讓線香熄滅。"], ["湊近聞聞看", 0, "實驗室的氣體不可以直接湊近聞。"]],
          () => { draw(say("✅ 石灰水與二氧化碳反應會產生白色沉澱物，可用來檢驗二氧化碳；線香在二氧化碳中會熄滅（p.53）。", true)); done(); }); }
    });
    handDnd(svg, {name: k => ({rock: "大理岩", water: "水", acid: "稀鹽酸", stick: "點燃的線香", lime: "澄清石灰水"})[k], drop: K.track((k, x, y) => {
      const S = K.S;

          accN++; draw("");
          return handAccident(box.querySelector(".hand"), {pic: `<svg viewBox="0 0 240 110"><rect x="0" y="92" width="240" height="18" rx="4" fill="#6b4a2f"/><text x="120" y="80" font-size="56" text-anchor="middle">✋</text><g fill="#fab005">${[0, 1, 2, 3, 4].map(i => `<circle cx="${92 + i * 14}" cy="${30 + (i % 2) * 10}" r="4"/>`).join("")}</g></svg>`,
            title: "💥 稀鹽酸濺到手上！", cause: "打開瓶塞直接把稀鹽酸往瓶口倒，瓶裡劇烈冒泡，酸液濺到手上，皮膚刺痛。", ...{q: "酸液濺到皮膚了！第一步要怎麼做？", opts: [
              {t: "盡快用大量清水沖洗，並報告老師、就醫", ok: true, why: "課本 p.8 第 7 條：身體或眼睛不小心沾到藥品，應盡快使用大量清水沖洗並立即就醫。"},
              {t: "用衛生紙擦乾就好", why: "擦不乾淨，酸會繼續傷害皮膚。"}, {t: "先把實驗做完", why: "拖越久傷害越大。"}, {t: "塗藥膏蓋住", why: "酸被悶在皮膚上。"}]},
            lesson: "稀鹽酸要<b>從薊頭漏斗加入</b>，瓶子保持塞緊（課本圖 2-26）。直接開瓶倒會濺出、氣體也會跑掉。（濺出情節是一般安全常識，課本沒有寫）"},
            () => draw(say("回到出事前。稀鹽酸要從薊頭漏斗加。")));
        }

      }
      if(!S.out){
        if(!inR(x, y, [40, 50, 160, 240])){ toast("放進錐形瓶"); return draw(); }
        if(k === "rock"){ S.rock = true; return draw(""); }
        if(k === "water"){ S.water = true; return draw(""); }

      if(k === "stick"){ S.stick = "lit"; draw(""); K.ctl.wait(1200, () => { S.stick = "out"; draw(say("線香一放進去就<b>熄滅</b>了！二氧化碳不能幫助燃燒。", true)); }); return; }
      if(k === "lime"){ S.lime = 1; return draw(say("倒入澄清石灰水。")); }

    K.draw = draw; draw("");
  }

  /* ⑤ 自製濾水器：吸管底部塞棉花 → 規畫濾材順序（每層約 1.5～2 公分）→ 倒入汙水 → 比較、提出 2.0 版假設 */
  function actFilter(box, done){
    const MAT = {cotton: ["棉花", "#fff"], stone: ["麥飯石", "#868e96"], sand: ["海灘砂", "#e9c46a"], carbon: ["活性碳", "#343a40"]};
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 250"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({stack: [], poured: false, runs: []}));
    const svg = box.querySelector("svg");
    /* 濾出水的混濁度（示意，一般常識）：底層沒棉花→砂漏出；有活性碳去色；粗的在上、細的在下比較不會塞住 */
    function result(st){
      if(st[0] !== "cotton") return {clear: 10, msg: "底部沒有先塞棉花，砂子和碳粒跟著水一起漏出來，濾出的水更髒了！"};
      const top = st[st.length - 1], hasC = st.includes("carbon"), hasS = st.includes("sand");
      let clear = 40 + (hasS ? 25 : 0) + (hasC ? 20 : 0), slow = top === "sand";
      return {clear: Math.min(90, clear), slow, msg: (slow ? "最上層是細細的海灘砂，泥巴很快把表面塞住，水流得很慢。" : "水順順地流下來。") + (hasC ? "" : "濾出的水還有一點顏色和味道。")};
    }
    function draw(msg){
      const S = K.S; let g = `<rect x="150" y="50" width="40" height="170" fill="#fff" opacity=".6" stroke="#5c7cfa" stroke-width="2"/><text x="170" y="44" text-anchor="middle" font-size="9" fill="var(--sub)">吸管（倒過來）</text>`;
      S.stack.forEach((m, i) => { const y = 200 - i * 30; g += `<rect x="151" y="${y - 28}" width="38" height="28" fill="${MAT[m][1]}" stroke="#adb5bd"/><text x="200" y="${y - 10}" font-size="9" fill="var(--ink)">${MAT[m][0]}</text>`; });
      g += `<rect x="140" y="222" width="60" height="26" fill="#e7f5ff" opacity=".6" stroke="#74c0fc"/>`;
      if(S.poured){ const r = result(S.stack); g += `<rect x="141" y="234" width="58" height="13" fill="#8d6e63" opacity="${(100 - r.clear) / 100}"/><text x="210" y="244" font-size="9" fill="var(--ink)">清澈度 ${r.clear}</text>`; }
      g += `<rect x="130" y="40" width="80" height="185" fill="transparent"/>`;
      g += Object.keys(MAT).filter(k => !S.stack.includes(k) && !S.poured).map((k, i) => tile(k, 34 + i * 62, 10, MAT[k][0], `<rect x="-14" y="12" width="28" height="22" rx="3" fill="${MAT[k][1]}" stroke="#adb5bd"/>`)).join("");
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = "探索活動：❶ 離吸管底部約 2 公分處塞入<b>棉花</b> → ❷ 規畫濾材的放置順序，依序堆疊（每層約 1.5～2 公分）→ ❸ 倒入汙水，用燒杯收集過濾後的水。";
      handBtns(box.querySelector("[data-btn]"), !S.poured && S.stack.length >= 2 ? `<button class="btn gold" data-b="pour">💧 倒入汙水</button>` : S.poured ? `<button class="btn ghost" data-b="redo">倒掉、拆開重做一支</button>` : "", act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(b === "pour"){ S.poured = true; const r = result(S.stack); S.runs.push(S.stack.join("→")); draw(say(r.msg + "（濾材效果是示意，課本請你自己蒐集資料、動手比較）", r.clear >= 60 && !r.slow));
        if(S.stack[0] === "cotton") quiz(); return; }
      if(b === "redo"){ S.stack = []; S.poured = false; box.querySelector("[data-q]").innerHTML = ""; return draw(""); }
    });
    let step = 0;
    function quiz(){
      const q = box.querySelector("[data-q]");
      if(step === 0) handMC(q, "課本要你提出「簡易濾水器 2.0 版」的假設並設計實驗驗證。想知道「濾材順序」會不會影響過濾效果，要怎麼設計？", [["只改變濾材順序，濾材種類、每層厚度、倒入的汙水量都保持相同", 1], ["順序、厚度、汙水量一起改，比較快", 0, "同時改好幾個條件，就不知道是哪一個造成差別（控制變因，p.9）。"], ["只做一支就好，不用比較", 0, "要有比較，才知道改變的條件有沒有影響。"]],
        () => { step = 1; quiz(); });
      else handMC(q, "自製濾水器濾出來的水，可以直接喝嗎？", [["不可以：只濾掉看得到的雜質，水裡可能還有看不見的細菌或溶解的物質", 1], ["可以：看起來清澈就是乾淨的水", 0, "清澈不等於乾淨，細菌和溶解在水中的物質看不到。"], ["可以，只要多濾幾次", 0, "簡易濾材濾不掉看不見的細菌和溶解的物質。"]],
        () => { draw(say("✅ 課本對話框：比較圖 2-32 生命吸管的構造，自製濾水器濾出的水<b>不能直接喝</b>。（理由是一般常識）", true)); done(); });
    }
    handDnd(svg, {name: k => MAT[k][0], drop: K.track((k, x, y) => {
      const S = K.S;
      if(!inR(x, y, [120, 30, 220, 230])){ toast("放進吸管"); return draw(); }
      S.stack.push(k); draw(S.stack.length === 1 && k !== "cotton" ? say("最下面沒有先塞棉花……倒水時會怎樣呢？") : "");
    })});
    K.draw = draw; draw("");
  }
}});

/* ═════ 第 3 章 活動站：波動與聲音（課本沒有正式實驗；取課本探索活動與圖示操作） ═════
   ① 彈簧橫波與縱波（p.70–71 探索活動、圖 3-2～3-4）② 波的各部位與波速（p.72–74、圖 3-5、例題 3-1）
   ③ 聲音的產生與傳播（p.75–77 探索活動、圖 3-8～3-12）④ 聲納測海深（p.80、圖 3-19）⑤ 音調與響度（p.83–85） */
LABS.push({id: "st-ch3", ch: "ch34", icon: "🎵", title: "第 3 章 活動站：波動與聲音", page: "p.70–85",
  desc: "抖彈簧、量波長、敲音叉、抽真空、聲納測海深、撥直尺改音調。", run(pane, L){
  handStation(pane, L, [
    {key: "slinky", title: "彈簧橫波與縱波", page: "p.70–71", run: actSlinky},
    {key: "parts", title: "波的各部位與波速", page: "p.72–74", run: actParts},
    {key: "fork", title: "聲音的產生與傳播", page: "p.75–77", run: actFork},
    {key: "sonar", title: "聲納測海深", page: "p.80", run: actSonar},
    {key: "pitch", title: "音調與響度", page: "p.83–85", run: actPitch}]);

  /* ① 彈簧：手上下抖＝橫波、前後推拉＝縱波；緞帶（紅點）只在原地振動 */
  function actSlinky(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 200"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({mode: null, t: 0, watched: {}, ans: {}}));
    const svg = box.querySelector("svg"), N = 26;
    const tick = setInterval(() => { if(!K.alive()) return clearInterval(tick); if(K.ctl.paused || !K.S.mode) return; K.S.t += .1; if(K.S.t > 2.5) K.S.watched[K.S.mode] = 1; draw(); }, 100);
    function draw(msg){
      const S = K.S; let g = `<text x="10" y="20" font-size="12" fill="var(--sub)">✋ 手</text><line x1="20" y1="100" x2="350" y2="100" stroke="var(--line)" stroke-dasharray="4 4"/>`;
      for(let i = 0; i < N; i++){
        const x0 = 24 + i * 12.6, ph = S.t * 6 - i * .5, on = S.mode && i <= S.t * 12;
        const dx = S.mode === "long" && on ? 6 * Math.sin(ph) : 0, dy = S.mode === "trans" && on ? 30 * Math.sin(ph) : 0;
        g += `<ellipse cx="${x0 + dx}" cy="${100 + dy}" rx="3" ry="20" fill="none" stroke="${i === 13 ? "#e03131" : "#868e96"}" stroke-width="${i === 13 ? 3 : 1.6}"/>`;
        if(i === 13) g += `<path d="M${x0 + dx} ${76 + dy} v-12" stroke="#e03131" stroke-width="3"/><text x="${x0 + dx}" y="${58 + dy}" text-anchor="middle" font-size="10" fill="#e03131">緞帶</text>`;
      }
      if(S.mode) g += `<path d="M150 185 H230" stroke="var(--ink)" marker-end="url(#ar)"/><text x="190" y="180" text-anchor="middle" font-size="10" fill="var(--sub)">波前進方向</text><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="var(--ink)"/></marker></defs>`;
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = "探索活動：手握彈簧一端，<b>上下抖動</b>或<b>前後推拉</b>，盯著中間的紅色緞帶。兩種都要試，再回答問題。";
      handBtns(box.querySelector("[data-btn]"), `<button class="btn${S.mode === "trans" ? " gold" : ""}" data-b="trans">↕ 手上下抖動</button><button class="btn${S.mode === "long" ? " gold" : ""}" data-b="long">↔ 手前後推拉</button><button class="btn ghost" data-b="stop">✋ 停</button>`, act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    const act = K.track(b => { if(b === "stop"){ K.S.mode = null; K.S.t = 0; } else if(K.S.mode !== b){ K.S.mode = b; K.S.t = 0; } draw(""); });
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), m = S.mode && S.watched[S.mode] && !S.ans[S.mode] ? S.mode : null;
      if(shown === (m || "")) return; shown = m || "";
      if(!m){ q.innerHTML = ""; return; }
      handMC(q, m === "trans" ? "手<b>上下</b>抖動時，緞帶怎麼動？這是哪一種波？" : "手<b>前後</b>推拉時，緞帶怎麼動？這是哪一種波？",
        m === "trans" ? [["緞帶在原地上下振動，和波前進方向垂直：橫波", 1], ["緞帶跟著波一起往右跑：橫波", 0, "盯著紅色緞帶：它有沒有離開原來的位置往右跑？"], ["緞帶在原地前後振動：縱波", 0, "緞帶是上下動，不是前後動。"]]
          : [["緞帶在原地前後振動，和波前進方向平行：縱波", 1], ["緞帶跟著疏密一起往右跑：縱波", 0, "緞帶只在原地附近來回，沒有跟著波跑。"], ["緞帶上下振動：橫波", 0, "緞帶是前後（左右）動，不是上下動。"]],
        K.track(() => { S.ans[m] = 1; shown = null; const all = S.ans.trans && S.ans.long;
          draw(say(all ? "✅ 兩種都對！<b>波在傳播時，介質只在原處振動，並沒有隨著波前進</b>（p.70）。上下抖＝橫波（垂直），前後推拉＝縱波（平行），縱波會出現疏密相間。" : "✅ 答對了！再試另一種抖法。", true));
          if(all) done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ② 繩波：點出波峰、波谷；讀方格算波長；改頻率看波長變短、波速不變（例題 3-1） */
  function actParts(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 200"></svg></div>
      <div class="row" style="margin-top:6px;align-items:center;gap:10px"><label>頻率 <b data-fv></b> 次／秒 <input type="range" min="1" max="4" step="1" data-f></label><label>振幅 <input type="range" min="15" max="45" step="5" data-a></label></div>
      <div data-q></div><div data-fb></div>`, () => ({f: 2, a: 30, step: 0, t: 0}));
    const svg = box.querySelector("svg"), V = 120;            // 波速 120 cm/秒（1 格＝10 cm）
    const lam = () => V / K.S.f, X0 = 20, PX = 2.6;          // 1 cm＝2.6 px → 畫面寬約 120 cm
    const y = (x, t) => 100 - K.S.a * Math.sin(2 * Math.PI * (x / lam() - K.S.f * t));
    const tick = setInterval(() => { if(!K.alive()) return clearInterval(tick); if(K.ctl.paused || K.S.step < 2) return; K.S.t += .05; draw(); }, 50);
    function draw(msg){
      const S = K.S; let g = "";
      for(let c = 0; c <= 120; c += 10) g += `<line x1="${X0 + c * PX}" x2="${X0 + c * PX}" y1="40" y2="160" stroke="var(--line)"/><text x="${X0 + c * PX}" y="176" font-size="9" text-anchor="middle" fill="var(--sub)">${c}</text>`;
      g += `<text x="340" y="190" font-size="9" text-anchor="end" fill="var(--sub)">（cm）</text><line x1="${X0}" x2="${X0 + 120 * PX}" y1="100" y2="100" stroke="var(--sub)" stroke-dasharray="4 3"/><text x="${X0 + 2}" y="96" font-size="9" fill="var(--sub)">原靜止位置</text>`;
      let d = ""; for(let c = 0; c <= 120; c += 1) d += (c ? "L" : "M") + (X0 + c * PX).toFixed(1) + " " + y(c, S.t).toFixed(1);
      g += `<path d="${d}" fill="none" stroke="#1c7ed6" stroke-width="3"/><rect x="0" y="30" width="360" height="140" fill="transparent" data-hit/>`;
      (S.marks || []).forEach(([cx, cy, ok]) => { g += `<circle cx="${cx}" cy="${cy}" r="6" fill="none" stroke="${ok ? "#2f9e44" : "#e03131"}" stroke-width="2.5"/>`; });
      svg.innerHTML = g;
      box.querySelector("[data-fv]").textContent = S.f;
      box.querySelector("[data-f]").value = S.f; box.querySelector("[data-a]").value = S.a;
      box.querySelector("[data-f]").disabled = S.step < 3; box.querySelector("[data-a]").disabled = S.step < 2;
      box.querySelector(".htask").innerHTML = ["① 在繩波上<b>點出一個波峰</b>（偏離原靜止位置最高的點）。", "② 再<b>點出一個波谷</b>。", "③ 波動起來了！看方格：相鄰兩個波峰相距幾公分？（這就是<b>波長</b>）", "④ 把頻率改成 <b>4 次／秒</b>，再看看波長和波速。", "🎉 完成！"][Math.min(S.step, 4)];
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    svg.addEventListener("pointerdown", K.track(e => {
      const S = K.S; if(S.step > 1) return;
      const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse());
      const c = (q.x - X0) / PX, yy = y(c, S.t), want = S.step === 0 ? 100 - S.a : 100 + S.a, ok = Math.abs(yy - want) < 4 && Math.abs(q.y - yy) < 18;
      S.marks = (S.marks || []).concat([[q.x, yy, ok]]);
      if(!ok) return draw(say(S.step === 0 ? "這裡不是最高點。波峰是偏離原靜止位置<b>最高</b>的點。" : "這裡不是最低點。波谷是偏離原靜止位置<b>最低</b>的點。"));
      S.step++; S.marks = [[q.x, yy, true]];
      draw(say(S.step === 1 ? "✅ 波峰！波峰到原靜止位置的高度就是<b>振幅</b>。" : "✅ 波谷！現在讓繩子動起來。", true));
    }));
    box.querySelector("[data-f]").oninput = K.track(e => { K.S.f = +e.target.value; draw(""); });
    box.querySelector("[data-a]").oninput = K.track(e => { K.S.a = +e.target.value; draw(""); });
    let shown = -1;
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), k = S.step === 2 ? 2 : S.step === 3 && S.f === 4 ? 3 : -1;
      if(shown === k) return; shown = k;
      if(k < 0){ q.innerHTML = ""; return; }
      if(k === 2) handMC(q, "頻率 2 次／秒時，相鄰兩波峰相距（波長）是多少？波速＝頻率 × 波長 是多少？", [["波長 60 cm，波速 120 cm／秒", 1], ["波長 30 cm，波速 60 cm／秒", 0, "數方格：從一個波峰到下一個波峰，要跨過 6 格（每格 10 cm）。"], ["波長 60 cm，波速 30 cm／秒", 0, "波速＝頻率 × 波長＝2 × 60。"]],
        K.track(() => { S.step = 3; shown = null; draw(say("✅ v＝f × λ＝2 × 60＝120 cm／秒。改變振幅，波長會變嗎？試試看振幅滑桿，再把頻率改成 4。", true)); }));
      else handMC(q, "頻率變成 4 次／秒以後，波長和波速怎麼變？", [["波長變成一半（30 cm），波速不變（120 cm／秒）", 1], ["波長不變，波速變成 2 倍", 0, "數方格：兩個波峰之間只剩 3 格。"], ["波長和波速都變一半", 0, "v＝4 × 30＝120，和剛才一樣。"]],
        K.track(() => { S.step = 4; shown = null; draw(say("✅ 同一條繩子（同一種介質），波速不變；頻率變大，波長就變短（例題 3-1）。振幅只改變起伏高低，不改變波長。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ③ 音叉：用小槌敲 → 插進水槽濺水花 → 手握住聲音停；抽氣鐘罩：抽走空氣，鈴聲變小 */
  function actFork(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 230"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({part: "fork", ring: 0, inWater: false, held: false, q1: false, air: 100, bell: false, q2: false}));
    const svg = box.querySelector("svg");
    const TRAY = {mallet: [40, "橡膠小槌"], hammer: [100, "鐵鎚"]};
    const tick = setInterval(() => { if(!K.alive()) return clearInterval(tick); if(K.ctl.paused) return;
      const S = K.S;
      if(S.part === "fork" && S.ring > 0 && !S.held){ S.ring = Math.max(0, S.ring - .006); if(Math.random() < .08) handTone(440, 140, .05 * S.ring); if(!K.dragging) draw(); }
      if(S.part === "jar" && S.bell){ if(Math.random() < .25) handTone(1200, 90, .06 * S.air / 100); draw(); } }, 100);
    function draw(msg){
      const S = K.S, w = S.ring > 0 && !S.held ? Math.sin(Date.now() / 30) * 3 * S.ring : 0; let g = "";
      if(S.part === "fork"){
        g += `<rect x="200" y="160" width="130" height="50" rx="4" fill="#d0ebff" opacity=".6" stroke="#74c0fc" stroke-width="2"/><text x="265" y="225" text-anchor="middle" font-size="11" fill="var(--sub)">水槽</text>`;
        const fx = S.inWater ? 265 : 120, fy = S.inWater ? 120 : 90, inv = S.inWater ? 180 : 0;
        g += `<g data-it="fork" transform="translate(${fx} ${fy}) rotate(${inv})"><path d="M${-10 - w} -50 V10 Q0 24 ${10 + w} 10 V-50" fill="none" stroke="#868e96" stroke-width="6"/><rect x="-3" y="18" width="6" height="40" fill="#868e96"/><rect x="-26" y="-60" width="52" height="125" fill="transparent"/></g>`;
        if(S.inWater && S.ring > .05 && !S.held) for(let i = 0; i < 6; i++) g += `<circle cx="${250 + Math.random() * 30}" cy="${150 - Math.random() * 30 * S.ring}" r="${2 + Math.random() * 2}" fill="#4dabf7"/>`;
        if(S.held) g += `<text x="${fx + 14}" y="${fy}" font-size="26">✊</text>`;
        if(S.ring > .05 && !S.held && !S.inWater) g += `<text x="160" y="60" font-size="16" fill="#1c7ed6">♪ 嗡～</text>`;
        g += Object.keys(TRAY).map(k => { const [x, n] = TRAY[k]; return `<g data-it="${k}" transform="translate(${x} 160)"><rect x="-28" y="-4" width="56" height="62" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${k === "mallet" ? `<rect x="-3" y="18" width="6" height="26" fill="#a0522d"/><ellipse cx="0" cy="14" rx="12" ry="9" fill="#e8590c"/>` : `<rect x="-3" y="18" width="6" height="26" fill="#a0522d"/><rect x="-14" y="6" width="28" height="12" fill="#555"/>`}<text x="0" y="54" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">${n}</text></g>`; }).join("");
      } else {
        const n = Math.round(S.air / 4);
        g += `<path d="M110 200 V90 Q110 30 180 30 Q250 30 250 90 V200 Z" fill="#e7f5ff" opacity=".5" stroke="#74c0fc" stroke-width="2"/><rect x="90" y="200" width="180" height="10" fill="#868e96"/>
          <path d="M270 205 H320 V150" stroke="#555" stroke-width="5" fill="none"/><rect x="300" y="120" width="44" height="30" rx="4" fill="#495057"/><text x="322" y="139" text-anchor="middle" font-size="10" fill="#fff">抽氣機</text>`;
        let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
        for(let i = 0; i < n; i++) g += `<circle cx="${120 + rnd() * 120}" cy="${45 + rnd() * 150}" r="2" fill="#adb5bd"/>`;
        const sw = S.bell ? Math.sin(Date.now() / 40) * 8 : 0;
        g += `<line x1="180" y1="40" x2="180" y2="80" stroke="#555" stroke-width="2"/><path d="M160 110 Q160 80 180 80 Q200 80 200 110 Z" fill="#fab005" transform="rotate(${sw} 180 80)"/>`;
        if(S.bell) g += `<text x="${40}" y="${70}" font-size="${10 + 12 * S.air / 100}" fill="#e8590c" opacity="${.15 + .85 * S.air / 100}">🔔 叮叮叮</text>`;
        g += `<text x="20" y="220" font-size="12" fill="var(--ink)">罩內空氣：${S.air}%</text>`;
      }
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.part === "fork" ? "探索活動：拿<b>小槌</b>敲音叉（拖到音叉上），聽聽看；再把音叉<b>拖進水槽</b>，看水面；最後用手握住音叉。" : "波以耳的真空實驗：鐘罩裡的鈴鐺一直在響。用<b>抽氣機</b>把空氣抽走，聽聽鈴聲怎麼變。";
      const B = S.part === "fork" ? (S.ring > .05 && !S.held ? `<button class="btn" data-b="hold">✊ 用手握住音叉</button>` : "") + (S.held ? `<button class="btn ghost" data-b="release">放開手</button>` : "")
        : (S.bell ? "" : `<button class="btn" data-b="bell">🔔 讓鈴鐺響</button>`) + `<button class="btn" data-b="pump">⬇ 抽氣</button><button class="btn ghost" data-b="vent">⬆ 放空氣進去</button>`;
      handBtns(box.querySelector("[data-btn]"), B, act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(b === "hold"){ S.held = true; return draw(say(S.inWater ? "手一握住，音叉停止振動——水花沒了，聲音也停了。" : "手一握住，音叉停止振動，聲音也停了。", true)); }
      if(b === "release"){ S.held = false; S.ring = 0; return draw(""); }
      if(b === "bell"){ S.bell = true; return draw(""); }
      if(b === "pump"){ S.air = Math.max(0, S.air - 20); return draw(S.air === 0 ? say("鈴鐺還在擺動，卻幾乎<b>聽不到</b>聲音了！") : ""); }
      if(b === "vent"){ S.air = Math.min(100, S.air + 20); return draw(""); }

    handDnd(svg, {name: k => k === "fork" ? "音叉" : TRAY[k][1], drop: K.track((k, x, y) => {
      const S = K.S;

      const onFork = inR(x, y, S.inWater ? [235, 60, 295, 175] : [90, 30, 150, 160]);
      if(k === "hammer" && onFork) return draw(say("😬 鐵鎚敲音叉會把音叉敲壞、變形，發出的聲音也不純。音叉要用<b>小槌</b>敲。"));
      if(k === "mallet"){ if(!onFork){ toast("拖到音叉上敲"); return draw(); } S.ring = 1; S.held = false; return draw(say("噹！音叉發出「嗡～」的聲音。仔細看，音叉的兩支叉在快速振動。")); }
      if(k === "fork"){
        const inW = inR(x, y, [195, 120, 335, 215]);
        if(inW === S.inWater) return draw();
        S.inWater = inW;
        return draw(inW ? (S.ring > .05 && !S.held ? say("水面濺起水花！振動的音叉讓水也跟著振動。", true) : say("音叉沒有在振動，水面很平靜。先敲一下再放進來。")) : "");
      }
      draw();
    })});
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]");
      const k = S.part === "fork" && !S.q1 && S.held && S.inWater ? "q1" : S.part === "jar" && !S.q2 && S.air === 0 && S.bell ? "q2" : "";
      if(shown === k) return; shown = k;
      if(!k){ q.innerHTML = ""; return; }
      if(k === "q1") handMC(q, "從音叉的實驗可以知道，聲音是怎麼產生的？", [["物體振動產生聲音；振動停止，聲音也停止", 1], ["音叉碰到水才會發出聲音", 0, "還沒放進水裡，敲一下就聽得到了。"], ["要用力握住才會有聲音", 0, "握住以後聲音反而停了。"]],
        K.track(() => { S.q1 = true; S.part = "jar"; shown = null; draw(say("✅ <b>聲音是由物體振動所產生的</b>（p.76）。接下來：聲音要怎麼傳到耳朵？", true)); }));
      else handMC(q, "鈴鐺還在擺動，抽成真空後卻聽不到聲音，代表什麼？", [["聲音的傳播需要介質，真空中無法傳播", 1], ["鈴鐺壞掉了，不會振動", 0, "鈴鐺明明還在擺動。"], ["空氣越少，聲音傳得越快", 0, "空氣越少，聽到的聲音越小，最後聽不到。"]],
        K.track(() => { S.q2 = true; shown = null; draw(say("✅ 聲波要靠介質傳播：空氣、水、固體都可以（耳朵貼桌子也聽得到敲擊聲，圖 3-13），<b>真空不行</b>。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ④ 聲納：發射超聲波 → 碰海底反射 → 回到船上，碼錶計時；深度＝½ × 聲速 × 時間（海水聲速取 1500 m/s） */
  function actSonar(box, done){
    const DEP = [1200, 2250, 900, 3000, 1650];
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 230"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({round: 0, ok: 0, t: 0, run: false, back: null, ans: false}));
    const svg = box.querySelector("svg");
    const depth = () => DEP[K.S.round % DEP.length], T = () => 2 * depth() / 1500;
    const tick = setInterval(() => { if(!K.alive()) return clearInterval(tick); if(K.ctl.paused || !K.S.run) return;
      K.S.t = Math.min(T(), K.S.t + T() / 40);           // 動畫約 4 秒跑完一趟
      if(K.S.t >= T()){ K.S.run = false; K.S.back = +T().toFixed(1); beep(true); }
      draw(); }, 100);
    function draw(msg){
      const S = K.S, sy = 210 - depth() / 3000 * 150, frac = S.t / T(), py = frac <= .5 ? 60 + (sy - 60) * frac * 2 : sy - (sy - 60) * (frac - .5) * 2;
      let g = `<rect x="0" y="60" width="360" height="170" fill="#1c7ed6" opacity=".18"/><path d="M0 ${sy} Q90 ${sy - 12} 180 ${sy} T360 ${sy} V230 H0Z" fill="#a0785a"/><text x="10" y="${sy + 16}" font-size="10" fill="#fff">海底</text>
        <path d="M150 60 L210 60 L200 44 L160 44 Z" fill="#495057"/><rect x="172" y="30" width="16" height="14" fill="#868e96"/><text x="230" y="52" font-size="11" fill="var(--ink)">船上聲納</text>`;
      if(S.run || S.back) g += `<path d="M150 ${py} q30 ${frac <= .5 ? 10 : -10} 60 0" fill="none" stroke="${frac <= .5 ? "#fab005" : "#e8590c"}" stroke-width="3"/>`;
      g += `<rect x="10" y="8" width="130" height="28" rx="6" fill="var(--card)" stroke="var(--line)"/><text x="75" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">⏱ ${S.back !== null ? S.back.toFixed(1) : S.t.toFixed(1)} 秒</text>`;
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = `第 ${S.round + 1} 次測量（答對 ${S.ok}／3）：按「發射」送出超聲波，碼錶記下<b>從發出到收到回聲</b>的時間，再算海底深度。海水中聲速約 <b>1500 公尺／秒</b>。`;
      handBtns(box.querySelector("[data-btn]"), S.run || S.back !== null ? "" : `<button class="btn gold" data-b="go">📡 發射超聲波</button>`, act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    const act = K.track(b => { if(b === "go"){ K.S.run = true; K.S.t = 0; K.S.back = null; draw(""); } });
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), k = S.back !== null ? "r" + S.round : "";
      if(shown === k) return; shown = k;
      if(!k){ q.innerHTML = ""; return; }
      const d = depth(), t = S.back;
      handMC(q, `往返時間 ${t.toFixed(1)} 秒，海底深度是多少公尺？`, [[`${d} 公尺`, 1], [`${d * 2} 公尺`, 0, `${t.toFixed(1)} 秒是<b>來回</b>的時間！聲波走了「下去＋上來」兩趟，深度只是一半：½ × 1500 × ${t.toFixed(1)}。`], [`${Math.round(d / 2)} 公尺`, 0, "多除了一次 2。深度＝½ × 聲速 × 往返時間。"], [`${Math.round(1500 / t)} 公尺`, 0, "距離＝速率 × 時間，不是速率 ÷ 時間。"]],
        K.track(() => { S.ok++; S.round++; S.back = null; S.t = 0; shown = null;
          if(S.ok >= 3){ draw(say("✅ 三次都算對！<b>海底深度＝½ × 聲速 × 時間</b>（p.80）。聲納用的就是人耳聽不到的超聲波。", true)); return done(); }
          draw(say(`✅ ½ × 1500 × ${t.toFixed(1)}＝${d} 公尺。換一個海域再測一次。`, true)); }));
    }
    K.draw = draw; draw("");
  }

  /* ⑤ 直尺伸出桌緣：伸出越短，振動頻率越高、音調越高；用力撥只改變振幅（響度）；吉他弦、瓶子再確認 */
  function actPitch(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 170"></svg></div>

LABS.push({id: "st-ch4", ch: "ch34", icon: "💡", title: "第 4 章 活動站：光", page: "p.95–122",

              {t: "叫同學用力揉眼睛", why: "揉眼睛不能修復視網膜的傷害，還可能讓眼睛受傷。"},
              {t: "沒關係，等一下就好", why: "視網膜受傷可能不會馬上痛，要讓醫師檢查。"},
              {t: "再照一次看看是不是真的", why: "絕對不能再照。"}],
            lesson: "雷射筆絕對不可以對著人的眼睛照。（一般安全常識，課本沒有寫）"}, () => draw(say("回到出事前。雷射筆只能對著鏡子。")));
        }
        const dx = x - P[0], dy = P[1] - y;
        if(dy < 10 || Math.hypot(dx, dy) < 60){ toast("拖到量角盤的半圓邊緣上"); return draw(); }
        let a = Math.round(Math.atan2(-dx, dy) * 180 / Math.PI / 10) * 10; a = Math.max(-70, Math.min(70, a));
        S.ang = a; S.tried[Math.abs(a)] = 1;
        return draw(a === 0 ? say("光沿著法線射向鏡面，反射光<b>沿原路返回</b>（動腦時間）。", true) : "");
      }
      if(k === "dog2"){
        const C = 24, X0 = 30, MY = 120, [ddx, ddy] = DOG[S.dog % DOG.length], tx = X0 + ddx * C + C / 2, ty = MY - ddy * C;
        if(y > MY){ toast("放在鏡子後面（鏡子上方）"); return draw(); }
        S.put = [x, y];
        if(Math.hypot(x - tx, y - ty) > 14){ return draw(say(`😕 從鏡前看過去，鏡後的公仔和鏡中影像<b>沒有接成完整的物體</b>，位置歪掉了。數數看：鏡前公仔離鏡子 ${ddy} 格。`)); }
        S.put = [tx, ty]; S.ok++;
        if(S.ok < 2){ S.dog++; S.put = null; return draw(say("✅ 接成完整的物體了！換一個位置再試一次。", true)); }
        return draw(say("✅ 又對了！移開鏡子看看：兩隻公仔到鏡子的距離……", true));
      }
      draw();
    })});
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), k = S.part === "laser" && Object.keys(S.tried).length >= 3 && S.tried[0] ? "a" : S.part === "dog" && S.ok >= 2 && !S.fin ? "b" : "";
      if(shown === k) return; shown = k;
      if(!k){ q.innerHTML = ""; return; }
      if(k === "a") handMC(q, "從量角盤上看，入射角和反射角有什麼關係？", [["入射角等於反射角，入射光、反射光在法線兩側", 1], ["反射角永遠比入射角大", 0, "看量角盤上的讀數：兩個角一樣嗎？"], ["反射光和入射光在法線同一側", 0, "看紅線：反射光跑到法線的另一邊。"]],
        K.track(() => { S.part = "dog"; shown = null; draw(say("✅ 光的反射定律：入射角＝反射角；入射線、反射線分別在法線兩側，且三者在同一平面（p.99）。", true)); }));
      else handMC(q, "移開鏡子後，兩隻公仔和鏡子的距離有什麼關係？", [["一樣遠：物距＝像距，像和物體對稱於鏡面", 1], ["鏡後的比較遠", 0, "數方格：兩隻離鏡子都是幾格？"], ["鏡後的比較近", 0, "數方格：兩隻離鏡子都是幾格？"]],
        K.track(() => { S.fin = 1; shown = null; draw(say("✅ 平面鏡的像和物體形狀、大小相同，位置對稱於鏡面：<b>物距＝像距</b>（圖 4-15）。另一隻能接成完整物體，表示像和物體一樣大。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ③ 碗底硬幣：先移動眼睛到「剛好看不到硬幣」，眼睛不動、慢慢加水 → 又看得到硬幣（光從水進入空氣折射，視深比實深淺） */
  function actCoin(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 240"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({ey: 40, lock: false, water: 0, step: 0}));
    const svg = box.querySelector("svg"), RIM = [130, 140], BOT = 210, COIN = [205, 206], EX = 40;
    // 視線能不能看到硬幣：沒水時直線；有水時硬幣看起來在「視深」處（實深 ÷ 1.33）
    const visible = (ey, w) => {
      const sy = BOT - w, appY = w > 0 ? sy + (COIN[1] - sy) / 1.33 : COIN[1];    // 看起來的硬幣深度
      const t = (RIM[0] - EX) / (COIN[0] + 9 - EX), yAtRim = ey + (appY - ey) * t; // 從眼睛看向硬幣右緣，經過碗口時的高度
      return yAtRim <= RIM[1] ? (yAtRim < RIM[1] - 6 ? "all" : "edge") : "none";
    };
    function draw(msg){
      const S = K.S, v = visible(S.ey, S.water);
      let g = `<path d="M${RIM[0]} ${RIM[1]} Q140 ${BOT + 6} 210 ${BOT + 6} Q280 ${BOT + 6} 290 ${RIM[1]}" fill="#f3d9c4" stroke="#a9746e" stroke-width="3"/>`;
      if(S.water) g += `<path d="M${RIM[0] + 6} ${BOT - S.water} H${290 - 6} L280 ${BOT} H140 Z" fill="#a5d8ff" opacity=".7"/>`;
      g += `<ellipse cx="${COIN[0]}" cy="${COIN[1]}" rx="9" ry="3" fill="#fab005" stroke="#e67700"/>`;
      g += `<g data-it="eye"><text x="${EX}" y="${S.ey + 8}" font-size="22" text-anchor="middle">👁</text><rect x="${EX - 18}" y="${S.ey - 16}" width="36" height="32" fill="transparent"/></g>`;
      const sy = BOT - S.water, appY = S.water > 0 ? sy + (COIN[1] - sy) / 1.33 : COIN[1];
      if(v !== "none"){
        if(S.water){ const t = (sy - S.ey) / (appY - S.ey), sx = EX + (COIN[0] - EX) * t; g += `<line x1="${EX + 10}" y1="${S.ey}" x2="${sx}" y2="${sy}" stroke="#fab005" stroke-width="1.5"/><line x1="${sx}" y1="${sy}" x2="${COIN[0]}" y2="${COIN[1]}" stroke="#fab005" stroke-width="1.5"/><line x1="${sx}" y1="${sy}" x2="${COIN[0]}" y2="${appY}" stroke="#fab005" stroke-dasharray="3 3"/><ellipse cx="${COIN[0]}" cy="${appY}" rx="9" ry="3" fill="#fab005" opacity=".4"/>`; }
        else g += `<line x1="${EX + 10}" y1="${S.ey}" x2="${COIN[0]}" y2="${COIN[1]}" stroke="#fab005" stroke-width="1.5"/>`;
      } else g += `<line x1="${EX + 10}" y1="${S.ey}" x2="${RIM[0]}" y2="${RIM[1]}" stroke="#adb5bd" stroke-dasharray="4 3"/>`;
      g += `<text x="250" y="40" font-size="13" font-weight="700" fill="var(--ink)">${v === "all" ? "👀 看得到整個硬幣" : v === "edge" ? "👀 只看到硬幣邊緣" : "🙈 看不到硬幣"}</text>`;
      if(S.lock && S.step < 2) g += tray("kettle", 320, "水壺", `<path d="M-12 14 h22 v24 h-22 z M10 18 l10 -6" fill="#74c0fc" stroke="#1c7ed6"/>`, 70);
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.step === 0 ? "動腦時間：把<b>眼睛</b>上下拖動，找到<b>剛好只看到硬幣邊緣</b>的位置，再按「固定目光」。" : S.step === 1 ? "碗和目光都不動，把<b>水壺</b>拖到碗上，慢慢加水。" : "回答問題。";
      handBtns(box.querySelector("[data-btn]"), S.step === 0 ? `<button class="btn gold" data-b="lock">📌 固定目光</button>` : "", act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S;
      if(b === "lock"){
        const v = visible(S.ey, 0);
        if(v === "all") return draw(say("現在還看得到整個硬幣，這樣比不出加水前後的差別。把眼睛再往<b>下</b>移，移到剛好只看到硬幣邊緣。"));
        if(v === "none" && visible(S.ey - 8, 0) === "none") return draw(say("太低了，完全看不到，連邊緣也看不到。往上移一點，到「剛好只看到邊緣」。"));
        S.lock = true; S.step = 1; return draw(say("📌 目光固定了。接下來眼睛不能動。", true));
      }
    });
    handDnd(svg, {name: k => k === "eye" ? "眼睛" : "水壺", drop: K.track((k, x, y) => {
      const S = K.S;
      if(k === "eye"){
        if(S.lock) return draw(say("😕 課本說<b>碗和目光都不能移動</b>，移動了就比不出加水前後的差別。（要重新找位置可以按「↩ 上一步」）"));
        S.ey = Math.max(30, Math.min(150, y)); return draw("");
      }
      if(k === "kettle"){
        if(!inR(x, y, [120, 80, 300, 220])){ toast("拖到碗上倒水"); return draw(); }
        S.water = Math.min(60, S.water + 20);
        const v = visible(S.ey, S.water);
        if(v !== "none" && S.step === 1){ S.step = 2; return draw(say("😮 眼睛沒動，加了水以後竟然<b>又看得到硬幣</b>了！看虛線：硬幣看起來變淺了。")); }
        return draw(say("加了一些水……再加。"));
      }
      draw();
    })});
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), k = S.step === 2 ? "a" : S.step === 3 ? "b" : "";
      if(shown === k) return; shown = k;
      if(!k){ q.innerHTML = ""; return; }
      if(k === "a") handMC(q, "為什麼加水後又看得到硬幣？", [["硬幣的光從水進入空氣時發生折射，硬幣看起來比實際淺（視深＜實深）", 1], ["水把硬幣浮起來了", 0, "硬幣一直沉在碗底，沒有移動。"], ["水會發光，把硬幣照亮", 0, "水不會發光；是光線的路徑改變了。"]],
        K.track(() => { S.step = 3; shown = null; draw(say("✅ 光在水與空氣的交界處折射，眼睛感覺光從延長線的交點發出，所以看到的位置比較淺——這個深度叫<b>視深</b>（圖 4-29）。", true)); }));
      else handMC(q, "光由<b>水進入空氣</b>時，折射線怎麼偏？", [["偏離法線，折射角大於入射角", 1], ["偏向法線，折射角小於入射角", 0, "那是光由空氣進入水中（圖 4-28 Ⓐ）。"], ["不會偏折", 0, "只有垂直入射時方向才不變（圖 4-28 Ⓒ）。"]],
        K.track(() => { S.step = 4; shown = null; draw(say("✅ 光由水進入空氣：偏離法線、折射角＞入射角；光由空氣進入水：偏向法線、折射角＜入射角（圖 4-28）。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ④ 配眼鏡：近視（遠物成像在視網膜前）配凹透鏡；遠視（近物成像在視網膜後）配凸透鏡 */
  function actGlasses(box, done){
    const PAT = {myo: ["近視的小南", "看遠處的黑板", "front", "concave"], hyp: ["遠視的阿伯", "看近處的報紙", "back", "convex"]};
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 220"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({who: "myo", lens: null, fixed: {}, ask: null}));
    const svg = box.querySelector("svg");
    function draw(msg){
      const S = K.S, p = PAT[S.who], EYE = [250, 110], RET = 296;
      // 焦點位置：沒戴眼鏡時在視網膜前（近視）或後（遠視）；凹透鏡往後移、凸透鏡往前移
      let fx = p[2] === "front" ? 272 : 322;
      if(S.lens === "concave") fx += 24; if(S.lens === "convex") fx -= 26;
      const sharp = Math.abs(fx - RET) < 4;
      let g = `<circle cx="${EYE[0] + 20}" cy="${EYE[1]}" r="46" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><ellipse cx="${EYE[0] - 18}" cy="${EYE[1]}" rx="7" ry="22" fill="#a5d8ff" stroke="#4dabf7"/><path d="M${RET} ${EYE[1] - 40} Q${RET + 22} ${EYE[1]} ${RET} ${EYE[1] + 40}" fill="none" stroke="#c92a2a" stroke-width="3"/><text x="${RET + 6}" y="${EYE[1] + 60}" font-size="10" fill="#c92a2a">視網膜</text>`;
      const lensX = 190;
      [-20, 20].forEach(o => {
        const yIn = EYE[1] + o, src = p[2] === "front" ? [20, yIn] : [70, EYE[1]];
        let y1 = p[2] === "front" ? yIn : EYE[1] + o * .4;
        if(S.lens) g += `<line x1="${src[0]}" y1="${src[1]}" x2="${lensX}" y2="${y1}" stroke="#2f9e44" stroke-width="1.6"/>`;
        const y2 = S.lens === "concave" ? y1 + o * .25 : S.lens === "convex" ? y1 - o * .15 : y1;
        g += S.lens ? `<line x1="${lensX}" y1="${y1}" x2="${EYE[0] - 18}" y2="${y2}" stroke="#2f9e44" stroke-width="1.6"/>` : `<line x1="${src[0]}" y1="${src[1]}" x2="${EYE[0] - 18}" y2="${y1}" stroke="#2f9e44" stroke-width="1.6"/>`;
        g += `<line x1="${EYE[0] - 18}" y1="${S.lens ? y2 : y1}" x2="${fx}" y2="${EYE[1]}" stroke="#2f9e44" stroke-width="1.6"/>`;
        if(fx < RET) g += `<line x1="${fx}" y1="${EYE[1]}" x2="${RET}" y2="${EYE[1] - (S.lens ? y2 : y1 - EYE[1]) * 0 + (EYE[1] - (S.lens ? y2 : y1)) * (RET - fx) / (fx - EYE[0] + 18)}" stroke="#2f9e44" stroke-width="1" stroke-dasharray="3 3"/>`;
      });
      g += `<circle cx="${fx}" cy="${EYE[1]}" r="3" fill="#2f9e44"/>`;
      if(S.lens) g += S.lens === "concave" ? `<path d="M${lensX - 7} 60 Q${lensX} 110 ${lensX - 7} 160 H${lensX + 7} Q${lensX} 110 ${lensX + 7} 60 Z" fill="#d0ebff" stroke="#1c7ed6"/>` : S.lens === "convex" ? `<path d="M${lensX} 60 Q${lensX - 12} 110 ${lensX} 160 Q${lensX + 12} 110 ${lensX} 60 Z" fill="#d0ebff" stroke="#1c7ed6"/>` : `<rect x="${lensX - 3}" y="60" width="6" height="100" fill="#e9ecef" stroke="#adb5bd"/>`;
      else g += `<rect x="${lensX - 26}" y="50" width="52" height="120" rx="8" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/><text x="${lensX}" y="182" font-size="10" text-anchor="middle" fill="var(--sub)">放眼鏡片</text>`;
      g += `<text x="10" y="200" font-size="12" fill="var(--ink)">${p[0]}${p[1]}：${sharp ? "😊 清楚了！" : "😣 模糊"}</text>`;
      g += tray("concave", 40, "凹透鏡", `<path d="M-6 6 Q0 22 -6 38 H6 Q0 22 6 6 Z" fill="#d0ebff" stroke="#1c7ed6"/>`) + tray("convex", 100, "凸透鏡", `<path d="M0 6 Q-10 22 0 38 Q10 22 0 6 Z" fill="#d0ebff" stroke="#1c7ed6"/>`) + tray("flat", 160, "平面玻璃", `<rect x="-3" y="6" width="6" height="32" fill="#e9ecef" stroke="#adb5bd"/>`);
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = `${p[0]}${p[1]}看不清楚：綠線交會的點（成像）落在視網膜<b>${p[2] === "front" ? "前方" : "後方"}</b>。把一片鏡片拖到眼睛前面，讓成像剛好落在視網膜上。`;
      handBtns(box.querySelector("[data-btn]"), "", () => {});
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    handDnd(svg, {name: k => ({concave: "凹透鏡", convex: "凸透鏡", flat: "平面玻璃"})[k], drop: K.track((k, x, y) => {
      const S = K.S, p = PAT[S.who];
      if(!inR(x, y, [140, 40, 240, 190])){ toast("拖到眼睛前面的虛線框"); return draw(); }
      S.lens = k === "flat" ? "flat" : k;
      if(k === "flat") return draw(say("平面玻璃不會改變光線方向，成像還是在原來的地方，一樣模糊。"));
      if(k !== p[3]) return draw(say(`😵 更模糊了！成像離視網膜<b>更遠</b>，${p[0]}覺得頭暈。${k === "convex" ? "凸透鏡讓光提早會聚，成像更往前跑。" : "凹透鏡讓光發散，成像更往後跑。"}`));
      S.ask = S.who; return draw(say("😊 成像剛好落在視網膜上，看清楚了！", true));
    })});
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), k = S.ask && !S.fixed[S.ask] ? S.ask : S.fixed.myo && S.fixed.hyp && !S.fixed.old ? "old" : "";
      if(shown === k) return; shown = k;
      if(!k){ q.innerHTML = ""; return; }
      if(k === "myo") handMC(q, "近視為什麼要配<b>凹透鏡</b>？", [["凹透鏡讓光線進入眼睛前先發散，遠處物體的像才會往後落在視網膜上", 1], ["凹透鏡讓光線先會聚", 0, "會聚的是凸透鏡。"], ["凹透鏡會讓東西看起來比較大", 0, "近視眼鏡看起來會讓眼睛變小（自然暖身操）。"]],
        K.track(() => { S.fixed.myo = 1; S.who = "hyp"; S.lens = null; S.ask = null; shown = null; draw(say("✅ 近視：遠物的像落在視網膜前方 → 配適當焦距的<b>凹透鏡</b>（圖 4-43）。換下一位。", true)); }));
      if(k === "hyp") handMC(q, "遠視為什麼要配<b>凸透鏡</b>？", [["凸透鏡讓光線進入眼睛前先會聚，近處物體的像才會往前落在視網膜上", 1], ["凸透鏡讓光線先發散", 0, "發散的是凹透鏡。"], ["遠視眼睛太長", 0, "遠視是水晶體到視網膜的距離過短，或水晶體焦距過長。"]],
        K.track(() => { S.fixed.hyp = 1; S.ask = null; shown = null; draw(say("✅ 遠視：近物的像落在視網膜後方 → 配適當焦距的<b>凸透鏡</b>（圖 4-44）。", true)); }));
      if(k === "old") handMC(q, "年長的人看近物不清楚的「老花眼」，要配哪一種鏡片？", [["凸透鏡", 1], ["凹透鏡", 0, "老花眼是水晶體調節機能衰退，看近物時像落在後方，和遠視一樣要讓光先會聚。"], ["平面玻璃", 0, "平面玻璃不會改變光線方向。"]],
        K.track(() => { S.fixed.old = 1; shown = null; draw(say("✅ 老花眼是水晶體調節機能衰退，可配戴適當焦距的<b>凸透鏡</b>來矯正（p.120）。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ⑤ 三原色光：拖紅、綠、藍聚光燈照白紙，三光重疊處是白色；白光穿過藍色壓克力板變藍光 */
  function actRGB(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 240" style="background:#111;border-radius:10px"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({part: "mix", pos: {}, q1: false, plate: false}));
    const svg = box.querySelector("svg"), COL = {r: ["紅光", "#ff0000"], g: ["綠光", "#00ff00"], b: ["藍光", "#0000ff"]};
    function draw(msg){
      const S = K.S; let g = "";
      if(S.part === "mix"){
        g += `<rect x="60" y="80" width="240" height="150" rx="6" fill="#222"/><text x="180" y="226" font-size="10" text-anchor="middle" fill="#888">白紙（暗室）</text><g style="mix-blend-mode:screen;isolation:isolate">`;
        Object.entries(S.pos).forEach(([k, [x, y]]) => { g += `<circle cx="${x}" cy="${y}" r="48" fill="${COL[k][1]}" style="mix-blend-mode:screen"/>`; });
        g += `</g>`;
        Object.entries(S.pos).forEach(([k, [x, y]]) => { g += `<g data-it="${k}"><circle cx="${x}" cy="${y}" r="48" fill="transparent"/><text x="${x}" y="${y - 30}" font-size="10" text-anchor="middle" fill="#fff">${COL[k][0]}</text></g>`; });
        Object.keys(COL).forEach((k, i) => { if(!S.pos[k]) g += `<g data-it="${k}" transform="translate(${50 + i * 60} 8)"><rect x="-26" y="-4" width="52" height="60" rx="9" fill="#333" stroke="#555"/><circle cx="0" cy="22" r="13" fill="${COL[k][1]}"/><text x="0" y="50" font-size="10" text-anchor="middle" fill="#fff">${COL[k][0]}燈</text></g>`; });
      } else {
        g += `<path d="M120 40 L160 30 L170 50 L130 60Z" fill="#666"/><path d="M150 50 L210 50 L210 210 L150 210Z" fill="${S.plate ? "none" : "#fff"}" opacity=".25"/>`;
        if(S.plate) g += `<path d="M150 50 L210 50 L210 130 L150 130Z" fill="#fff" opacity=".25"/><rect x="130" y="128" width="100" height="10" fill="#1c3fd6" opacity=".85"/><path d="M150 138 L210 138 L210 210 L150 210Z" fill="#4d6bff" opacity=".45"/>`;
        g += `<rect x="80" y="210" width="200" height="12" fill="#444"/><ellipse cx="180" cy="214" rx="34" ry="5" fill="${S.plate ? "#4d6bff" : "#fff"}" opacity=".85"/><text x="250" y="40" font-size="11" fill="#ccc">檯燈（白光）</text>`;
        if(!S.plate) g += `<g data-it="plate" transform="translate(300 100)"><rect x="-30" y="-6" width="60" height="56" rx="9" fill="#333" stroke="#555"/><rect x="-22" y="12" width="44" height="10" fill="#1c3fd6"/><text x="0" y="44" font-size="9" text-anchor="middle" fill="#fff">藍色壓克力板</text></g>`;
      }
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.part === "mix" ? "把<b>紅、綠、藍</b>三盞燈拖到白紙上，讓三個光圈重疊。三盞燈的亮度相同。" : "檯燈的白光照在桌上。把<b>藍色壓克力板</b>拖到光的路徑中間（圖 4-48）。";
      handBtns(box.querySelector("[data-btn]"), "", () => {});
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    const overlap3 = () => { const P = Object.values(K.S.pos); if(P.length < 3) return false; return P.every(a => P.every(b => Math.hypot(a[0] - b[0], a[1] - b[1]) < 70)); };
    handDnd(svg, {name: k => k === "plate" ? "藍色壓克力板" : COL[k][0] + "燈", drop: K.track((k, x, y) => {
      const S = K.S;
      if(k === "plate"){ if(!inR(x, y, [120, 60, 240, 200])){ toast("放到檯燈和桌面中間的光路上"); return draw(); } S.plate = true; return draw(say("白光穿過藍色壓克力板以後，桌上的光變成<b>藍色</b>了。")); }
      if(!inR(x, y, [60, 80, 300, 230])){ toast("拖到白紙上"); return draw(); }
      S.pos[k] = [Math.max(108, Math.min(252, x)), Math.max(110, Math.min(200, y))];
      const n = Object.keys(S.pos).length;
      return draw(overlap3() ? say("三個光圈重疊的地方變成<b>白色</b>！", true) : n >= 2 ? say("兩種色光重疊的地方出現了別的顏色（對照圖 4-46）。把第三盞也疊上去。") : "");
    })});
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), k = S.part === "mix" && overlap3() ? "a" : S.part === "plate" && S.plate && !S.fin ? "b" : "";
      if(shown === k) return; shown = k;
      if(!k){ q.innerHTML = ""; return; }
      if(k === "a") handMC(q, "相同亮度的紅、綠、藍光同時照在白紙上，三光重疊處是什麼顏色？", [["白色——紅、綠、藍稱為三原色光", 1], ["黑色", 0, "光越疊越亮，看看中間。"], ["紫色", 0, "看中間三個光圈都重疊的地方。"]],
        K.track(() => { S.part = "plate"; shown = null; draw(say("✅ 紅、綠、藍稱為<b>三原色光</b>；電腦螢幕的白色畫面，放大看就是紅綠藍小光格（圖 4-47）。", true)); }));
      else handMC(q, "為什麼白光穿過藍色壓克力板會變成藍光？", [["藍色壓克力板讓藍光通過，吸收其他大部分色光", 1], ["壓克力板把白光染成藍色", 0, "壓克力板不會「加上」顏色，只會讓某些色光通過。"], ["藍色壓克力板會發出藍光", 0, "拿掉檯燈，壓克力板自己不會發光。"]],
        K.track(() => { S.fin = 1; shown = null; draw(say("✅ 透明有色物體只讓和自己顏色相近的色光穿透，其餘色光被吸收（p.122）。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }
  /* 關卡函式和共用小工具都宣告完才開站（const 在宣告前不能用） */
  handStation(pane, L, [
    {key: "pinhole", title: "針孔成像", page: "p.95–97", run: actPinhole},
    {key: "mirror", title: "反射定律與平面鏡成像", page: "p.99–101", run: actMirror},
    {key: "coin", title: "折射與視深：碗底硬幣", page: "p.106–108", run: actCoin},
    {key: "glasses", title: "幫眼睛配眼鏡", page: "p.120", run: actGlasses},
    {key: "rgb", title: "三原色光與色光穿透", page: "p.122", run: actRGB}]);
}});

/* ═════ 第 5 章 活動站：溫度與熱（正式實驗 5-1、5-2 以外的課本圖示操作與探索活動） ═════
   ① 氣球熱脹冷縮（p.146、圖 5-13）② 冰加熱曲線（p.148、圖 5-16）③ 硫酸銅加熱與加水（p.151、圖 5-22）
   ④ 傳導與對流（p.152–154、圖 5-23、探索活動圖 5-26／5-27）⑤ 輻射與保溫瓶（p.156–157、圖 5-31、5-34）
   出錯：徒手從熱水拿燒杯、試管直接用手拿著加熱（燙傷）、用橡皮塞塞緊錐形瓶加熱（爆裂）、燒杯不墊陶瓷纖維網直接加熱（破裂）
   ——燙傷與塞緊加熱是一般安全常識，課本沒有寫；陶瓷纖維網見緒論 */
LABS.push({id: "st-ch5", ch: "ch5", icon: "🔥", title: "第 5 章 活動站：溫度與熱", page: "p.146–157",
  desc: "氣球放冰水熱水、加熱冰塊畫曲線、硫酸銅變色、奶油與胡椒粒看傳導對流、黑布白布晒太陽。", run(pane, L){

  const tray = (k, x, n, ic, y) => `<g data-it="${k}" transform="translate(${x} ${y || 8})"><rect x="-28" y="-4" width="56" height="64" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${ic}<text x="0" y="54" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">${n}</text></g>`;
  const lamp = (x, by, on) => `<ellipse cx="${x}" cy="${by - 8}" rx="17" ry="8" fill="#cfe8ff" stroke="#888"/><rect x="${x - 4}" y="${by - 30}" width="8" height="16" fill="#eee" stroke="#888"/>` + (on ? flameP(x, by - 30, 32, 9, "#4dabf7", "#ffd43b") : "");
  const burnAcc = (K, cause, lesson, back) => handAccident(K.card, {pic: BURN_SVG, title: "😣 好燙！手被燙紅了", cause,
    q: "手被燙到了，第一步要怎麼做？", opts: [
      {t: "立刻用流動的冷水沖燙到的地方，並報告老師", ok: true, why: "「沖」是第一步：沖冷水能帶走熱量、減輕傷害（沖、脫、泡、蓋、送）。"},
      {t: "塗牙膏或醬油", why: "牙膏、醬油不能降溫，還可能讓傷口感染。"},
      {t: "把水泡戳破", why: "水泡能保護傷口，戳破容易感染。"},
      {t: "忍一下，繼續做", why: "燙傷要先處理，越早降溫越好。"}],
    lesson}, back);

  /* ① 燒杯口套氣球，拖進冰水或熱水；熱水裡的燒杯要用燒杯夾拿出來 */
  function actBalloon(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 240"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({ball: false, loc: "table", v: 0, seen: {}, step: 0}));
    const svg = box.querySelector("svg"), POS = {table: [70, 225], ice: [180, 225], hot: [290, 225]};
    const target = () => K.S.loc === "ice" ? -1 : K.S.loc === "hot" ? 1 : 0;
    const tick = setInterval(() => { if(!K.alive()) return clearInterval(tick); if(K.ctl.paused) return;
      const S = K.S, d = target() - S.v; if(Math.abs(d) < .01) return; S.v += d * .15;
      if(Math.abs(target() - S.v) < .08 && S.loc !== "table") S.seen[S.loc] = 1;
      if(!K.dragging) draw(); }, 80);
    function draw(msg){
      const S = K.S; let g = `<rect x="0" y="225" width="360" height="15" fill="#c8a67a" opacity=".5"/>`;
      g += `<rect x="140" y="160" width="80" height="65" fill="#d0ebff" opacity=".6" stroke="#74c0fc" stroke-width="2"/><rect x="146" y="168" width="12" height="12" fill="#fff" stroke="#a5d8ff"/><rect x="196" y="174" width="12" height="12" fill="#fff" stroke="#a5d8ff"/><text x="180" y="155" text-anchor="middle" font-size="11" fill="var(--sub)">冰水</text>
        <rect x="250" y="160" width="80" height="65" fill="#ffc9c9" opacity=".6" stroke="#ff8787" stroke-width="2"/><text x="290" y="155" text-anchor="middle" font-size="11" fill="var(--sub)">熱水</text><path d="M275 150 q4 -8 0 -16 M300 150 q4 -8 0 -16" stroke="#ff8787" fill="none"/>`;
      const [bx, by] = POS[S.loc], r = 14 + 10 * S.v;
      let bk = `<rect x="${bx - 20}" y="${by - 52}" width="40" height="52" fill="#e7f5ff" opacity=".7" stroke="#5c7cfa" stroke-width="2"/>`;
      if(S.ball) bk += S.v < -.3 ? `<path d="M${bx - 14} ${by - 52} Q${bx} ${by - 40 + 12 * S.v} ${bx + 14} ${by - 52}" fill="#e64980" stroke="#c2255c"/>` : `<ellipse cx="${bx}" cy="${by - 52 - Math.max(4, r * .8)}" rx="${Math.max(10, r)}" ry="${Math.max(5, r * .9)}" fill="#e64980" opacity=".9"/>`;
      g += `<g data-it="beaker">${bk}<rect x="${bx - 28}" y="${by - 90}" width="56" height="92" fill="transparent"/></g>`;
      if(!S.ball) g += tray("balloon", 40, "氣球", `<ellipse cx="0" cy="20" rx="10" ry="13" fill="#e64980"/>`);
      if(S.loc === "hot") g += tray("tongs", 320, "燒杯夾", `<path d="M-10 8 L0 40 L10 8" fill="none" stroke="#555" stroke-width="3"/>`);
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.ball ? "把套著氣球的燒杯拖進<b>冰水</b>或<b>熱水</b>，看氣球怎麼變。兩種都要試。（熱水裡的燒杯很燙）" : "圖 5-13：先把<b>氣球</b>套在燒杯口。";
      handBtns(box.querySelector("[data-btn]"), "", () => {});
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    handDnd(svg, {name: k => ({balloon: "氣球", beaker: "燒杯", tongs: "燒杯夾"})[k], drop: K.track((k, x, y) => {
      const S = K.S, [bx, by] = POS[S.loc];
      if(k === "balloon"){ if(!inR(x, y, [bx - 40, by - 100, bx + 40, by + 5])){ toast("套在燒杯口"); return draw(); } S.ball = true; return draw(""); }
      if(k === "tongs"){
        if(!inR(x, y, [bx - 40, by - 100, bx + 40, by + 5])){ toast("用燒杯夾夾住熱水裡的燒杯"); return draw(); }
        S.loc = "table"; return draw(say("✅ 用燒杯夾把燒杯拿出熱水。", true));
      }
      if(k === "beaker"){
        if(!S.ball){ toast("先套氣球"); return draw(); }
        const to = inR(x, y, [130, 120, 230, 240]) ? "ice" : inR(x, y, [240, 120, 340, 240]) ? "hot" : inR(x, y, [10, 120, 125, 240]) ? "table" : null;
        if(!to || to === S.loc) return draw();
        if(S.loc === "hot"){ draw(""); return burnAcc(K, "燒杯泡在熱水裡變得很燙，直接用手抓出來，手被燙傷了。", "熱水裡的容器要用<b>燒杯夾</b>或隔熱手套拿。（一般安全常識，課本沒有寫）", () => draw(say("回到出事前。用燒杯夾拿。"))); }
        S.loc = to; return draw("");
      }
      draw();
    })});
    let shown = "";
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), k = S.step === 0 && S.seen.ice && S.seen.hot ? "a" : S.step === 1 ? "b" : "";
      if(shown === k) return; shown = k;
      if(!k){ q.innerHTML = ""; return; }
      if(k === "a") handMC(q, "燒杯裡的空氣放進熱水，氣球鼓起來；放進冰水，氣球凹下去。這代表什麼？", [["空氣受熱體積膨脹、遇冷體積收縮", 1], ["熱水把水蒸氣灌進氣球", 0, "燒杯口被氣球套住，熱水進不去；變的是裡面空氣的體積。"], ["冰水把氣球吸進去", 0, "是燒杯裡的空氣遇冷收縮，氣球才凹下去。"]],
        K.track(() => { S.step = 1; shown = null; draw(say("✅ 大部分物質受熱膨脹、冷卻收縮；<b>體積隨溫度改變的情形，以氣體最明顯，液體次之，固體最不明顯</b>（p.146）。", true)); }));
      else handMC(q, "自然暖身操：果醬罐的金屬蓋子轉不開，泡一下熱水就轉開了，為什麼？", [["金屬瓶蓋受熱膨脹得比玻璃罐口大，縫隙變大", 1], ["熱水把果醬融化了", 0, "只泡到蓋子，裡面的果醬沒有變化。"], ["蓋子受熱變軟", 0, "金屬不會因為熱水就變軟；是體積變大了。"]],
        K.track(() => { S.step = 2; shown = null; draw(say("✅ 不同物質脹縮程度不同：金屬瓶蓋膨脹得比玻璃罐口大，縫隙變大就好轉開（p.146、p.151 解答）。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ② −20 ℃ 的冰在錐形瓶裡加熱（瓶口套氣球）：A 冰升溫 → B 冰水共存 0 ℃ → C 水升溫 → D 水與水蒸氣共存 100 ℃ → E 水蒸氣 */
  function actIce(box, done){
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 250"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`,
      () => ({cap: null, heat: false, q: 0, pts: [[0, -20]], ask: null, asked: {}}));
    const svg = box.querySelector("svg");
    // 熱量 E（每 0.1 秒 +1）→ 溫度：A −20→0 用 10、B 熔化 40、C 0→100 用 50、D 汽化 60、E 之後
    const stage = E => E < 10 ? ["A", -20 + E * 2] : E < 50 ? ["B", 0] : E < 100 ? ["C", (E - 50) * 2] : E < 160 ? ["D", 100] : ["E", Math.min(130, 100 + (E - 160) * 2)];
    const tick = setInterval(() => { if(!K.alive()) return clearInterval(tick); const S = K.S; if(K.ctl.paused || !S.heat || S.ask) return;
      S.q += 1; const [st, T] = stage(S.q); S.pts.push([S.q, T]);
      if(S.cap === "stopper" && S.q > 120){ S.heat = false; draw(""); return handAccident(K.card, {pic: BREAK_SVG, title: "💥 錐形瓶爆開了！", cause: "瓶口用橡皮塞塞緊，水沸騰變成水蒸氣，瓶內氣體越來越多卻跑不出去，橡皮塞彈飛、錐形瓶破裂，熱水和碎玻璃噴出來。",
        q: "熱水和碎玻璃噴到桌上，要怎麼做？", opts: [
          {t: "先熄滅酒精燈、遠離桌面，報告老師；被燙到就沖冷水", ok: true, why: "先移除熱源、離開危險區；燙傷先沖冷水，碎玻璃由老師用工具清理。"},
          {t: "馬上用手把碎玻璃撿起來", why: "碎玻璃又燙又利，會割傷、燙傷。"},
          {t: "繼續加熱看會怎樣", why: "要立刻熄火。"},
          {t: "用嘴吹熄酒精燈", why: "酒精燈要用燈罩蓋熄。"}],
        lesson: "加熱時容器不可以完全密閉：課本用<b>氣球</b>套在瓶口，水蒸氣產生時氣球會鼓起來。（密閉加熱會爆裂是一般安全常識，課本沒有寫）"}, () => { K.S.cap = null; K.S.q = 0; K.S.pts = [[0, -20]]; draw(say("回到出事前。瓶口改套氣球。")); }); }
      if(st === "B" && !S.asked.B && S.q > 30){ S.ask = "B"; }
      if(st === "D" && !S.asked.D && S.q > 130){ S.ask = "D"; }
      if(st === "E" && S.q > 175 && !S.asked.E){ S.heat = false; S.ask = "E"; }
      if(!K.dragging) draw(); }, 100);
    function draw(msg){
      const S = K.S, [st, T] = stage(S.q);
      let g = `<rect x="0" y="235" width="360" height="15" fill="#c8a67a" opacity=".5"/>`;
      // 錐形瓶＋三腳架＋酒精燈
      const fill = st === "A" ? "#e7f5ff" : st === "B" ? "#d0ebff" : "#a5d8ff";
      g += `<path d="M30 172 L34 235 M110 172 L106 235" stroke="#666" stroke-width="3"/><rect x="26" y="168" width="88" height="5" fill="#ddd" stroke="#999"/>
        <path d="M48 168 L92 168 L78 120 L78 100 L62 100 L62 120 Z" fill="${st === "E" ? "#f1f3f5" : fill}" stroke="#5c7cfa" stroke-width="2"/>`;
      if(st === "A" || st === "B") g += `<rect x="54" y="148" width="14" height="14" fill="#fff" stroke="#a5d8ff"/><rect x="72" y="150" width="12" height="12" fill="#fff" stroke="#a5d8ff"/>` + (st === "B" ? "" : `<rect x="62" y="134" width="12" height="12" fill="#fff" stroke="#a5d8ff"/>`);
      if(st === "D") g += `<circle cx="66" cy="160" r="3" fill="#fff"/><circle cx="76" cy="150" r="2.5" fill="#fff"/><circle cx="60" cy="145" r="2" fill="#fff"/>`;
      if(S.cap === "balloon"){ const r = st === "D" ? 10 + (S.q - 100) / 6 : st === "E" ? 22 : 6; g += `<ellipse cx="70" cy="${100 - r}" rx="${Math.max(8, r)}" ry="${r}" fill="#40c057" opacity=".85"/>`; }
      if(S.cap === "stopper") g += `<rect x="61" y="92" width="18" height="10" rx="2" fill="#e8913a"/>`;
      g += lamp(70, 235, S.heat);
      g += `<text x="70" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${T.toFixed(0)} ℃</text>`;
      // 溫度—時間圖
      const X = q => 150 + q / 200 * 195, Y = T2 => 215 - (T2 + 20) / 150 * 190;

  /* ⑤ 輻射：溫度計包黑布、白布晒太陽（38 ℃ vs 32 ℃）；保溫瓶三個部位各擋哪一種熱傳播 */
  function actRad(box, done){

    const PART = {cap: ["塑膠瓶蓋", 180, 52], vac: ["真空夾層", 228, 150], mir: ["光滑鏡面", 202, 190]};

/* ═════ 第 6 章 活動站：探索物質組成（正式實驗 6-1 以外的課本動手活動） ═════
   ① 鈉、鉀、鐵和水的反應（p.172–173 示範實驗、圖 6-11、知識快遞：礦物油保存）
   ② 排週期表（p.174–176：依質量排出每隔 7 種重複、圖 6-12；第 1 族鹼金屬／第 2 族鹼土金屬／第 18 族鈍氣）
   ③ 組原子（p.180–183：質子、中子、電子；質量數＝質子數＋中子數、原子序＝質子數；⁹₄Be、²³₁₁Na）

LABS.push({id: "st-ch6", ch: "ch6", icon: "⚛️", title: "第 6 章 活動站：探索物質組成", page: "p.172–188",

    })});

    function quiz(){

  /* ② 依質量把 Li～Cl 排進 Do～Si 七格兩列，看出每隔 7 種重複；再把元素歸到三族 */
  function actTable(box, done){
    const EL = [["Li", "鋰", 6.9], ["Be", "鈹", 9.0], ["B", "硼", 10.8], ["C", "碳", 12.0], ["N", "氮", 14.0], ["O", "氧", 16.0], ["F", "氟", 19.0],

    const GR = {Li: 1, Na: 1, K: 1, Be: 2, Mg: 2, Ca: 2, He: 18, Ne: 18, Ar: 18}, GN = {1: "第 1 族 鹼金屬", 2: "第 2 族 鹼土金屬", 18: "第 18 族 鈍氣"}, CN = {Li: "鋰", Na: "鈉", K: "鉀", Be: "鈹", Mg: "鎂", Ca: "鈣", He: "氦", Ne: "氖", Ar: "氬"};
    const ORD = [3, 11, 0, 8, 13, 5, 1, 9, 6, 2, 12, 4, 10, 7];   // 托盤裡的打亂順序

    const svg = box.querySelector("svg");
    function draw(msg){
      const S = K.S; let g = "";
      if(S.part === 1){
        ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"].forEach((m, i) => { g += `<text x="${42 + i * 46}" y="16" text-anchor="middle" font-size="10" fill="var(--sub)">${m}</text>`; });
        for(let i = 0; i < 14; i++){ const x = 42 + (i % 7) * 46, y = 42 + Math.floor(i / 7) * 48;
          g += i < S.n ? card(x, y, EL[i][0], EL[i][1] + " " + EL[i][2], "p" + i, i % 7 === 0 ? "#fff3bf" : i % 7 === 6 ? "#e7f5ff" : "") : `<rect x="${x - 22}" y="${y - 20}" width="44" height="40" rx="7" fill="none" stroke="var(--line)" stroke-dasharray="4 3"/>`; }
        ORD.filter(i => i >= S.n).forEach((i, j) => { g += card(32 + (j % 7) * 49, 170 + Math.floor(j / 7) * 52, EL[i][0], `${EL[i][1]} ${EL[i][2]}`, "e" + i); });
        g += `<text x="10" y="290" font-size="10" fill="var(--sub)">卡片下方的數字＝原子量（質量）</text>`;
      } else {

          Object.keys(S.grp).filter(e => S.grp[e] === n).forEach((e, j) => { g += card(x, 58 + j * 44, e, CN[e], "g" + e); }); });
        Object.keys(GR).filter(e => !S.grp[e]).forEach((e, j) => { g += card(32 + j * 37 + (j % 2) * 0, 220 + (j % 2) * 44, e, CN[e], e); });
      }
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.part === 1 ? "像早期科學家一樣：把元素卡<b>依質量由小到大</b>排進格子（第一列排滿 7 格再排第二列）。拖曳或點一張卡再點格子。" : "現代週期表：把元素卡拖進正確的<b>族</b>。";

    let shown = null;

      const S = K.S, q = box.querySelector("[data-q]");

      if(shown === key) return; shown = key;

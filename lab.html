      if(key === "p") handMC(q, "鋰和鈉、氟和氯排在同一行。這代表？", [["依質量排列時，每隔 7 種元素就出現性質相似的元素，像音階一樣", 1], ["質量相同的元素排在一起", 0, "鋰 6.9、鈉 23.0，質量差很多。"], ["同一橫列的元素性質最像", 0, "性質相似的是上下對齊（同一行）的元素。"]],
        K.track(() => { S.part = 2; shown = null; draw(say("✅ 元素的週期性（圖 6-12）。門得列夫在 1869 年發表主要依質量排列的週期表，還預測了四種未知元素。現代週期表改依<b>原子序</b>排列：橫列叫<b>週期</b>（7 個），縱行叫<b>族</b>（1～18 族），同族化學性質相似。", true)); }));
      if(key === "g") handMC(q, "例題 6-1：下列哪一句正確？", [["鈉、鉀是同一族元素，都易與水反應，有相似的化學性質", 1], ["週期表中的橫列稱為「族」，縱行稱為「週期」", 0, "反了：橫列是週期，縱行是族。"], ["同週期的元素，化學性質相似", 0, "化學性質相似的是<b>同族</b>（同一縱行）。"]],
        K.track(() => { S.q = 1; shown = null; draw(say("✅ 氦、氖化學性質安定，同屬第 18 族，又稱<b>鈍氣</b>；氦氣密度小可填充氣球，氖氣通電發紅光做霓虹燈（p.176）。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ③ 依符號組原子：質子、中子放進原子核，電子放在外圍；再由模型讀出符號 */
  function actAtom(box, done){
    const T = [{s: "Be", n: "鈹", Z: 4, A: 9}, {s: "Na", n: "鈉", Z: 11, A: 23}];
    const NAME = {1: "氫", 2: "氦", 3: "鋰", 4: "鈹", 5: "硼", 6: "碳", 7: "氮", 8: "氧", 9: "氟", 10: "氖", 11: "鈉", 12: "鎂"};
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 260"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`, () => ({r: 0, p: 0, n: 0, e: 0, ok: [], q: 0}));
    const svg = box.querySelector("svg");
    function draw(msg){
      const S = K.S, t = T[Math.min(S.r, 1)]; let g = "";
      g += `<circle cx="180" cy="140" r="88" fill="#e7f5ff" opacity=".6" stroke="#74c0fc" stroke-dasharray="5 4"/><circle cx="180" cy="140" r="30" fill="#fff3bf" stroke="#e8b923"/><text x="180" y="248" text-anchor="middle" font-size="10" fill="var(--sub)">外圍：電子　　中心：原子核</text>`;
      const ty = []; for(let a = S.p, b = S.n; a || b;){ if(a){ ty.push(1); a--; } if(b){ ty.push(0); b--; } }   // 質子、中子交錯排
      const pts = ty.map((isP, i) => { const a = i * 2.4, r = 5 + 3.2 * Math.sqrt(i); return [180 + r * Math.cos(a), 140 + r * Math.sin(a), isP]; });
      pts.forEach(([x, y, isP]) => { g += `<circle cx="${x}" cy="${y}" r="5" fill="${isP ? "#e03131" : "#868e96"}" stroke="#fff"/>${isP ? `<text x="${x}" y="${y + 3}" font-size="7" text-anchor="middle" fill="#fff">+</text>` : ""}`; });
      for(let i = 0; i < S.e; i++){ const a = i / Math.max(1, S.e) * 6.283; g += `<circle cx="${180 + 70 * Math.cos(a)}" cy="${140 + 70 * Math.sin(a)}" r="4" fill="#1c7ed6"/><text x="${180 + 70 * Math.cos(a)}" y="${143 + 70 * Math.sin(a)}" font-size="7" text-anchor="middle" fill="#fff">−</text>`; }
      if(S.r < 2) g += [["p", "質子 +", "#e03131"], ["n", "中子", "#868e96"], ["e", "電子 −", "#1c7ed6"]].map(([k, nm, c], i) => `<g data-it="${k}" transform="translate(${36} ${40 + i * 70})"><rect x="-28" y="-24" width="56" height="56" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><circle cx="0" cy="-4" r="9" fill="${c}"/><text x="0" y="24" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="700">${nm}</text></g>`).join("");
      g += `<text x="300" y="40" text-anchor="middle" font-size="12" fill="var(--ink)">質子 ${S.p}</text><text x="300" y="60" text-anchor="middle" font-size="12" fill="var(--ink)">中子 ${S.n}</text><text x="300" y="80" text-anchor="middle" font-size="12" fill="var(--ink)">電子 ${S.e}</text>`;
      if(S.r < 2) g += `<text x="300" y="120" text-anchor="middle" font-size="11" fill="var(--sub)">目標</text><text x="300" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)"><tspan font-size="13" dy="-12">${t.A}</tspan><tspan font-size="13" dx="-14" dy="26">${t.Z}</tspan><tspan dy="-14">${t.s}</tspan></text>`;
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.r < 2 ? `組出 <b>${t.n}原子</b>：左上角＝質量數（質子數＋中子數），左下角＝原子序（＝質子數）。把粒子拖到正確位置，組好按「檢查」。` : "最後一題。";
      handBtns(box.querySelector("[data-btn]"), S.r < 2 ? `<button class="btn gold" data-b="chk">✅ 檢查</button><button class="btn ghost" data-b="mp">− 質子</button><button class="btn ghost" data-b="mn">− 中子</button><button class="btn ghost" data-b="me">− 電子</button>` : "", act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S, t = T[S.r];
      if(b === "mp" || b === "mn" || b === "me"){ const k = b[1]; S[k] = Math.max(0, S[k] - 1); return draw(""); }
      if(b === "chk"){
        if(S.p !== t.Z) return draw(say(S.p && NAME[S.p] ? `質子有 ${S.p} 個——這是<b>${NAME[S.p]}</b>，不是${t.n}！原子序（左下角 ${t.Z}）＝質子數，質子數決定是哪一種元素。` : `質子數要等於原子序（左下角的 ${t.Z}）。`));
        if(S.p + S.n !== t.A) return draw(say(`質子＋中子＝${S.p + S.n}，但質量數（左上角）是 ${t.A}。中子應該有 ${t.A} − ${t.Z}＝? 個。`));
        if(S.e !== S.p) return draw(say(`電子 ${S.e} 個、質子 ${S.p} 個。原子要保持<b>電中性</b>：質子數＝電子數。`));
        S.r++; S.p = S.n = S.e = 0;
        return draw(say(S.r === 1 ? `✅ ⁹₄Be：質子 4、中子 5、電子 4。換組鈉。` : `✅ ²³₁₁Na：質子 11、中子 12、電子 11（例題 6-2）。`, true));
      }
    });
    handDnd(svg, {name: k => ({p: "質子", n: "中子", e: "電子"})[k], drop: K.track((k, x, y) => {
      const S = K.S, d = Math.hypot(x - 180, y - 140);
      if(d <= 36){ if(k === "e") return draw(say("電子不在原子核裡，它在原子核外圍運動。")); if(S.p + S.n >= 30){ toast("夠多了"); return draw(); } S[k]++; return draw(""); }
      if(d <= 95){ if(k !== "e") return draw(say(`${k === "p" ? "質子" : "中子"}在<b>原子核</b>裡（中間黃色的圓）。`)); if(S.e >= 15){ toast("夠多了"); return draw(); } S.e++; return draw(""); }
      draw();
    })});
    let shown = null;
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), key = S.r >= 2 && S.q === 0 ? "m" : "";
      if(shown === key) return; shown = key;
      if(!key){ q.innerHTML = ""; return; }
      handMC(q, "為什麼質量數只算質子和中子，不算電子？", [["電子很輕；質子、中子的質量差不多，大約是電子的 1836 倍，原子的質量幾乎集中在原子核", 1], ["電子不帶電", 0, "電子帶負電；不帶電的是中子。"], ["電子在原子外面，不屬於原子", 0, "電子也是原子的一部分。"]],
        K.track(() => { S.q = 1; shown = null; draw(say("✅ 原子的質量≒原子核的質量（圖 6-18）。發現順序：湯姆森發現電子 → 拉塞福發現原子核與質子 → 查兌克發現中子（p.180–181）。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }

  /* ④ 拖原子球組分子 → 選化學式；原則：右下角寫原子數、1 省略；含氧化合物氧寫後面 */
  function actMol(box, done){
    const G = [{n: "氫氣", c: {H: 2}, f: "H₂", bad: [["2H", "2H 是 2 個氫<b>原子</b>（分開的）；氫分子是 2 個氫原子連在一起，數字寫在<b>右下角</b>：H₂。"], ["H", "氫氣是由 2 個氫原子組成的分子，要標原子數。"]]},
      {n: "水", c: {H: 2, O: 1}, f: "H₂O", bad: [["HO₂", "數字跟在誰的右下角，就是誰的個數：HO₂ 變成 1 個氫、2 個氧了。"], ["H₂O₁", "原子數目為 1 時可以省略不寫。"]]},
      {n: "二氧化碳", c: {C: 1, O: 2}, f: "CO₂", bad: [["O₂C", "含有氧的化合物，一般將氧原子寫在後面（原則 4）。"], ["C₂O", "二氧化碳是 1 個碳、2 個氧。"]]},
      {n: "臭氧", c: {O: 3}, f: "O₃", bad: [["3O", "3O 是 3 個分開的氧原子；臭氧是 3 個氧原子組成的一個分子：O₃。"], ["O₂", "O₂ 是氧氣，臭氧有 3 個氧原子。"]]}];
    const AC = {H: ["#fff", "#adb5bd"], O: ["#e03131", "#c92a2a"], C: ["#343a40", "#000"]};
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 230"></svg></div>
      <div class="row" data-btn style="margin-top:8px"></div><div data-q></div><div data-fb></div>`, () => ({g: 0, have: {}, built: false, q: 0}));
    const svg = box.querySelector("svg");
    function draw(msg){
      const S = K.S, t = G[Math.min(S.g, G.length - 1)]; let g = `<rect x="110" y="60" width="200" height="140" rx="14" fill="#f8f9fa" stroke="var(--line)" stroke-dasharray="6 4"/><text x="210" y="216" text-anchor="middle" font-size="10" fill="var(--sub)">分子盤</text>`;
      let i = 0; Object.entries(S.have).forEach(([a, n]) => { for(let j = 0; j < n; j++, i++) g += `<circle cx="${170 + i * 26}" cy="130" r="${a === "H" ? 11 : 15}" fill="${AC[a][0]}" stroke="${AC[a][1]}" stroke-width="2"/><text x="${170 + i * 26}" y="134" text-anchor="middle" font-size="10" fill="${a === "H" ? "#333" : "#fff"}">${a}</text>`; });
      if(S.g < G.length) g += ["H", "O", "C"].map((a, k) => `<g data-it="${a}" transform="translate(40 ${40 + k * 62})"><rect x="-28" y="-24" width="56" height="56" rx="9" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><circle cx="0" cy="-2" r="${a === "H" ? 10 : 14}" fill="${AC[a][0]}" stroke="${AC[a][1]}" stroke-width="2"/><text x="0" y="2" text-anchor="middle" font-size="10" fill="${a === "H" ? "#333" : "#fff"}">${a}</text><text x="0" y="26" font-size="9" text-anchor="middle" fill="var(--ink)" font-weight="700">${{H: "氫原子", O: "氧原子", C: "碳原子"}[a]}</text></g>`).join("");
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = S.g < G.length ? `第 ${S.g + 1}／${G.length} 個：用原子球組出一個<b>${t.n}分子</b>，組好按「組好了」。` : "最後一題：化學式書寫原則 3。";
      handBtns(box.querySelector("[data-btn]"), S.g < G.length && !S.built ? `<button class="btn gold" data-b="ok">✅ 組好了</button><button class="btn ghost" data-b="clr">清空分子盤</button>` : "", act);
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    const act = K.track(b => {
      const S = K.S, t = G[S.g];
      if(b === "clr"){ S.have = {}; return draw(""); }
      if(b === "ok"){
        const want = t.c, ok = ["H", "O", "C"].every(a => (S.have[a] || 0) === (want[a] || 0));
        if(!ok) return draw(say(`不對喔。一個${t.n}分子裡有：${Object.entries(want).map(([a, n]) => `${n} 個${{H: "氫", O: "氧", C: "碳"}[a]}原子`).join("、")}。（圖 6-21）`));
        S.built = true; return draw("");
      }
    });
    handDnd(svg, {name: k => k, drop: K.track((k, x, y) => {
      const S = K.S;
      if(S.built || !inR(x, y, [105, 55, 315, 205])) return draw();
      if(Object.values(S.have).reduce((a, b) => a + b, 0) >= 5){ toast("分子盤滿了"); return draw(); }
      S.have[k] = (S.have[k] || 0) + 1; return draw("");
    })});
    let shown = null;
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), key = S.built ? "f" + S.g : S.g >= G.length && S.q === 0 ? "nacl" : "";
      if(shown === key) return; shown = key;
      if(!key){ q.innerHTML = ""; return; }
      if(key === "nacl") return handMC(q, "食鹽晶體由鈉與氯以 1：1 組成。化學式和中文名稱怎麼寫？", [["NaCl，讀作「氯化鈉」", 1], ["ClNa，讀作「鈉化氯」", 0, "金屬元素符號寫在前、非金屬在後（原則 3）。"], ["NaCl，讀作「鈉化氯」", 0, "中文名稱和元素符號的順序<b>相反</b>：NaCl → 氯化鈉。"]],
        K.track(() => { S.q = 1; shown = null; draw(say("✅ 由金屬與非金屬組成的化合物，金屬符號在前；中文名稱順序相反（p.188）。另外：金屬由許多原子堆積而成，化學式只寫元素符號，例如鎂 Mg；鈍氣是單原子，氦 He。", true)); done(); }));
      const t = G[S.g];
      handMC(q, `${t.n}分子的化學式怎麼寫？`, [[t.f, 1], ...t.bad.map(([f, w]) => [f, 0, w])],
        K.track(() => { S.g++; S.have = {}; S.built = false; shown = null; draw(say(`✅ ${t.n}：${t.f}。`, true)); }));
    }
    K.draw = draw; draw("");
  }

  /* ⑤ 圖 6-22：把粒子圖拖進混合物／元素／化合物 */
  function actSort(box, done){
    const P = [["mg", "鎂 Mg", "el"], ["ar", "氬 Ar", "el"], ["o2", "氧 O₂", "el"], ["o3", "臭氧 O₃", "el"], ["co", "一氧化碳 CO", "cp"], ["h2o", "水 H₂O", "cp"], ["air", "空氣", "mx"]];
    const BIN = {mx: ["混合物", 60], el: ["元素", 180], cp: ["化合物", 300]};
    const ball = (x, y, c, r) => `<circle cx="${x}" cy="${y}" r="${r || 5}" fill="${c}" stroke="#555" stroke-width=".6"/>`;
    const pic = k => ({mg: [[-8, -6], [0, -6], [8, -6], [-8, 2], [0, 2], [8, 2]].map(([a, b]) => ball(a, b, "#9775fa")).join(""),
      ar: ball(-10, -4, "#94d82d") + ball(8, -6, "#94d82d") + ball(0, 6, "#94d82d"),
      o2: ball(-12, -2, "#e64980") + ball(-4, -2, "#e64980") + ball(6, 4, "#e64980") + ball(14, 4, "#e64980"),
      o3: ball(-8, 0, "#e64980") + ball(0, -6, "#e64980") + ball(8, 0, "#e64980"),
      co: ball(-10, -2, "#343a40") + ball(-2, -2, "#e64980") + ball(6, 5, "#343a40") + ball(14, 5, "#e64980"),
      h2o: ball(-8, 0, "#e64980", 6) + ball(-15, 6, "#fff", 3.5) + ball(-1, 6, "#fff", 3.5) + ball(10, -4, "#e64980", 6) + ball(4, 2, "#fff", 3.5) + ball(17, 2, "#fff", 3.5),
      air: ball(-12, -6, "#4c6ef5") + ball(-5, -6, "#4c6ef5") + ball(8, -6, "#e64980") + ball(15, -6, "#e64980") + ball(-6, 6, "#94d82d") + ball(6, 6, "#343a40") + ball(12, 6, "#e64980", 4)}[k]);
    const K = handKit(box, `<div class="htask"></div><div class="simview"><svg viewBox="0 0 360 290"></svg></div><div data-q></div><div data-fb></div>`, () => ({in: {}, q: 0}));
    const svg = box.querySelector("svg");
    function draw(msg){
      const S = K.S; let g = "";
      Object.entries(BIN).forEach(([b, [n, x]]) => { g += `<rect x="${x - 56}" y="150" width="112" height="134" rx="10" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/><text x="${x}" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${n}</text>`;
        P.filter(p => S.in[p[0]] === b).forEach((p, j) => { g += `<g transform="translate(${x - 30 + (j % 2) * 60} ${192 + Math.floor(j / 2) * 34})">${pic(p[0])}</g><text x="${x - 30 + (j % 2) * 60}" y="${210 + Math.floor(j / 2) * 34}" text-anchor="middle" font-size="7" fill="var(--sub)">${p[1]}</text>`; }); });
      P.filter(p => !S.in[p[0]]).forEach((p, j) => { const x = 30 + (j % 6) * 58, y = 36 + Math.floor(j / 6) * 64;
        g += `<g data-it="${p[0]}" transform="translate(${x} ${y})"><rect x="-26" y="-24" width="52" height="56" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>${pic(p[0])}<text x="0" y="26" text-anchor="middle" font-size="8" fill="var(--ink)">${p[1]}</text></g>`; });
      svg.innerHTML = g;
      box.querySelector(".htask").innerHTML = "看粒子圖：把每一種物質拖進<b>混合物、元素、化合物</b>（圖 6-22）。顏色不同代表不同種原子。";
      if(msg !== undefined) box.querySelector("[data-fb]").innerHTML = msg;
      quiz(); K.ctl.upd();
    }
    handDnd(svg, {name: k => P.find(p => p[0] === k)[1], drop: K.track((k, x, y) => {
      const S = K.S; if(y < 145) return draw();
      const b = x < 120 ? "mx" : x < 240 ? "el" : "cp", p = P.find(q => q[0] === k);
      if(p[2] !== b){
        const why = p[2] === "mx" ? "空氣裡有好幾種不同的粒子（氮氣、氧氣、氬氣、二氧化碳），是混合物。"
          : p[2] === "el" ? `${p[1]}的粒子都只有<b>同一種原子</b>（顏色都一樣），是元素。${k === "o3" ? "臭氧雖然一個分子有 3 個原子，但都是氧原子。" : ""}`
          : `${p[1]}的每個粒子都由<b>不同種類的原子以固定比例</b>結合而成，而且粒子都一樣——是化合物（純物質），不是混合物。`;
        return draw(say(why));
      }
      S.in[k] = b; return draw(P.every(q => S.in[q[0]]) ? say("✅ 全部分好了！元素由同一種原子構成；化合物由不同種類的原子以固定比例結合而成（p.186）。", true) : "");
    })});
    let shown = null;
    function quiz(){
      const S = K.S, q = box.querySelector("[data-q]"), key = P.every(p => S.in[p[0]]) && !S.q ? "x" : "";
      if(shown === key) return; shown = key;
      if(!key){ q.innerHTML = ""; return; }
      handMC(q, "例題 6-3：有固定沸點，而且隔絕空氣加熱會分解成兩種新物質的，可能是哪一類？", [["化合物", 1], ["元素", 0, "元素無法再用化學方法分解成更簡單的物質。"], ["混合物", 0, "混合物沒有固定的沸點。"]],
        K.track(() => { S.q = 1; shown = null; draw(say("✅ 純物質（元素、化合物）都有固定沸點；只有化合物能再分解（例如水可以分解成氫和氧）。", true)); done(); }));
    }
    K.draw = draw; draw("");
  }
}});

function home(){
  $("#backlab").hidden = true;
  $("#pnum").textContent = `完成 ${LABS.filter(l => DONE[l.id]).length} / ${LABS.length}`;
  $("#app").innerHTML = `<header><div class="kicker">八年級上 · 動手做實驗室</div><h1>🔬 自己動手做實驗</h1>
    <p class="muted">把器材拖到正確的位置（或先點器材、再點位置）。做錯會出事——出事以後要先選對急救方法，才能回到出事前重做。每個實驗都有「⏸ 暫停」「↩ 上一步」「🔁 全部重來」。步驟照康軒第三冊課本。</p></header>`
    + CHAPTERS.map(([c, n]) => { const L = LABS.filter(l => l.ch === c); return `<h3>${n}</h3>` + (L.length ? `<div class="grid">${L.map(l => `<button class="xp" onclick="location.hash='#/${l.id}'"><span class="ic">${l.icon}</span><span><b>${esc(l.title)}</b><small>${esc(l.desc)}</small><small>課本 ${l.page}${DONE[l.id] ? ' · <span class="done">✅ 做完了</span>' : ""}</small></span></button>`).join("")}</div>` : `<p class="muted soon">製作中，敬請期待。</p>`); }).join("");
}
function route(){
  const id = location.hash.replace(/^#\/?/, ""), L = LABS.find(l => l.id === id);
  window.scrollTo(0, 0);
  if(!L) return home();
  $("#backlab").hidden = false; $("#pnum").textContent = "課本 " + L.page;
  $("#app").innerHTML = `<header><div class="kicker">${esc(CHAPTERS.find(c => c[0] === L.ch)[1])}</div><h1>${L.icon} ${esc(L.title)}</h1></header><div id="lpane"></div>`;
  L.run($("#lpane"), L);
}
$("#backlab").onclick = () => { location.hash = ""; };
window.addEventListener("hashchange", route); route();
</script>
